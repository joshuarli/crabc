[workspace]
members = [
    "ldso",
    "libc",
    "crabc-core",
    "crabc-rs",
    "crabc-mimalloc",
    "compat/allocator/test-adapter",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshuarli/crabc"

[profile.dev]
panic = "abort"
overflow-checks = false
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
