[workspace]
members = [
    "crt",
    "ldso",
    "libc",
    "crabc-core",
    "crabc-rs",
    "crabc-mimalloc",
    "compat/allocator/test-adapter",
    "compat/allocator/runtime-ticket-zero-adapter",
    "compat/allocator/native-mi-adapter",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshuarli/crabc"

[profile.dev]
incremental = false
debug = "line-tables-only"
split-debuginfo = "unpacked"
panic = "abort"
overflow-checks = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = false

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
