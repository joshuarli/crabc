name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CRABC_X86_64_CORE_IMAGE: crabc-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the native image
        run: docker build --platform linux/amd64 -f docker/Dockerfile.x86_64 -t crabc-ci .
      - name: Fetch locked dependencies
        run: scripts/lanes/rust-check.sh cargo fetch --locked
      - name: lint
        run: make lint
