name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  aarch64-compatibility-laboratory:
    # The project matures on native Linux/AArch64 first. All compilation and
    # oracle tooling live in the same pinned Docker image used on Apple
    # Silicon development hosts.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Build the pinned native development image
        run: ./scripts/dev.sh image

      - name: Build crabc
        run: ./scripts/dev.sh build

      - name: Exercise loader startup without application stderr leakage
        run: ./scripts/dev.sh test --test ldso_real_binary

      - name: Enforce public-dynamic-symbol compatibility ratchet
        run: ./scripts/dev.sh compat

      - name: Compare foundational behavior with pinned musl
        run: ./scripts/dev.sh differential foundational

      - name: Capture upstream functional evidence
        continue-on-error: true
        run: ./scripts/dev.sh libc-test functional
