[package]
name = "crabc-ldso"
version.workspace = true
edition.workspace = true
description = "A Rust dynamic linker for musl-linked ELF binaries"
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
name = "ldso"
crate-type = ["cdylib"]
test = false

[features]
# The installed x86-64 product: general initial graph, lifecycle, initial TLS
# and RuntimeV1 handoff, plus loader-owned worker materialization.
x86_64-owned-dynamic-runtime = []
