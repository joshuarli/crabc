[package]
name = "crabc-rs"
version = "0.3.0"
edition = "2021"
description = "An idiomatic Rust interface to crabc"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mengzhuo/crabc"
readme = "../README.md"

[lib]
name = "crabc_rs"
path = "src/lib.rs"

