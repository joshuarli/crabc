required-features = ["alloc"]

[features]
default = ["std"]
alloc = []
std = ["alloc"]
# Link the native `dl` facade against crabc's private singleton-runtime table.
# This is deliberately opt-in: ordinary Rust test executables do not load
# crabc's `libc.so`, while a crabc process supplies the required table.
runtime-loader = []
# Link the raw native thread/TLS facade against libc's private singleton-runtime
# table. This is separately opt-in because ordinary Rust tests do not load
# crabc's libc and therefore cannot provide the private getter.
runtime-thread = []
# Link the owned CFile memory-stream facade against libc's private
# singleton-runtime table. Ordinary Rust processes do not provide this table.
runtime-stdio = []
# Add the owned Rust closure/result layer. Keeping it separate leaves the raw
# no-std runtime boundary usable without an allocator.
runtime-thread-alloc = ["runtime-thread", "alloc"]

[dependencies]
crabc-core = { path = "../crabc-core" }
bitflags = { version = "2.4.0", default-features = false }
