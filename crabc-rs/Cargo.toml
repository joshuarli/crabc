[package]
name = "crabc-rs"
version = "0.3.0"
edition = "2021"
description = "An idiomatic Rust interface to crabc"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mengzhuo/crabc"
readme = "../README.md"

[lib]
name = "crabc_rs"
path = "src/lib.rs"

[[example]]
name = "m0_direct_probe"
path = "examples/m0_direct_probe.rs"
crate-type = ["staticlib"]

[[example]]
name = "m2_direct_probe"
path = "examples/m2_direct_probe.rs"
crate-type = ["staticlib"]

[[example]]
name = "m3_direct_probe"
path = "examples/m3_direct_probe.rs"
crate-type = ["staticlib"]

[[example]]
name = "m4_direct_probe"
path = "examples/m4_direct_probe.rs"
crate-type = ["staticlib"]

[[example]]
name = "m5_direct_probe"
path = "examples/m5_direct_probe.rs"
crate-type = ["staticlib"]

[[example]]
name = "m6_direct_probe"
path = "examples/m6_direct_probe.rs"
crate-type = ["staticlib"]

[[example]]
name = "m7_sync_direct_probe"
path = "examples/m7_sync_direct_probe.rs"
crate-type = ["staticlib"]

[[example]]
name = "m7_resolver_direct_probe"
path = "examples/m7_resolver_direct_probe.rs"
crate-type = ["staticlib"]

[[example]]
name = "m7_loader_runtime_probe"
path = "examples/m7_loader_runtime_probe.rs"
crate-type = ["staticlib"]

[[example]]
name = "m7_runtime_thread_probe"
path = "examples/m7_runtime_thread_probe.rs"
crate-type = ["staticlib"]

[[example]]
name = "m8_fenv_direct_probe"
path = "examples/m8_fenv_direct_probe.rs"
crate-type = ["staticlib"]

[[example]]
name = "m8_fnmatch_direct_probe"
path = "examples/m8_fnmatch_direct_probe.rs"
crate-type = ["staticlib"]

[[example]]
name = "m8_cfile_direct_probe"
path = "examples/m8_cfile_direct_probe.rs"
crate-type = ["staticlib"]

[features]
default = ["std"]
alloc = []
std = ["alloc"]
# Link the native `dl` facade against crabc's private singleton-runtime table.
# This is deliberately opt-in: ordinary Rust test executables do not load
# crabc's `libc.so`, while a crabc process supplies the required table.
runtime-loader = []
# Link the raw native thread/TLS facade against libc's private singleton-runtime
# table. This is separately opt-in because ordinary Rust tests do not load
# crabc's libc and therefore cannot provide the private getter.
runtime-thread = []
# Link the owned CFile memory-stream facade against libc's private
# singleton-runtime table. Ordinary Rust processes do not provide this table.
runtime-stdio = []
# Add the owned Rust closure/result layer. Keeping it separate leaves the raw
# no-std runtime boundary usable without an allocator.
runtime-thread-alloc = ["runtime-thread", "alloc"]

[dependencies]
crabc-core = { path = "../crabc-core" }
bitflags = { version = "2.4.0", default-features = false }
