[package]
name = "crabc-libc"
version.workspace = true
edition.workspace = true
description = "A Rust no_std musl-compatible libc implementation"
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
name = "c"
crate-type = ["cdylib", "staticlib"]
test = false
bench = false

[features]
default = []
# Permanent stdin/stdout/stderr formatted-I/O forwarding is a distinct opt-in
# archive: the frozen byte-string format/scan default surface remains unchanged
# until its stream-specific evidence and export registration are integrated.
x86-stdio-permanent-format-scan = []
# Private Linux/x86-64 parity evidence for the same C allocator backend used
# by the active AArch64 runtime. Keeping this opt-in prevents the existing
# dependency-free selected-static artifacts from silently acquiring bundled C
# allocator objects before the wider x86 runtime composition is ready.
x86-allocator-runtime = ["dep:libmimalloc-sys"]
# A separate opt-in allocation-client leaf keeps strdup/strndup out of the
# completed allocator-wrapper object's exact public surface. It reuses only
# that feature's private wrapper/backend boundary and does not select a wider
# string or allocator runtime.
x86-allocator-string-duplication = ["x86-allocator-runtime"]
# Legacy C temporary-name generation returns an allocator-owned pathname from
# tempnam while tmpnam retains its source-compatible static-buffer path. Keep
# both opt-in over the already audited strdup client so the default archive
# neither gains racy pathname APIs nor a bundled allocator dependency.
x86-temporary-names = ["x86-allocator-string-duplication"]
# `scandir` is a separate allocation client over the selected C directory and
# allocator boundaries. Keeping it opt-in leaves the dependency-free directory
# stream artifact and the default x86 static export root unchanged.
x86-scandir = ["x86-allocator-runtime"]
# The historical ftw/nftw tree walker is an allocation-free directory client.
# Keep it opt-in so the frozen selected-static archive does not silently add
# callback-driven traversal or process-CWD mutation entry points.
x86-filesystem-traversal = []
# The environment owner needs the same C allocation provider as musl's
# setenv/putenv vector and string bookkeeping. Keep it opt-in so existing
# dependency-free selected-static artifacts do not silently acquire it.
x86-environment-runtime = ["x86-allocator-runtime"]
# Private Linux/x86-64 POSIX spawn file-actions lifecycle evidence.  The
# operation records own real pathname copies and therefore compose with the
# already evidenced x86 C allocator wrapper; keeping this opt-in leaves the
# dependency-free selected-static archive unchanged.
x86-posix-spawn-file-actions = ["x86-allocator-runtime"]
# Private Linux/x86-64 direct process-image replacement. This reuses the
# selected environment and byte-string substrates plus private raw mappings
# for variadic argv vectors, but does not select fork, vfork, spawn, or an
# allocator/runtime composition.
x86-process-exec = []
# Complete the distinct strong AArch64 allocator-observation entry only for
# its closed capability gate. This implies the private allocation backend but
# does not widen the earlier basic-wrapper artifact's exact object surface.
x86-allocator-observability = ["x86-allocator-runtime"]
# Private Linux/x86-64 h_errno accessor/object evidence. This retains only
# the selected bootstrapped-main and selected-pthread-worker status slots;
# it does not select resolver configuration, DNS, netdb, or a general TCB.
x86-h-errno = []
# Pinned musl's historical microsecond ITIMER_REAL adapter is independently
# evidenced. Keep it opt-in so the frozen default archive does not silently
# acquire process-global timer mutation or imply signal/timer-family closure.
x86-ualarm = []
# Pinned musl's public getitimer/setitimer pair is an independently evidenced
# process-global interval-timer control boundary. Keep it opt-in so the frozen
# dependency-free selected-static archive remains unchanged until the
# provider's feature archive and ledger artifact are integrated.
x86-interval-timers = []
# Private Linux/x86-64 file-handle syscall evidence.  The pair remains
# opt-in so the frozen dependency-free selected-static archive does not gain
# filesystem-handle authority before the wider filesystem family closes.
x86-file-handles = []
# Private Linux/x86-64 resolver-runtime evidence. The C ABI state owner uses
# the separately evidenced h_errno state owner plus the existing stateless
# no_std DNS transport. It remains opt-in after its bounded evidence closes so
# the frozen default archive does not silently acquire resolver state or I/O.
x86-resolver-runtime = ["dep:crabc-core", "x86-h-errno"]
# Private Linux/x86-64 evidence for the existing bounded SHA-crypt C ABI.
# `sha-crypt` owns the MCF result temporarily. The target-local adapter bridges
# only to the final link's C malloc/aligned_alloc/free symbols; this does not
# enable x86-allocator-runtime or select an allocator backend, lifecycle, or
# wider x86 C runtime. Directly selecting it with x86-allocator-runtime stays
# rejected so provider ownership cannot depend on an incidental feature set.
x86-crypt = ["dep:base64ct", "dep:sha-crypt"]
# The only audited route that composes the private SHA-crypt adapter with the
# x86 allocator wrapper/backend. This adds no callable or capability: it names
# the allocation-provider contract and keeps a manual pair selection rejected.
x86-crypt-allocator-composition = ["x86-crypt", "x86-allocator-runtime"]
# The frozen legacy.misc aggregate has five separately evidenced default-root
# prerequisites.  Keep its remaining fmtmsg/setkey/encrypt C ABI owner opt-in
# until this private aggregate has its own closed x86 evidence; otherwise the
# selected-static export contract would silently widen.  `encrypt`/`setkey`
# deliberately retain the established inert-DES compatibility result rather
# than selecting or implementing a cryptographic subsystem.
x86-legacy-misc = []
# Private x86 binary80 evidence for the exact musl `fdiml` and GNU
# `exp10l`/weak-`pow10l` closure.  It intentionally has no default-root or
# dependency effect: the focused runner is the only current consumer.
x86-math-long-double-completion = []
# Pinned musl's `signal.c` exports two historical weak spellings at the exact
# `signal` address. Keep this ABI-only compatibility leaf opt-in so the frozen
# selected-static archive does not silently gain legacy signal names.
x86-signal-legacy-aliases = []
# The four historical System V signal helpers are an independently evidenced
# private closure over the existing x86 signal foundation. Keep it opt-in so
# the frozen selected-static archive does not imply a wider signal runtime.
x86-signal-sysv-helpers = []
# Pinned musl's psignal/psiginfo pair is a reporting operation over the
# existing permanent stderr/errno/strsignal substrate. Keep it opt-in: the
# frozen default archive deliberately rejects diagnostics and these two public
# spellings until this feature's closed static differential is selected.
x86-signal-reporting = []
# Pinned musl's iopl/ioperm pair is a direct privileged-kernel permission
# boundary. Keep it opt-in so the default archive does not silently gain I/O
# privilege mutation entry points before its negative-path evidence closes.
x86-io-permissions = []
# Pinned musl's round-robin interval wrapper is a direct scheduler-observation
# seam. Keep it opt-in until its C ABI/error/TLS differential is selected,
# leaving the frozen default archive free of scheduler query entry points.
x86-sched-rr-interval = []
# Pinned musl's explicit_bzero/swab pair is a small byte-range compatibility
# boundary. Keep it opt-in until its optimizer-retention and pair-copy proof
# closes, preserving the frozen default C ABI surface.
x86-memory-special = []
# Pinned musl's a64l decoder shares source provenance with the default l64a
# encoder but uses its own immutable 64-byte table scan, with no byte-string
# archive dependency. Keep it opt-in so the default archive remains the frozen
# one-symbol l64a source split.
x86-a64l = []
# Pinned musl's stateless sethostent/setnetent pair shares one strong/weak ELF
# alias body. Keep both names opt-in so the default archive stays free of
# legacy netdb setter symbols and no resolver/database state is implied.
x86-netdb-setent = []
# Pinned musl's three spin-object operations share one exact atomic state
# machine with the separately evidenced init/destroy leaves. Keep the
# acquisition/release extension opt-in so the frozen selected-static archive
# does not silently acquire synchronization entry points.
x86-pthread-spin-operations = []

[target.'cfg(all(target_os = "linux", target_arch = "aarch64", target_endian = "little"))'.dependencies]
crabc-core = { path = "../crabc-core" }
crabc-mimalloc = { path = "../crabc-mimalloc" }
libm = "0.2"
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended"] }
# RustCrypto's SHA-crypt implementation and MCF serializer. `alloc` is used
# only for the dependency-owned temporary password-hash string; its allocator
# is the existing mimalloc-backed C allocation strategy in `crypt_impl.rs`.
base64ct = { version = "1.8", default-features = false }
sha-crypt = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64", target_endian = "little"))'.dependencies]
crabc-core = { path = "../crabc-core", optional = true }
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended"], optional = true }
# These are the same approved RustCrypto packages used by the active AArch64
# crypt profile. Keeping them optional confines their alloc-enabled MCF path
# to the separately evidenced x86 `x86-crypt` leaf.
base64ct = { version = "1.8", default-features = false, optional = true }
sha-crypt = { version = "0.6", default-features = false, features = ["alloc", "password-hash"], optional = true }

# The repository-level C and loader fixtures remain in ../tests so their
# evidence paths are stable. Explicit targets make crabc-libc their owner
# after the workspace root becomes virtual, while preserving one process per
# test target and Cargo's existing parallel execution topology.

