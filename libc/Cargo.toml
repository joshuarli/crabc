[package]
name = "crabc-libc"
version = "0.3.0"
edition = "2021"
description = "A Rust no_std musl-compatible libc implementation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mengzhuo/crabc"
readme = "README.md"

[lib]
name = "c"
crate-type = ["cdylib", "staticlib"]
test = false
bench = false

[dependencies]
crabc-core = { path = "../crabc-core" }
libm = "0.2"
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended"] }
# RustCrypto's SHA-crypt implementation and MCF serializer. `alloc` is used
# only for the dependency-owned temporary password-hash string; its allocator
# is the existing mimalloc-backed C allocation strategy in `crypt_impl.rs`.
base64ct = { version = "1.8", default-features = false }
sha-crypt = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
