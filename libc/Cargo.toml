[package]
name = "crabc-libc"
version.workspace = true
edition.workspace = true
description = "A Rust no_std musl-compatible libc implementation"
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
name = "c"
crate-type = ["cdylib", "staticlib"]
test = false
bench = false

[target.'cfg(all(target_os = "linux", target_arch = "aarch64", target_endian = "little"))'.dependencies]
crabc-core = { path = "../crabc-core" }
crabc-mimalloc = { path = "../crabc-mimalloc" }
libm = "0.2"
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended"] }
# RustCrypto's SHA-crypt implementation and MCF serializer. `alloc` is used
# only for the dependency-owned temporary password-hash string; its allocator
# is the existing mimalloc-backed C allocation strategy in `crypt_impl.rs`.
base64ct = { version = "1.8", default-features = false }
sha-crypt = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }

# The repository-level C and loader fixtures remain in ../tests so their
# evidence paths are stable. Explicit targets make crabc-libc their owner
# after the workspace root becomes virtual, while preserving one process per
# test target and Cargo's existing parallel execution topology.

