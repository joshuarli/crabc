# Initial Linux/AArch64 Rustix correspondence inventory.
#
# This is intentionally a bounded M0 seed, not a parity claim.  Entries become
# ``implemented`` and then ``verified`` only after a native Rust facade and an
# isolated dual-backend test exist.  ``crabc`` names the intended public Rust
# path, not a call through the C/POSIX ABI.
schema = "crabc.rustix-api/v1"
target = "aarch64-unknown-linux-musl"
upstream = "upstream.toml"

[reference]
repository = "https://github.com/bytecodealliance/rustix"
version = "1.1.4"
revision = "cf67411d572468d5fc39e8ac8b4e649ae3e5e9ec"

[policy]
production_dependency = false
comparison_backend = "rustix-linux-raw"
candidate_backend = "crabc-rs-native"
stateful_operations_require_isolated_process = true
representative_operation = "fs::openat"
representative_fixture = "compat/rustix/source/fs_openat.rs"
representative_backend_boundary = "direct-crabc-core"
direct_c_abi_errno_roundtrip = false
forbidden_backend_layers = ["public libc/POSIX ABI", "TLS errno readback"]

[[api]]
id = "io.errno"
feature = "default"
rustix = "io::Errno"
crabc = "io::Errno"
status = "verified"
compatibility = "native-equivalent"
tests = ["crabc-rs/tests/m1_foundation.rs", "compat/rustix/source/m1_foundation.rs", "compat/rustix/tests/test_harness.py"]

