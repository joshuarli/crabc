# Every normal development command uses the versions below; no tool fetches an
# upstream default branch. Docker-resolved pins are mirrored here as the
# repository's canonical compatibility identity, while other sources are
# registered before their future harnesses need them.

[environment]
platform = "linux/arm64"
alpine_image = "alpine:3.24.1@sha256:e7a1a92a5bfeee40966aea60f0796b0e7917cc35591542701834f03a68fa3d18"
rust_toolchain = "nightly-2026-07-24"

[musl]
version = "1.2.6"
source = "https://musl.libc.org/releases/musl-1.2.6.tar.gz"
sha256 = "d585fd3b613c66151fc3249e8ed44f77020cb5e6c1e635a616d3f9f82460512a"
# Docker uses this only when the SHA-256-verified primary release host is
# unavailable. The revision is the upstream v1.2.6 release commit; checkout
# verifies it before the source build can proceed.
fallback_repository = "https://github.com/ifduyue/musl.git"
fallback_revision = "9fa28ece75d8a2191de7c5bb53bed224c5947417"

[linux_5_10_uapi]
# Native x86 header evidence treats this as a kernel-header input only.  The
# derived identity is the deterministic output of `make ARCH=x86
# headers_install`, not an ambient distribution include tree.
version = "5.10"
source = "https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-5.10.tar.xz"
sha256 = "dcdf99e43e98330d925016985bfbc7b83c66d367b714b2de0cbbfcbf83d8ca43"
architecture = "x86_64"
headers_install_arch = "x86"
exported_header_count = 935
exported_header_manifest_sha256 = "00cdc98ceb35926f68dc57dc0d84a989a6df4f60f84b1ae5981b54bb1088eb0e"

[libc_test]
# Laputa Systems carries the maintained libc-test fork. Pin the commit rather
# than its moving master branch so every compatibility report stays reproducible.
repository = "https://github.com/laputa-systems/libc-test.git"
revision = "68edb8bd73dab8147ee54c8bec638f4d2b3cff37"

[os_test]
repository = "https://gitlab.com/sortix/os-test.git"
revision = "5e9456d510612f83b6ec8b1a0c06d6b1303a2512"

[libc_bench]
repository = "https://git.musl-libc.org/git/libc-bench"
revision = "b6b2ce5f9f87a09b14499cb00c600c601f022634"

[lua]
version = "5.4.8"
source = "https://www.lua.org/ftp/lua-5.4.8.tar.gz"
sha256 = "4f18ddae154e793e46eeab727c59ef1c0c0c2b744e7b94219710d76f530629ae"

[mimalloc]
version = "3.5.0"
repository = "https://github.com/microsoft/mimalloc.git"
tag = "v3.5.0"
source = "https://codeload.github.com/microsoft/mimalloc/tar.gz/refs/tags/v3.5.0"
sha256 = "1e432f0559a4ab512143b9bff7a700541a2c8d4712b26a72de3e0222790da305"
# The release tag is annotated.  Record both identities so the archive pin is
# traceable to the immutable upstream tag object and its peeled source commit.
tag_object = "438b0c4b78d2599aede7fca3ddacc28863b0eae8"
revision = "18b08671c9302247bfb682286e6bf3cc1773f801"
archive_root = "mimalloc-3.5.0"
