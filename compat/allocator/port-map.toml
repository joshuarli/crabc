pped PageMap/alias/primary/mapping release, and retain a failed-munmap published owner terminally. A second later-main endpoint maps only a sole medium regular page with one live block into the main bitmap plus paired static Heap::abandoned_count[bin]; its final free uses the mapped collection prefix and accepts only empty-before-reclaim. Full medium and full large `BIN_FULL` routes plus full non-direct-small and direct-small regular-bin routes use the raw initially-unmapped tail through the mostly-used boundary before they reabandon to exact static-main bitmap/count pairs. Non-direct full small requires `block_size > SMALL_SIZE_MAX`, `used == reserved`, and no direct-cache image. Direct full small requires `block_size <= SMALL_SIZE_MAX`, `reserved >= 16`, `used == reserved`, its exact rounded direct-cache range, and direct-range clearing before page-count detach; its partial collector retains the just-published head. The sole nonfull small-or-medium route uses a linear short-locked process route and `free_mapped_after_failed_reclaim`; a direct small member verifies and clears its rounded source direct-cache range, uses partial collection with `reserved >= 16`, and the common `used < reserved` guard excludes both full-small classes. The separately recorded sole-medium handoff is its only consuming allocation-time adoption. The aggregate regular-pages route uses the same tail through `free_mapped_after_failed_reclaim_select_map`, selecting the exact static-main map only after it has claimed the page low bit; PageMap plus bitmap/count membership replaces a raw page list. Both process routes preserve pairing while nonempty and clear map/bit/count before owner-specific final release; the aggregate route re-derives each regular span before terminal release and does not adopt, reclaim, or requeue any registry member. The raw initially-unmapped helper otherwise has no raw terminal release or general routing. General direct-small allocation-time adoption, reclaim, or requeue, other full/singleton/unmapped/huge owner exit, non-arena forms beyond the exact OS singleton, foreign, normal abandoning sessions, general producer routing, terminal reuse, OS-list traversal/reclaim/requeue, and multi-arena routing remain absent."
