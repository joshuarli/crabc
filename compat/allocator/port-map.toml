production_contract = "This is a compile-time, nondefault early-shadow lane. Production native_free, native_reallocate, and native_usable_size take one coherent PageMap observation. native_free_pointer_first_nonlocal is the only nonlocal free continuation and calls W03's page-owned source tail: PublishedToOwner, StillLive, and Released become Freed; post-CAS Retained becomes terminal Retained; Detached rejects as NotOwnerAssociated and becomes Retained without runtime terminalization. A's teardown releases A's admission independently; fresh B owns only its own persistent owner, and B finishes only B's own owner. There is no route, registry, exact-client ledger scan, scheduler bridge, or B-held completion. The legacy ticket-zero and post-exit facade is #[cfg(test)] historical oracle code only, not a production mapping. Nonlocal realloc first establishes B's persistent owner, captures source PageMap facts, allocates/copies the bounded prefix, then consumes the source through that same pointer-first nonlocal free; usable size returns the captured extent."
