rust_item = "DynamicTheapAttachment/DynamicHeapBinding, DynamicTheapPageSession, DynamicTheapPageDrainSession, DynamicThreadExitDrain, DynamicThreadExitSingletonHandoff, DynamicThreadExitArenaSingletonPostExitRoute, DynamicPostExitArenaOwner, DynamicThreadExitFullOsSingletonPagesRoute, DynamicThreadExitFullMediumHandoff, DynamicThreadExitFullMediumPagesRoute, DynamicThreadExitFullLargePagesRoute, DynamicThreadExitFullLargeHandoff, DynamicThreadExitFullNonDirectSmallPagesRoute, DynamicThreadExitFullNonDirectSmallHandoff, DynamicThreadExitFullDirectSmallHandoff, DynamicThreadExitMappedOneBlockHandoff, DynamicThreadExitMappedMediumPairRoute, DynamicThreadExitMappedTwoBlockMediumHandoff, DynamicThreadExitMappedTwoBlockLargeHandoff, DynamicThreadExitMappedTwoBlockNonDirectSmallHandoff, and DynamicThreadExitMappedTwoBlockDirectSmallHandoff; DynamicTheapPageMode source option images; sealed TheapPageSession/PageAllocatorEngine dynamic specialization; MainSubprocess::issue_later_thread_ticket; DynamicAttachedThreadLocalData; caller-pinned Heap::initialize_dynamic_binding; exact typed dynamic Theap metadata; regular-slot then canonical-empty-cached publication with paired dynamic `1 -> 2` / `2 -> 1` references; source-ordered post-TLS retired-page force collection, singleton, detached arena-singleton post-exit owner, full-OS-singleton, full-medium, full-large, full-non-direct-small, full-direct-small, mapped-one-block, exact mapped-medium-pair, and mapped-two-block medium/large/non-direct-small/direct-small drains, and no-page teardown; and AwaitingKeyRelease"
intentional_difference = "One private current-thread owner only binds a caller-pinned pristine Heap to one later-ticket metadata TLD, typed dynamic-Theap metadata, regular backing, and a linear regular-key lease. It observes the shared selector and atomically refuses ticket zero while the static branch is open, active, or retained; it does not itself run process initialization. It performs source Theap/list/random/cookie/Release publication, regular-slot publication, then canonical-empty cached-root store and exact paired dynamic reference. Default/fast remain unchanged; foreign cached roots reject before ticket issue. Ordinary dynamic begin stores source `allow_page_abandon=true`/`page_full_retain=2` and rejects page-session construction. Only a crate-private unsafe begin stores source-reachable `false`/`-1` before publication and creates a sealed borrowed session for the shared private page engine. A cfg(test)-only ordinary fixture validates the exact source `true`/`2` image solely to form an `MI_ABANDON` aggregate proof; it does not expose a production ordinary page session. Its consuming finish requires a drained lifecycle; unfinished Drop, retained collection poison, or pending OS release latches the attachment terminally, and any pending OS release owner transfers into that retained attachment. That session additionally has one consuming same-owner handoff for a mapped regular arena page through its exact heap-local abandoned bit/count: it can adopt the page or apply one same-origin allow-collect remote free and requeue after reassociation. Its all-free dynamic-arena result performs the bounded queue-detached span release; an existing owner or later release failure stays terminal. Separately, `DynamicThreadExitDrain` clears the dynamic regular slot, force-collects one already-retired all-free regular page, then accepts a full one-block arena or OS-aligned singleton; four separate sole full `MemoryKind::Arena` classes—medium or large in `BIN_FULL`; non-direct small with `SMALL_SIZE_MAX < block_size <= SMALL_MAX_OBJ_SIZE`, an empty direct image, and `used == reserved`; or direct small with `block_size <= SMALL_SIZE_MAX`, `reserved >= 16`, `used == reserved`, and its complete rounded direct-cache range—that force then false collect, detach, and enter the raw initially-unmapped failed-reclaim tail; four matching exact-one-joined-remote branches that force then false collect to `used == reserved - 1`, remove the still-linked source member, clear the direct-small range before page-count detach, and immediately publish mapped state; and four separate sole nonfull mapped arena classes with `reserved > 1` and `used == 1`: medium; large with its complete 64-slice terminal span; non-direct small with `SMALL_SIZE_MAX < block_size <= SMALL_MAX_OBJ_SIZE` and an empty direct image; or direct small with `block_size <= SMALL_SIZE_MAX`, `reserved >= 16`, and its complete rounded direct-cache range. The large full route retains its complete 64-slice span through terminal release. A stale direct range rejects before collection or detach; a valid range clears after queue removal and before page-count detach. The mapped endpoint keeps only the exact dynamic bitmap/count capability through source force -> false collection -> queue/page-count detach -> mapped unown; normal classes use the normal collector and direct small uses the partial collector, each requiring empty before reclaim and clearing that pair before PageMap -> ordinary-bit -> metadata -> slice release. It cannot reclaim, adopt, requeue, scan, or represent another page/free. The OS singleton is exactly `MemoryKind::Os`, `reserved == used == 1`, and `BIN_FULL`; its ordinary block size may be small. It links the exact page into the dynamic Heap's `os_abandoned_pages` list after queue/count detach and before common unown, then removes it before clipped PageMap -> alias -> primary-metadata -> mapping release. An injected failed `munmap` retains its unique mapping owner terminally. Sep