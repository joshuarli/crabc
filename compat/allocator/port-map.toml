[[unit]]
upstream = "src/page.c"
source_region = "page lifecycle; includes page-queue.c"
rust_module = "crabc_mimalloc::page, crabc_mimalloc::free_list, crabc_mimalloc::remote_free, crabc_mimalloc::abandoned, crabc_mimalloc::types, and crabc_mimalloc::single_thread"
rust_item = "partial: geometry, fresh ordinary-page initialization, scalar free-list lifecycle, source candidate search/full retention, retirement, full-span release, bounded remote-list collection including small partial-head collection, mapped abandon/adopt or same-origin remote-free reassociation, the raw unmapped failed-reclaim decision tail, and post-root-transition force-retirement plus dynamic singleton and mapped-one-block-medium/non-direct-small/direct-small, later-main singleton, full-medium/full-large/full-non-direct-small/full-direct-small unmapped-to-mapped, the exact full-medium one-remote-free force-collection-to-mapped transition, sole small-or-medium, and aggregate-regular-pages post-exit all-free release"
intentional_difference = "Remote collection and general abandonment are not yet integrated with queues or thread lifecycle. The separately recorded dynamic same-owner mapped-regular handoff, including one allow-collect remote free and all-free queue-detached arena release, is one queue-integrated exception. Two source-shaped root-cleared owners admit a full singleton handoff: dynamic clears its regular slot, while later-main clears fixed fast and additionally proves the singleton is the drain's sole page before detach. Each handles one full arena singleton through unmapped abandonment, the raw failed-reclaim all-free result, and its exact owner-specific PageMap/bitmap/metadata/slice release. The dynamic owner additionally accepts one `MemoryKind::Os`, `reserved == used == 1` singleton in `BIN_FULL`: it links/removes the exact dynamic Heap OS-list member around clipped PageMap/alias/primary/mapping release and retains a failed-munmap owner terminally. The later-main owner has its separately recorded equivalent OS singleton plus a one-block medium regular endpoint through force then false collection and an empty-before-reclaim final release; sole full medium and full large `BIN_FULL` routes plus sole full non-direct-small and direct-small regular-bin routes that remain unmapped through the source mostly-used predicate then reabandon to their exact static-main bitmap/count pairs; one exact full-medium branch where one joined remote free makes the still-`BIN_FULL` member nonfull during force collection, after which source removes that full queue member and immediately publishes the ordinary medium static-main bitmap/count pair into the existing mapped regular route; a sole nonfull small-or-medium post-exit route; and one aggregate route that preflights all queued pages as nonfull regular small, medium, or large arena pages plus a source-derived direct-cache image. Non-direct full small requires `block_size > SMALL_SIZE_MAX`, an empty direct-cache image, and `used == reserved`. Direct full small requires `block_size <= SMALL_SIZE_MAX`, `reserved >= 16`, `used == reserved`, its exact rounded direct-cache range, and source removal clears that range before page-count detach; its partial collector preserves the just-published head until the next free. The full-large route proves its complete 64-slice PageMap span before terminal release. Direct small members of the nonfull route retain `reserved >= 16`, `0 < used < reserved`, and an exact rounded direct-cache range. The aggregate route retains map/bit/count after a nonempty free, re-derives each supported regular span, and clears the pairing before final release; it cannot adopt, reclaim, or requeue. The raw unmapped tail otherwise selects reabandon, unown, or retained terminal-empty and owns no general span release. Demand commitment outside the frozen default, secure/guarded policy, general producer routing, other full/singleton/unmapped/huge owner-exit integration or terminal reuse, and lifecycle-safe concurrent page release remain absent."
