lot matches its source queue head and every queue member is a nonfull regular small, medium, or large arena page; direct small members retain `reserved >= 16`; it then follows source force collect -> all-free release -> false collect -> all-free release or queue detach -> direct-cache refresh -> page-count detach -> mapped identity/bit/count/unown for every survivor. Its registry is the surviving PageMap registration plus exact main bitmap/count pairing, not a raw page list. After Theap/TLD teardown, each linear free acquires the low owner bit before selecting its bin-specific static-main map, retains map/bit/count when nonempty, and re-derives that page's complete regular span before terminal PageMap -> pages_main -> metadata -> slice release. Fresh engines can serialize independent plain-map operations between frees, but no current path can adopt, reclaim, or requeue a registry member. It does not run source deferred callbacks, arena collection, or stats merge; concurrent producers/free routes, other full/singleton/unmapped/huge/foreign/malformed owner exit, retry/reuse as a normal allocator, pthread/TLS hooks, and process integration remain absent. A retained live page or any force/release failure remains terminal and Drop poisons the attachment/map rather than fabricating cleanup."
