[[item]]
upstream = "src/theap.c"
name = "private-current-thread-regular-key-dynamic-theap-attachment"
source_region = "regular backing and slots from src/threadlocal.c:23-214; later TLD creation/free and thread teardown ordering from src/init.c:236-360,377-421,448-481; dynamic option initialization/_mi_theap_init, canonical cached-root set, and two-list detach from src/theap.c:228-306,357-369,414-449; Heap initialization/regular-slot-then-cached order from src/heap.c:60-100; and AArch64 TPIDR_EL0 TLS primitives from src/prim/prim-tls.c:211-229"
rust_module = "crabc_mimalloc::dynamic_theap, crabc_mimalloc::bootstrap, crabc_mimalloc::single_thread, crabc_mimalloc::thread_local, crabc_mimalloc::owned_tls_key_registry, crabc_mimalloc::tld, crabc_mimalloc::types, crabc_mimalloc::meta, crabc_mimalloc::subproc, crabc_mimalloc::compiler_tls, and crabc_mimalloc::random"
rust_item = "DynamicTheapAttachment/DynamicHeapBinding and DynamicTheapPageSession; DynamicTheapPageMode source option images; sealed TheapPageSession/PageAllocatorEngine dynamic specialization; MainSubprocess::issue_later_thread_ticket; DynamicAttachedThreadLocalData; caller-pinned Heap::initialize_dynamic_binding; exact typed dynamic Theap metadata; regular-slot then canonical-empty-cached publication with paired dynamic `1 -> 2` / `2 -> 1` references; source-ordered no-page teardown; and AwaitingKeyRelease"
intentional_difference = "One private current-thread owner only binds a caller-pinned pristine Heap to one later-ticket metadata TLD, typed dynamic-Theap metadata, regular backing, and a linear regular-key lease. It atomically refuses ticket zero but does not create shared process-init authority. It performs source Theap/list/random/cookie/Release publication, regular-slot publication, then canonical-empty cached-root store and exact paired dynamic reference. Default/fast remain unchanged; foreign cached roots reject before ticket issue. Ordinary dynamic begin stores source `allow_page_abandon=true`/`page_full_retain=2` and rejects page-session construction. Only a crate-private unsafe begin stores source-reachable `false`/`-1` before publication and creates a sealed borrowed session for the shared private page engine. Its consuming finish requires a drained lifecycle; unfinished Drop, retained collection poison, or pending OS release latches the attachment terminally, and any pending OS release owner transfers into that retained attachment. Preflight mismatch/nonzero-page rejection is wholly pre-mutation. Pre-publication allocation failure cleans up and rejects; after list publication or cached-root reset, fallible private lock/list/metadata errors retain a terminal owner rather than invent rollback. The sole recoverable terminal-adjacent state is a final pre-mutation key-release lock failure, which retains only its lease for retry. Full dynamic heap/Theap APIs, general cached switching/reference ownership, process/subprocess lists and counters, general allocation/page/remote-free routing, abandonment, pthread/fork/process teardown, public ABI, and public runtime/default routing integration remain absent."
tests = ["crabc-mimalloc/src/dynamic_theap.rs", "crabc-mimalloc/src/bootstrap.rs", "crabc-mimalloc/src/single_thread.rs", "crabc-mimalloc/src/meta.rs", "crabc-mimalloc/src/thread_local.rs", "crabc-mimalloc/src/owned_tls_key_registry.rs", "crabc-mimalloc/src/tld.rs", "crabc-mimalloc/src/subproc.rs", "crabc-mimalloc/src/types.rs"]
