intentional_difference = "Remote collection and general abandonment are not yet integrated with queues or thread lifecycle. The separately recorded dynamic same-owner mapped-regular handoff, including one allow-collect remote free and all-free queue-detached arena release, is one queue-integrated exception. Two source-shaped root-cleared owners admit a full singleton handoff: dynamic clears its regular slot, while later-main clears fixed fast and additionally proves the singleton is the drain's sole page before detach. Each handles one full arena singleton through unmapped abandonment, the raw failed-reclaim all-free result, and its exact owner-specific PageMap/bitmap/metadata/slice release. The dynamic owner additionally accepts one `MemoryKind::Os`, `reserved == used == 1` singleton in `BIN_FULL`: it links/removes the exact dynamic Heap OS-list member around clipped PageMap/alias/primary/mapping release and retains a failed-munmap owner terminally. The dynamic owner also has four separately recorded full arena classes: medium or large in `BIN_FULL`; non-direct small with `SMALL_SIZE_MAX < block_size <= SMALL_MAX_OBJ_SIZE`, an empty direct image, and `used == reserved`; and direct small with `block_size <= SMALL_SIZE_MAX`, `reserved >= 16`, `used == reserved`, and its exact rounded direct-cache range. Each force then false collects, clears the direct range before page-count detach when applicable, enters the raw initially-unmapped failed-reclaim tail, and only then publishes its heap-local bitmap/count pair. Its separate nonfull mapped endpoints cover one sole medium, large, non-direct-small, or direct-small page with `reserved > 1` and `used == 1`; the large endpoint uses the normal collector and validates its complete 64-slice span before terminal release. The later-main owner has its separately recorded equivalent OS singleton plus a one-block medium regular endpoint through force then false collection and an empty-before-reclaim final release; sole full medium 