intentional_difference = "This is the all-free scan of one crate-private later-main owner exit, nine explicit sole-page handoffs, four source-specific one-remote full-page predecessors of the existing mapped regular route, and one bounded aggregate regular-pages route. The aggregate, the runtime's direct small-or-medium continuation, and its all-free drain each enter the source deferred-free phase while their Theap/TLD pairing remains live, before their first retirement, queue, or page-inspection work: production advances heartbeat only, while a private attachment-local test observer proves the force flag, recursion guard, nested heartbeat, and ordering. It intentionally exposes no process-global/public callback registration or allocator re-entry contract. It clears the fixed fast slot, force-collects every queue (including regular and full), and releases pages that reach zero use through the existing PageMap -> Arena::pages_main -> metadata -> slice order. The scan continues through later queues after it finds a live page, but general live pages remain attached/retained unless the caller chooses the aggregate route. The arena singleton and one-block-medium endpoints retain their existing exact shapes. One sole OS-aligned singleton additionally links to `Heap::os_abandoned_pages` before common unown and removes itself before clipped PageMap -> alias -> primary -> mapping release; a failed munmap remains terminally retained. Full medium and full large each require the sole `BIN_FULL` page. Full non-direct small requires the sole ordinary small-bin page with `block_size > SMALL_SIZE_MAX`, `used == reserved`, and no direct-cache image; full direct small instead requires `block_size <= SMALL_SIZE_MAX`, `reserved >= 16`, `used == reserved`, its complete rounded direct-cache range, and no full-queue membership. Both normal full-small routes queue-detach into source-unmapped abandonment; direct removal clears its range before page-count decrement. Sequential client frees remain unmapped through `free <= reserved / 8`, with direct small retaining its just-published partial-collector head before that count advances, and only then reabandon to their exact static-main bitmap/count pair before their mapped tails and terminal release. Separately, the medium and large `BIN_FULL`, non-direct-small ordinary-bin, and direct-small ordinary-bin shapes each accept exactly one joined remote free that force collection turns into `used == reserved - 1`; false collection then removes the same source member and immediately publishes the mapped regular state. The full-large mapped branch retains its complete 64-slice span; the non-direct-small branch keeps every direct slot empty, direct-small clearing still precedes page-count detach, and all full origins remain client-free-only. Each full-small route releases one regular slice. The existing sole nonfull process route accepts one regular medium or small page. A separate exact two-block `PageKind::Large` route proves its empty direct image and complete fixed 64-slice span before and after collection, then remains client-free-only through the second free's full-span release. Its explicit `used < reserved` guard excludes both full small classes. The aggregate endpoint first rejects without queue/page mutation unless every direct slot matches its source queue head and every queue member is a nonfull regular small, medium, or large arena page; direct small members retain `reserved >= 16`. Its source retired-page prepass releases a normally retired direct-small member only after its complete rounded cache image has remained valid through ordinary local retirement, then queue removal refreshes that range before page-count decrement and PageMap -> `pages_main` -> metadata -> slice release. It then follows source force collect -> all-free release -> false collect -> all-free release or queue detach -> direct-cache refresh -> page-count detach -> mapped identity/bit/count/unown for every survivor. Its registry is the surviving PageMap registration plus exact main bitmap/count pairing, not a raw page list. After Theap/TLD teardown, each linear free acquires the low owner bit before selecting its bin-specific static-main map, retains map/bit/count when nonempty, and re-derives that page's complete regular span before terminal PageMap -> pages_main -> metadata -> slice release. If the completed traversal releases every other page and leaves exactly one initially-nonfull arena-backed medium with an immediate local head, it turns only that exact witness into the established one-page route before a registry exists; reclaim revalidates the head and cannot extend, commit, scan, or fresh-fallback. Fresh engines can serialize independent plain-map operations between frees, but no current path can adopt, reclaim, or requeue an actual registry member, including one reduced to a single member by client frees. Arena collection and stats merge; concurrent producers/free routes, other full/singleton/unmapped/huge/foreign/malformed owner exit, retry/reuse as a normal allocator, pthread/TLS hooks, and process integration remain absent. A retained live page or any force/release failure remains terminal and Drop poisons the attachment/map rather than fabricating cleanup."
