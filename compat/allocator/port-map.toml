# The specific `later-main-mapped-medium-pages-post-exit-registry` item below
# supersedes this broad summary's former mapped-only aggregate wording: the
# same registry now retains unchanged full regular members source-unmapped and
# live arena and OS-aligned singletons through their sealed source-specific
# terminal tails.
# The scoped full-origin items below supersede this partial summary's former
# medium-only wording: full large, non-direct-small, and direct-small pages
# have the same one-joined-remote mapped predecessor, while preserving their
# distinct full-queue, ordinary-bin, and direct-cache contracts.
rust_item = "partial: geometry, fresh ordinary-page initialization, scalar free-list lifecycle, source candidate search/full retention, retirement, full-span release, bounded remote-list collection including small partial-head collection, mapped abandon/adopt or same-origin remote-free reassociation, the raw unmapped failed-reclaim decision tail, and post-root-transition force-retirement plus dynamic singleton, full-medium/full-large/full-non-direct-small/full-direct-small, and mapped-one-block-medium/large/non-direct-small/direct-small, later-main singleton, full-medium/full-large/full-non-direct-small/full-direct-small unmapped-to-mapped, the exact full-medium/full-large/full-non-direct-small/full-direct-small one-remote-free force-collection-to-mapped transitions, sole small-or-medium, and aggregate-regular-pages post-exit release with its exact pre-registry sole-immediate-medium outcome"
# This partial, unimplemented summary's former reduced-registry exclusion is
# superseded by `later-main-aggregate-last-mapped-regular-post-exit-allocation-adoption`:
# after every sibling and singleton tail terminally releases, the final mapped
