rust_item = "DynamicTheapAttachment/DynamicHeapBinding, DynamicTheapPageSession, DynamicTheapPageDrainSession, DynamicThreadExitDrain, DynamicThreadExitSingletonHandoff, and DynamicThreadExitMappedOneBlockHandoff; DynamicTheapPageMode source option images; sealed TheapPageSession/PageAllocatorEngine dynamic specialization; MainSubprocess::issue_later_thread_ticket; DynamicAttachedThreadLocalData; caller-pinned Heap::initialize_dynamic_binding; exact typed dynamic Theap metadata; regular-slot then canonical-empty-cached publication with paired dynamic `1 -> 2` / `2 -> 1` references; source-ordered post-TLS retired-page force collection, singleton and mapped-one-block drains, and no-page teardown; and AwaitingKeyRelease"
intentional_difference = "One private current-thread owner only binds a caller-pinned pristine Heap to one later-ticket metadata TLD, typed dynamic-Theap metadata, regular backing, and a linear regular-key lease. It observes the shared selector and atomically refuses ticket zero while the static branch is open, active, or retained; it does not itself run process initialization. It performs source Theap/list/random/cookie/Release publication, regular-slot publication, then canonical-empty cached-root store and exact paired dynamic reference. Default/fast remain unchanged; foreign cached roots reject before ticket issue. Ordinary dynamic begin stores source `allow_page_abandon=true`/`page_full_retain=2` and rejects page-session construction. Only a crate-private unsafe begin stores source-reachable `false`/`-1` before publication and creates a sealed borrowed session for the shared private page engine. Its consuming finish requires a drained lifecycle; unfinished Drop, retained collection poison, or pending OS release latches the attachment terminally, and any pending OS release owner transfers into that retained attachment. That session additionally has one consuming same-owner handoff for a mapped regular arena page through its exact heap-local abandoned bit/count: it can adopt the page or apply one same-origin allow-collect remote free and requeue after reassociation. Its all-free dynamic-arena result performs the bounded queue-detached span release; an existing owner or later release failure stays terminal. Separately, `DynamicThreadExitDrain` clears the dynamic regular slot, force-collects one already-retired all-free regular page, then accepts a full one-block arena or OS-aligned singleton and three separate sole nonfull mapped arena classes with `reserved > 1` and `used == 1`: medium; non-direct small with `SMALL_SIZE_MAX < block_size <= SMALL_MAX_OBJ_SIZE` and an empty direct image; or direct small with `block_size <= SMALL_SIZE_MAX`, `reserved >= 16`, and its