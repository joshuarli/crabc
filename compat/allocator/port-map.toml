# Shadow correction: live remote free is pointer-first. The selected direct
# and C witnesses give B1/B2 only matching exact addresses; each derives
# persistent PageMap/page facts and atomically publishes to the source remote
# head without a session-local handoff. The nondefault status does not change.
intentional_difference = """
This is a compile-time, nondefault early-shadow lane, not a runtime selector or
default-backend change. The initial thread retains its permanent source owner.
An attached worker may submit one exact still-live ticket-zero client
through the source page's atomic remote head, but it receives no page engine,
source owner, admission claim, or stored client capability. That atomic
producer seam supplies live-owner free only; the separately mapped realloc
transaction allocates through the caller's persistent owner. Neither seam is
owner-exit adoption, abandonment, or a pointer registry. The separate PageMap
usable-size boundary returns its
captured extent for any exact live native client without borrowing this
producer.

Native-shadow startup calls `prepare_native_later_thread_arena` before
constructors. That dormant-only step promotes the cold static staging owner
into its pinned initial compiler-TLS owner and establishes the first arena.
`pthread_create` does not reprepare, suspend, or park a live initial owner:
the initial client remains with that direct owner while every later pthread
attaches its own local lifecycle. The initial client address, engine, and
session never cross the boundary. The selected initial-live/local-worker
fixture proves that serial sequence only. Its companion synchronizes two
independent later local workers and releases them one at a time while the
initial live client remains direct. The third initial-live/owner-exit companion
keeps that same initial client direct across a later A's existing mixed
aggregate route; fresh B frees only its ordinary exact C inputs and completes
its own ordinary attachment before the initial thread queries, reallocates, or
frees its own client. The separate main-static parked/suspend bridge is not
selected by this C pthread path. None is concurrent initial/worker mutation, a
generic worker scheduler, or a pointer handoff.

An attached native worker otherwise owns only its generation-checked private
session and ledger. Its local C-facing blocks may be allocated, freed,
reallocated, or queried locally; an all-free destructor finish drains that
typed session before releasing its worker admission. A selected mixed owner may
leave direct-small, non-direct-small, medium, regular-large, arena-singleton,
and OS-aligned-singleton clients live, and the source-produced sole
mapped-regular result remains a distinct route. The source's ordinary return,
`pthread_exit`, or deferred cancellation path performs the typed Theap
teardown before the detached route becomes available to a fresh attached B.
The aggregate's exact singleton frees retain their source-shaped static-main
OS-list and clipped PageMap/alias/primary/mapping release tail. The sole route
uses only its existing failed-reclaim terminal-release primitive; C receives
no adoption, reclaim, or allocation-time capability.

`NativePostExitRouteRegistry` holds the detached aggregate and sole routes in
stable metadata-backed entries rather than a fixed route count. Entries expose
no route identity or client address, reuse their empty storage, and append one
process-lived metadata node only when every existing entry is occupied. Each
entry serializes its own exact free operation, keeps its private
ledger, route-specific parked scheduler count, and A admission proof, and
transfers the terminal completion only into its matched B TLS. B's normal
attachment finish removes that exact parked count and releases A's admission.
One route may cross sequential later-worker lifecycles: a nonterminal B can
free a disjoint exact subset and finish its own no-page attachment while the
registry retains A's parked token and admission; fresh C can then free the
remaining exact clients, receive the terminal completion in C TLS, and release
that token only after C finishes. Four fresh B workers may also offer
disjoint exact clients from one mixed aggregate together. The one entry's
`ACTIVE -> BUSY` move serializes every complete source free while contenders
wait; only the worker that consumes the final client receives the completion,
which stays in that worker's TLS until its normal attachment finish. This
admits bounded concurrent callers with serialized route mutation, not
concurrent PageMap mutation, general pointer routing, concurrent detached
`realloc`, or a second terminal completion.
The selected C split-releaser fixture repeats that exact B-then-C transition:
B frees the OS, arena, and large tails before its own finish, and C frees the
remaining medium and small clients before its finish releases A's admission.
An already-attached B may keep one independent local session while it offers
an exact A address, but only while that session is parked; the route never
borrows B's long engine or accepts a prepared B exit. Its terminal completion
then stays beside B's parked session until B completes its own finish.
Once that terminal completion is resident in B TLS, it retains only A's parked
token and admission proof. B may resume and re-park its own independent local
engine for ordinary allocation, local `realloc`, and exact local free; B's
ordinary teardown still precedes every completion release. The selected
`native_mimalloc_owner_exit_realloc` C fixture first proves that an impossible
replacement request maps to `ENOMEM` and preserves every 64 KiB source
sentinel. Four serialized fresh-B rounds then replace A's post-exit source
through B's persistent owner for 4 KiB, 128 KiB, and zero-size requests. The
fixture observes only legal C behavior: a non-null result with the bounded
prefix preserved, and the zero-size result's pinned compatibility zero byte.
Pinned `mi_theap_realloc_zero_ex` selects its replacement branch because B's
target Theap differs; successful replacement consumes A's old client exactly
once through generic pointer-first free, so the fixture immediately clears and
never compares or accesses that stale address. The same process retains B's
existing local replacement and cleanup/TSD ordering
coverage across normal return, `pthread_exit`, and deferred cancellation
before B's native all-free finish settles A's proof.
For a nonmatching live-associated, abandoned, or abandoned-mapped `realloc`
input, `native_reallocate` first establishes B's persistent target without
inspecting the source pointer, then captures one coherent PageMap observation,
then allocates the replacement through the caller's persistent native owner
rather than borrowing the source owner. It copies the smaller of the source
usable extent and requested size before passing that same non-Copy observation
to generic pointer-first nonlocal free. Allocation failure leaves the source
live and unchanged. If that old-source continuation does not return `Freed`,
the unescaped caller-local replacement is returned directly to its current
owner; rollback failure retains that owner, and realloc returns its fail-closed
retained result without publishing the replacement. Only `Freed` publishes the
replacement. A true PageMap `Detached` input is deliberately not grouped with
those successfully consumable states: it has no W03 source producer, so its
generic nonlocal-free tail rejects before claim and the operation fails closed
as `Retained` after the same unpublished-replacement rollback discipline. The
selected post-exit replacement fixtures use `AbandonedMapped` page state; their
route's English "detached" label describes A's exited TLS lifecycle, not
`MI_THREADID_DETACHED`. `native_usable_size` still returns the captured PageMap
extent directly for an exact live client. This is never source in-place reuse
or a borrow of A's allocator.
The selected pinned-musl differential
`native_mimalloc_shadow_foreign_realloc_test.c` keeps A live under a pthread
handshake while B first rejects `SIZE_MAX` with `ENOMEM` and an unchanged
513-byte prefix, then successfully replaces that source at 8192 bytes through
B's persistent owner. It requires the copied prefix, writable replacement
tail, preservation of the fixture's preexisting `EAGAIN`, no stale-source
access after success, and B-local replacement free before A resumes. This is
one bounded valid live-foreign trace, not broad realloc differential parity.
Registry inspection proves only that every extant private OS-list member remains
owned by a live typed route; it does not authorize list traversal or broad
PageMap access. A metadata-growth, retained, or terminal route failure retains
the exact source owner and does not publish a fallback. Before a terminal
retained entry publishes, it closes the same short registry mutation boundary
used for installation: an in-flight detached owner finishes its complete route
before that closure, while a later owner cannot publish beside the retained
entry.

The default-off `native-runtime-test-fault` evidence feature exposes only one
direct-test operation: fail the next source `munmap`. Its failed-OS-release
regression arms that operation after the mixed aggregate has detached and B
offers its one recorded OS-aligned address. The free returns `Retained`; the
stable route entry stays retained after B's own no-page finish, so A's parked
scheduler token and admission claim cannot reopen ticket zero. Clearing the
injection cannot retry that route. This is not a production fault path, generic
fault-plan API, pointer registry, PageMap capability, or allocator surface.

A later native allocation keeps its `NativePersistentThreadOwner` in compiler
TLS, and direct owner exit collect-abandons that source state before it releases
the worker admission. The normal PageMap-derived pointer-first free path does
not publish or query `NativePostExitRouteRegistry` storage. The
`native_pointer_first_post_exit_os_release` regression is general
pointer-first no-registry evidence, including when the source terminal release
retains. Registry completion and reuse therefore are not supported route
behavior: the obsolete `native_post_exit_registry_reuse` test is retired rather
than preserving a B-held admission contract. The remaining
registry/completion/scheduler code is deletion-pending scaffolding, forbidden
by `native-mimalloc.md` §3.3 and Phases E/F.

Exact live remote free is now pointer-first. An attached B proves the handed
address through persistent PageMap/page state, derives its canonical source
block, and atomically pushes it to that page's remote head. It neither scans
owner entries nor claims A's TLS, a parked session, a scheduler token, or a
private client ledger. A's ordinary operation or finish collects the head.
The selected two-live-owner witness keeps A1/A2 source pointers independent
while B1/B2 consume only their matching addresses; the historical
`native_live_remote_owner_registry_reuse` target repeats those persistent
PageMap epochs without registry metadata or an audit. This does not expose a
pointer registry or concurrent PageMap mutation. The selected boundary has no
C-backend fallback: unknown, foreign, unsupported, or terminal native frees
fail-stop, and an unavailable allocation reports the selected C-ABI failure.

General single-page adoption/reclaim owner exit, simultaneous source access,
general
concurrent owner-exit traversal or worker allocation, fork repair, and
promotion remain absent. `allocator-shadow` rebuilds this selected libc only
after the default owned sysroot so the selected allocator and lifecycle
fixtures cannot execute the default C artifact.
"""
