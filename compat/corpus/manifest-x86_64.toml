[excluded_payload]
archives = ["musl-1.2.6-r3.apk"]

# Non-library data required by the selected consumers is part of the closure
# rather than inherited from the container image.
[payload]
package_library_dirs = ["/usr/lib"]
required_paths = [
  "/usr/share/misc/magic.mgc",
  "/usr/lib/python3.14",
  "/usr/share/git-core/templates",
  "/etc/terminfo",
]

# `file /etc/alpine-release` is one of the frozen workload cases.  It is an
# explicit shared fixture with the pinned image's bytes, never inherited from
# the image at execution time.
[fixtures]
"/etc/alpine-release" = "3.24.1\n"

# These ordinary account records come from the digest-pinned native Alpine
# image. They are copied, hashed, and mode/owner checked into every private
# root so lookup-using consumers never inherit host account state.
[base_image_files]
"/etc/passwd" = { sha256 = "31a94f06f17bc3b9085fccab1d0fa6ee9e79c4a1e4d91f617fa5de95863be015", mode = 420, uid = 0, gid = 0 }
