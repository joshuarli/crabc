# Frozen native x86_64 input contract for the existing 34-case Alpine corpus.
#
# The workload semantics are sealed by the unchanged AArch64 manifest's exact
# bytes.  This does not transfer an AArch64 result: it only keeps the finite
# case IDs, argv, fixtures, stateful cases, and DT_RELR obligations identical
# while this manifest supplies a distinct native APK input snapshot.
schema = 1
alpine_release = "3.24.1"
architecture = "x86_64"
image = "alpine:3.24.1@sha256:79ff19e9084a00eece421b2523fb93e22d730e2c0e525905de047e848e56d95f"
musl_version = "1.2.6"
apk_tools_version = "3.0.6-r0"

[repository]
base_url = "https://dl-cdn.alpinelinux.org/alpine/v3.24/main/x86_64"
index_filename = "APKINDEX.tar.gz"
# Alpine regenerates this mutable index, so earlier snapshots cannot be
# fetched again (pins 1a66c389..., 2331ad1c..., and bca60355... were each lost
# or superseded that way).  Decision of 2026-09-24, superseding the rationale
# of f423b755 for keeping an index digest pin: the index is not pinned.  Its
# durable provenance is (a) a signature that verifies under the pinned key
# below alone and (b) the 59 pinned APK payload digests in `archive_roster`,
# each of which must also pass `apk verify`.  Each run retains the observed
# index SHA-256 and fails only on a bad signature, a missing or changed APK
# digest, or a roster change.
index_signing_key = "alpine-devel@lists.alpinelinux.org-6165ee59.rsa.pub"

[workload]
source_manifest = "compat/corpus/manifest.toml"
case_count = 34

# The direct 15-package workload is byte-pinned below with its complete finite
# solved non-libc closure.  `musl` was a solver input only and is deliberately
# not extracted: each root receives its separately sealed candidate or pinned
# musl runtime at the canonical musl interpreter/libc spellings.
[direct_packages]
busybox = "1.37.0-r31"
coreutils = "9.11-r0"
coreutils-env = "9.11-r0"
grep = "3.12-r0"
sed = "4.9-r2"
file = "5.47-r2"
tar = "1.35-r5"
gzip = "1.15-r0"
zstd = "1.5.7-r2"
sqlite = "3.53.4-r0"
curl = "8.23.0-r0"
openssl = "3.5.9-r1"
openssh-client-default = "10.3_p1-r2"
git = "2.54.1-r0"
python3 = "3.14.10-r1"

# These direct-package revisions differ from the frozen AArch64 workload.
# The shared case definitions remain byte-for-byte identical; version
# differences do not claim matching package behavior across architectures.
[native_version_deltas]
gzip = { aarch64 = "1.14-r2", x86_64 = "1.15-r0" }
sqlite = { aarch64 = "3.53.2-r0", x86_64 = "3.53.4-r0" }
curl = { aarch64 = "8.21.0-r0", x86_64 = "8.23.0-r0" }
openssl = { aarch64 = "3.5.7-r0", x86_64 = "3.5.9-r1" }
openssh-client-default = { aarch64 = "10.3_p1-r0", x86_64 = "10.3_p1-r2" }
git = { aarch64 = "2.54.0-r0", x86_64 = "2.54.1-r0" }
python3 = { aarch64 = "3.14.7-r1", x86_64 = "3.14.10-r1" }

