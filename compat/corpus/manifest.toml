# Reproducible input manifest for the real Alpine AArch64 corpus.
#
# The package archives are addressed by their immutable release URL and SHA-256
# rather than by an apk repository's moving "latest" answer.  The development
# image itself is pinned in compat/upstreams.toml and docker/Dockerfile.  The
# runner extracts these archives without running package hooks, and takes the
# non-libc DSOs from that pinned image unchanged.
schema = 1
alpine_release = "3.24.1"
architecture = "aarch64"
image = "alpine:3.24.1@sha256:e7a1a92a5bfeee40966aea60f0796b0e7917cc35591542701834f03a68fa3d18"
musl_version = "1.2.6"

[repository]
base_url = "https://dl-cdn.alpinelinux.org/alpine/v3.24/main/aarch64"

# These are deliberately the package archives, not just package names.  The
# versions and digests are from the pinned AArch64 v3.24 repository snapshot.
[[packages]]
name = "busybox"
version = "1.37.0-r31"
filename = "busybox-1.37.0-r31.apk"
