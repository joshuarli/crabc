# The default invocation is Tier A.  `--tier all` exercises the complete
# progression; each case remains a direct package binary, never libldso.so
# with the package binary passed as an argument.
[[cases]]
id = "tier-a-true"
tier = "A"
package = "coreutils"
path = "/bin/true"
argv = ["true"]
requires_dt_relr = true

[[cases]]
id = "tier-a-echo"
tier = "A"
package = "coreutils"
path = "/bin/echo"
argv = ["echo", "crabc-corpus"]
requires_dt_relr = true

[[cases]]
id = "tier-a-cat"
tier = "A"
package = "coreutils"
path = "/bin/cat"
argv = ["cat"]
stdin = "crabc corpus\n"
requires_dt_relr = true

[[cases]]
id = "tier-a-mkdir"
tier = "A"
package = "coreutils"
path = "/bin/mkdir"
argv = ["mkdir", "-p", "/tmp/crabc-corpus-mkdir"]

[[cases]]
id = "tier-a-cp"
tier = "A"
package = "coreutils"
path = "/bin/cp"
argv = ["cp", "/tmp/crabc-corpus-input", "/tmp/crabc-corpus-output"]
setup = [{ path = "/tmp/crabc-corpus-input", contents = "input\n" }]

[[cases]]
id = "tier-a-mv"
tier = "A"
package = "coreutils"
path = "/bin/mv"
argv = ["mv", "/tmp/crabc-corpus-input", "/tmp/crabc-corpus-moved"]
setup = [{ path = "/tmp/crabc-corpus-input", contents = "input\n" }]

[[cases]]
id = "tier-a-rm"
tier = "A"
package = "coreutils"
path = "/bin/rm"
argv = ["rm", "/tmp/crabc-corpus-input"]
setup = [{ path = "/tmp/crabc-corpus-input", contents = "input\n" }]

[[cases]]
id = "tier-a-printf"
tier = "A"
package = "coreutils"
path = "/usr/bin/printf"
argv = ["printf", "%s\\n", "crabc-corpus"]

[[cases]]
id = "tier-a-env"
tier = "A"
package = "coreutils-env"
path = "/usr/bin/env"
argv = ["env", "-i", "/bin/true"]

[[cases]]
id = "tier-a-sleep"
tier = "A"
package = "coreutils"
path = "/bin/sleep"
argv = ["sleep", "0"]

[[cases]]
id = "tier-b-grep"
tier = "B"
package = "grep"
path = "/bin/grep"
argv = ["grep", "needle", "/tmp/crabc-corpus-input"]
setup = [{ path = "/tmp/crabc-corpus-input", contents = "needle\n" }]

[[cases]]
id = "tier-b-sed"
tier = "B"
package = "sed"
path = "/bin/sed"
argv = ["sed", "s/old/new/", "/tmp/crabc-corpus-input"]
setup = [{ path = "/tmp/crabc-corpus-input", contents = "old\n" }]

[[cases]]
id = "tier-b-file"
tier = "B"
package = "file"
path = "/usr/bin/file"
argv = ["file", "/etc/alpine-release"]

[[cases]]
id = "tier-b-tar"
tier = "B"
package = "tar"
path = "/bin/tar"
argv = ["tar", "--version"]

[[cases]]
id = "tier-b-gzip"
tier = "B"
package = "gzip"
path = "/bin/gzip"
argv = ["gzip", "--version"]

[[cases]]
id = "tier-b-zstd"
tier = "B"
package = "zstd"
path = "/usr/bin/zstd"
argv = ["zstd", "--version"]

[[cases]]
id = "tier-b-sqlite"
tier = "B"
package = "sqlite"
path = "/usr/bin/sqlite3"
argv = ["sqlite3", "--version"]

[[cases]]
id = "tier-c-curl"
tier = "C"
package = "curl"
path = "/usr/bin/curl"
argv = ["curl", "--version"]

[[cases]]
id = "tier-c-openssl"
tier = "C"
package = "openssl"
path = "/usr/bin/openssl"
argv = ["openssl", "version"]

[[cases]]
id = "tier-c-ssh-version"
tier = "C"
package = "openssh-client-default"
path = "/usr/bin/ssh"
argv = ["ssh", "-V"]

[[cases]]
id = "tier-d-git"
tier = "D"
package = "git"
path = "/usr/bin/git"
argv = ["git", "--version"]

[[cases]]
id = "tier-d-python"
tier = "D"
package = "python3"
path = "/usr/bin/python3"
argv = ["python3", "-c", "print('crabc-corpus')"]
