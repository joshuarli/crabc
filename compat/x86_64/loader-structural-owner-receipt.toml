# Name filtering precedes strict identity construction.  The future reader
# retains all raw rows, including unnamed physical observations; it only maps
# the eight non-null spellings below to this component's finite coverage.
[fact_filter]
identity_names = [
  "__dls2b",
  "__dls3",
  "_dlstart",
  "__ldso_register_dlopen",
  "__ldso_register_dlsym",
  "__ldso_register_dlclose",
  "__ldso_register_dlerror",
  "__ldso_register_mark_multithreaded",
]
reference_artifact = "reference-shared"
reference_tables = [".dynsym", ".symtab"]
reference_startup_names = ["__dls2b", "__dls3", "_dlstart"]
# There are exactly two retained reference rows for each startup identity at
# the 7dc design anchor: one .dynsym and one .symtab row.  The five private
# registration spellings have structural-contract origins, not invented raw
# occurrences.  Future source-matched facts are validated as supplied facts;
# this anchor is not a fixed fresh-product row-index requirement.
reference_rows_per_startup_name = 2
registration_names_have_no_raw_origin = true

[[group]]
id = "loader-entry-stages"
identities = ["__dls2b", "__dls3", "_dlstart"]
kind = "frozen-startup-structural-disposition"
source_functions = [
  "ldso/src/x86_64_initial_graph.rs::_start",
  "ldso/src/x86_64_general_initial_graph.rs::run",
  "ldso/src/x86_64_general_initial_graph.rs::run_with_initial_tls",
  "ldso/src/x86_64_general_relocation.rs::relocate_initial_graph_with_debugger",
  "ldso/src/x86_64_direct_entry.rs::prepare",
  "ldso/src/x86_64_general_initial_lifecycle.rs::owned_crt_handoff_address",
  "ldso/src/x86_64_general_initial_lifecycle.rs::owned_dependency_constructors",
  "crt/src/x86_64_dynamic_startup.rs::__crabc_x86_64_dynamic_executable_init",
]
source_algorithm = "The selected x86 graph discovers dependencies, selects canonical libc, plans TLS, relocates/protects and seals every object, prepares the registry and publication reservations, materializes then commits TLS, and publishes the registry. Under the selected dynamic-main-thread cfg it retains dependency constructors for the owned CRT handoff rather than dispatching them in the graph function. Legacy stage spellings remain separately classified frozen source context."
normal_consumer = "A source-compiled dynamic constructor/main probe reaches the selected interpreter through PIE/non-PIE kernel and direct entry, then uses only installed public dlfcn APIs."
not_a_callable_proof = "The probe never calls __dls2b, __dls3, or _dlstart. Successful application execution cannot alone establish their internal order."

[[group]]
id = "loader-registration-operations"
identities = ["__ldso_register_dlopen", "__ldso_register_dlsym", "__ldso_register_dlclose", "__ldso_register_dlerror"]
kind = "legacy-registration-replaced-by-selected-direct-operations"
source_functions = [
  "libc/src/c_abi.rs::__ldso_register_dlopen",
  "libc/src/c_abi.rs::__ldso_register_dlsym",
  "libc/src/c_abi.rs::__ldso_register_dlclose",
  "libc/src/c_abi.rs::__ldso_register_dlerror",
  "libc/src/c_abi/x86_64/static_c_abi.rs::fixed_graph_dlfcn module selection",
  "libc/src/c_abi/x86_64/general_dlfcn.rs::dlopen",
  "libc/src/c_abi/x86_64/general_dlfcn.rs::__crabc_x86_general_dlsym",
  "libc/src/c_abi/x86_64/general_dlfcn.rs::dlclose",
  "libc/src/c_abi/x86_64/general_dlfcn.rs::dlerror",
  "ldso/src/x86_64_runtime_registry.rs::runtime_function",
  "ldso/src/x86_64_general_initial_graph.rs::run_with_initial_tls",
  "ldso/src/x86_64_runtime_registry.rs::PreparedInitialRegistry::publish",
]
source_algorithm = "The old generic callback setters remain frozen-origin source context. The selected x86 public dlfcn leaf imports the closed runtime-operation table instead; the selected initial graph prepares and publishes that registry before dependency constructors or application entry can use the public leaf."
normal_consumer = "One installed-header C probe loads a known DSO, resolves a known definition, records a failed lookup followed by one non-null then one null dlerror result, and closes the handle."
not_a_callable_proof = "The probe does not call any __ldso_register_* spelling. A successful dlopen is evidence of the selected direct consumer path only after the source algorithm proves its ordering and closed operation mapping."

[[group]]
id = "loader-always-atomic-guard"
identities = ["__ldso_register_mark_multithreaded"]
kind = "legacy-registration-replaced-by-always-atomic-selected-graph-lock"
source_functions = [
  "ldso/src/x86_64_runtime_lock.rs::RuntimeGuard::acquire",
  "ldso/src/x86_64_initial_worker_tls.rs::allocate",
  "libc/src/c_abi/x86_64/dynamic_tls.rs::allocate_thread",
  "libc/src/c_abi/x86_64/pthread_create_join.rs::create_selected_worker_with_attributes",
  "ldso/src/x86_64_runtime_registry.rs::attach_worker_tls",
  "libc/src/c_abi.rs::__ldso_register_mark_multithreaded (legacy source context)",
]
source_algorithm = "The selected graph lock is atomic from the first loader transaction; it has no enabled-state or one-time mode transition. Separately, the selected dynamic worker path obtains its opaque TLS token through RuntimeGuard before clone. That pair replaces the old callback handoff; the retained generic registration source is legacy-context disposition evidence, not the selected pthread call chain."
normal_consumer = "The dynamic C probe performs its ordinary dlfcn sequence before its first application pthread_create, joins the worker, and has the worker perform a defined dlfcn lookup."
not_a_callable_proof = "This does not call the private registration spelling or infer first-clone ordering from a successful worker. The source algorithm is the proof that the selected TLS allocation takes RuntimeGuard before clone."

[[source_algorithm]]
id = "initial-x86-graph-order"
path = "ldso/src/x86_64_general_initial_graph.rs"
function = "run_with_initial_tls"
ordered_calls = [
  "discover_needed and finish_discovery",
  "select_canonical_initial_libc",
  "plan_initial_tls",
  "PreparedInitialDebugger::prepare and relocate_initial_graph_with_debugger",
  "mark_relocated",
  "protect_segments",
  "apply_relro and apply_self_relro",
  "preflight_dependency_initializers",
  "PreparedInitialRegistry::prepare",
  "attach_lifecycle",
  "reserve_publication, reserve_runtime_v1_publication, and conventional-startup reservation",
  "materialize_initial_tls",
  "commit_runtime_v1",
  "runtime_registry.publish",
  "conventional-startup publication",
  "selected dynamic-main-thread tail: jump with retained owned-CRT constructor plan",
]
meaning = "The future reader must isolate the selected x86 function body and reject reordered, omitted, duplicated, or widened transitions. In particular, it rejects materialization before relocation/RELRO or after registry publication. It separately confirms the selected cfg, x86 entry branch, canonical-libc selection, and owned-CRT constructor tail; it must not treat dispatch or jump as an unconstrained alternative."

[[source_algorithm]]
id = "selected-x86-cfg-entry-and-constructor-tail"
paths = [
  "ldso/Cargo.toml",
  "ldso/build.rs",
  "ldso/src/x86_64_initial_graph.rs",
  "ldso/src/x86_64_general_initial_graph.rs",
  "ldso/src/x86_64_general_initial_lifecycle.rs",
  "libc/Cargo.toml",
  "libc/src/c_abi/x86_64/static_c_abi.rs",
  "crt/src/x86_64_dynamic_startup.rs",
]
requires = [
  "ldso/Cargo.toml::x86_64-owned-dynamic-runtime selects x86_64-general-initial-lifecycle and x86_64-general-initial-tls-runtime-v1-dynamic-main-thread-interpreter for the selected initial graph",
  "ldso/src/x86_64_general_initial_graph.rs::run_with_initial_tls is gated by the selected ldso feature route and its five emitted crabc cfg gates",
  "libc/Cargo.toml::x86-owned-dynamic-runtime selects the x86 static ABI feature route, and libc/src/c_abi/x86_64/static_c_abi.rs selects fixed_graph_dlfcn from general_dlfcn.rs under that libc feature",
  "run selects parse_mapped for kernel entry and x86_64_direct_entry::prepare when the interpreter is invoked directly",
  "run enters run_with_initial_tls under crabc_general_initial_tls_materialization_v1",
  "run_with_initial_tls selects canonical initial libc after discovery and before TLS planning",
  "the selected general-lifecycle plus dynamic-main-thread cfg suppresses in-function dispatch_dependency_initializers",
  "owned_dependency_constructors is retained in OwnedCrtHandoffV1 and __crabc_x86_64_dynamic_executable_init calls it after executable preinit",
]
meaning = "Every candidate normal-consumer cell uses one named entry branch and the one owned-CRT constructor handoff tail below. The reader rejects a different cfg, direct/kernel branch, canonical-libc omission, or constructor owner."

[[source_algorithm]]
id = "selected-direct-dlfcn-route"
path = "libc/src/c_abi/x86_64/static_c_abi.rs"
function = "fixed_graph_dlfcn module selection"
requires = [
  "cfg_attr(feature = x86-owned-dynamic-runtime, path = general_dlfcn.rs)",
  "general_dlfcn imports exactly the closed runtime-operation names",
  "ldso/src/x86_64_runtime_registry.rs::runtime_function maps those names exactly",
  "run_with_initial_tls publishes the prepared registry before any dependency initializer or application entry",
]
meaning = "The selected public dlfcn route is the replacement behavior. It is distinct from the generic legacy callback-slot source and from the nine-name registry component's existing receipt."

[[source_algorithm]]
id = "always-atomic-runtime-graph-lock"
path = "ldso/src/x86_64_runtime_lock.rs"
requires = [
  "one AtomicI32 graph LOCK exists",
  "every RuntimeGuard::acquire uses compare_exchange(0, 1, Acquire, Relaxed)",
  "RuntimeGuard::drop releases with store(0, Release)",
  "selected registry and worker-TLS mutations take RuntimeGuard",
]
meaning = "This is the selected replacement for the old mark-multithreaded registration: the graph lock is atomic from its first transaction. It is not an enabled-state transition and no normal probe may claim to observe one."

[[source_algorithm]]
id = "worker-tls-token-before-clone"
paths = ["libc/src/c_abi/x86_64/pthread_create_join.rs", "libc/src/c_abi/x86_64/dynamic_tls.rs", "ldso/src/x86_64_initial_worker_tls.rs", "ldso/src/x86_64_runtime_lock.rs", "ldso/src/x86_64_runtime_registry.rs"]
requires = [
  "selected dynamic_tls::allocate_thread requests __crabc_x86_64_initial_tls_allocate",
  "x86_64_initial_worker_tls::allocate takes RuntimeGuard before it materializes and registers a worker TLS token",
  "create_selected_worker_with_attributes obtains that token before its clone seam",
  "the legacy callback-registration definition remains source-context disposition evidence rather than the selected x86 pthread route",
]
meaning = "The reader separately proves token-before-clone and RuntimeGuard ownership. It does not replace that proof with an unbounded scheduling assertion or claim that the selected pthread path calls the legacy callback."

# New source-compiled probes are intentionally ordinary consumers.  They use
# installed dlfcn.h/pthread.h names only and never name an internal stage or
# registration callback.  Their object bytes are shared between the pinned
# musl lane and the candidate link for each probe role.
[[probe]]
id = "startup-entry-public-dlfcn"
source = "compat/x86_64/loader_structural_owner_startup_probe.c"
plugin_source = "compat/x86_64/loader_structural_owner_plugin.c"
roles = ["constructor", "main", "plugin"]
operations = ["dlopen", "dlsym", "dlclose", "dlerror"]
cells = [
  "pinned-musl-1.2.6/dynamic-pie-kernel",
  "pinned-musl-1.2.6/dynamic-pie-direct",
  "pinned-musl-1.2.6/dynamic-non-pie-kernel",
  "pinned-musl-1.2.6/dynamic-non-pie-direct",
  "candidate/dynamic-pie-kernel",
  "candidate/dynamic-pie-direct",
  "candidate/dynamic-non-pie-kernel",
  "candidate/dynamic-non-pie-direct",
]
pairs = [
  {mode = "dynamic-pie-kernel", pinned = "pinned-musl-1.2.6/dynamic-pie-kernel", candidate = "candidate/dynamic-pie-kernel"},
  {mode = "dynamic-pie-direct", pinned = "pinned-musl-1.2.6/dynamic-pie-direct", candidate = "candidate/dynamic-pie-direct"},
  {mode = "dynamic-non-pie-kernel", pinned = "pinned-musl-1.2.6/dynamic-non-pie-kernel", candidate = "candidate/dynamic-non-pie-kernel"},
  {mode = "dynamic-non-pie-direct", pinned = "pinned-musl-1.2.6/dynamic-non-pie-direct", candidate = "candidate/dynamic-non-pie-direct"},
]
shared_object_roles = ["consumer-object", "plugin-object"]
required_observation = "Every retained comparator/candidate pair uses byte-identical consumer and plugin objects. The constructor completes one normal public dlfcn transaction before main; main repeats it and records the fixed transcript."
excludes = ["direct calls to __dls2b", "direct calls to __dls3", "direct calls to _dlstart", "private registration calls", "ELF mutation"]

[[probe]]
id = "registration-replacement-before-worker"
source = "compat/x86_64/loader_structural_owner_registration_probe.c"
plugin_source = "compat/x86_64/loader_structural_owner_plugin.c"
roles = ["main", "worker", "plugin"]
operations = ["dlopen", "dlsym", "dlclose", "dlerror", "pthread_create", "pthread_join"]
cells = [
  "pinned-musl-1.2.6/dynamic-pie-kernel",
  "pinned-musl-1.2.6/dynamic-pie-direct",
  "pinned-musl-1.2.6/dynamic-non-pie-kernel",
  "pinned-musl-1.2.6/dynamic-non-pie-direct",
  "candidate/dynamic-pie-kernel",
  "candidate/dynamic-pie-direct",
  "candidate/dynamic-non-pie-kernel",
  "candidate/dynamic-non-pie-direct",
]
pairs = [
  {mode = "dynamic-pie-kernel", pinned = "pinned-musl-1.2.6/dynamic-pie-kernel", candidate = "candidate/dynamic-pie-kernel"},
  {mode = "dynamic-pie-direct", pinned = "pinned-musl-1.2.6/dynamic-pie-direct", candidate = "candidate/dynamic-pie-direct"},
  {mode = "dynamic-non-pie-kernel", pinned = "pinned-musl-1.2.6/dynamic-non-pie-kernel", candidate = "candidate/dynamic-non-pie-kernel"},
  {mode = "dynamic-non-pie-direct", pinned = "pinned-musl-1.2.6/dynamic-non-pie-direct", candidate = "candidate/dynamic-non-pie-direct"},
]
shared_object_roles = ["consumer-object", "plugin-object"]
required_observation = "Every retained comparator/candidate pair uses byte-identical consumer and plugin objects. The first application worker is created after the public dlfcn transaction; the worker performs a defined public lookup and the joined transcript is exact."
excludes = ["direct calls to __ldso_register_*", "private registry calls", "schedule-race claims", "ELF mutation"]

[source_cohort]
relation = "one-current-clean-source"
identity_fields = ["revision", "tree", "source_sha256"]
# A fresh component receipt may not combine source epochs. The reader derives
# this canonical identity from the clean checkout, then checks each format's
# source spelling below; a future multi-epoch use requires a new explicit
# contract rather than a current-clean-only waiver.
collector = "same canonical identity as selected_source"
source_contract = "each retained source-contract/collector file is a physical current Git blob at selected_source.revision, including mode"
selected_source = "canonical clean current identity"
static_preparation = "source.revision and source.content_sha256 equal selected_source"
dynamic_product_state = "source_sha256 equals selected_source; loader-debug anchor supplies its selected revision"
loader_debug_component = "source_commit and source_sha256 equal selected_source"
loader_runtime_registry_component = "source.revision and source.content_sha256 equal selected_source"
base_inventory_and_full_facts = "their public validators admit the exact same static preparation and dynamic product roots"
recheck = "admit and compare every relation before commands, after commands, and during retained host replay"

[selected_runtime]

# These feature spellings are crate-qualified. `ldso` owns the selected
# interpreter graph, while `libc` owns the selected public dlfcn module; their
# similarly named feature gates are not interchangeable source evidence.
[selected_runtime.cfg.ldso]
feature = "x86_64-owned-dynamic-runtime"
feature_definition = "ldso/Cargo.toml"
feature_route = [
  "x86_64-general-initial-lifecycle",
  "x86_64-general-initial-tls-runtime-v1-dynamic-main-thread-interpreter",
]
graph = "ldso/src/x86_64_general_initial_graph.rs::run_with_initial_tls"
gates = [
  "crabc_general_initial_graph",
  "crabc_general_initial_lifecycle",
  "crabc_general_initial_tls_materialization_v1",
  "crabc_general_loader_libc_tls_runtime_v1",
  "crabc_dynamic_main_thread_runtime_v1",
]

[selected_runtime.cfg.libc]
feature = "x86-owned-dynamic-runtime"
feature_definition = "libc/Cargo.toml"
feature_route = ["x86-owned-static-runtime"]
module = "libc/src/c_abi/x86_64/static_c_abi.rs::fixed_graph_dlfcn"
selected_path = "general_dlfcn.rs"

[selected_runtime.constructor_owner]
graph = "ldso/src/x86_64_general_initial_lifecycle.rs::owned_dependency_constructors"
handoff = "OwnedCrtHandoffV1.dependency_constructors"
crt = "crt/src/x86_64_dynamic_startup.rs::__crabc_x86_64_dynamic_executable_init"
order = "executable preinit, retained dependency constructors, _init, executable init array"

[[selected_runtime.candidate_cell]]
id = "dynamic-pie-kernel"
entry = "run: kernel main parse_mapped"
constructor_tail = "owned-crt-handoff"

[[selected_runtime.candidate_cell]]
id = "dynamic-pie-direct"
entry = "run: x86_64_direct_entry::prepare"
constructor_tail = "owned-crt-handoff"

[[selected_runtime.candidate_cell]]
id = "dynamic-non-pie-kernel"
entry = "run: kernel main parse_mapped"
constructor_tail = "owned-crt-handoff"

[[selected_runtime.candidate_cell]]
id = "dynamic-non-pie-direct"
entry = "run: x86_64_direct_entry::prepare"
constructor_tail = "owned-crt-handoff"

[[legacy_source_context]]
identity = "__dls2b"
paths = ["libc/src/loader_startup_exports.rs"]
selected_x86_owner = false
meaning = "Frozen legacy helper context; the selected x86 owner is the initial graph."

[[legacy_source_context]]
identity = "__dls3"
