full_facts_report = ".work/x86_64/native-abi-elf-facts/clean-7dcafabe/report.json"
full_facts_report_sha256 = "e92e2308250e6697c7e3796f540b0c43f399ea78b95fca3b5685abf19a4f5224"
base_inventory_report = ".work/x86_64/native-abi-inventory/clean-7dcafabe/report.json"
base_inventory_report_sha256 = "5392b1e55d8950708d85b83ac9cfc07d85e553c1de55799ace4bd7cc1b3ad0cd"
static_preparation = ".work/x86_64/public-data-products/static-7dcafabe/preparation.json"
