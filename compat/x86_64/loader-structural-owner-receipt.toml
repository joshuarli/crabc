runtime_registry_report = ".work/x86_64/loader-runtime-registry/clean-7dcafabe/report.json"
runtime_registry_report_sha256 = "e0721b93aeec0c4e761357b22a04274a971ea385a97f6815fa9325342990b609"
loader_debug_report = ".work/x86_64/loader-debug-abi/clean-7dcafabe/component/report.json"
