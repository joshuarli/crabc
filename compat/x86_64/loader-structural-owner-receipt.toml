# Design contract for the finite native x86 loader structural-owner receipt.
#
# This is deliberately a component contract, not a selector projection.  It
# names only the eight unresolved structural identities and requires a future
# reader to reconstruct current source, supplied-product and retained-runtime
# evidence before an adapter can attach anything.

schema = "crabc.x86_64-loader-structural-owner-contract/v1"
id = "x86-loader-structural-owner"
status = "design-only"
target = "x86_64-unknown-linux-musl"
component = "loader-structural-owner"

[selection]
disposition = "structural-replacement"
requirement = "current source-bound owning component and consumer semantics receipt"
identities = [
  "__dls2b",
  "__dls3",
  "_dlstart",
  "__ldso_register_dlopen",
  "__ldso_register_dlsym",
  "__ldso_register_dlclose",
  "__ldso_register_dlerror",
  "__ldso_register_mark_multithreaded",
]

# The identity list is finite.  It supplies no expected provider placement:
# these are structural dispositions, not a request to materialize old symbols
# in the selected static archive, libc.so, or interpreter dynsym.
expected_placements = []

[report]
schema = "crabc.x86_64-loader-structural-owner-receipt/v1"
status = "component-verified"
fields = [
  "schema",
  "status",
  "component",
  "collection",
  "selected_source",
  "collector",
  "inputs",
  "selected_products",
  "static_preparation",
  "base_inventory",
  "full_facts",
  "source_contract",
  "source_cohort",
  "source_algorithm",
  "selected_runtime",
  "normal_consumer_matrix",
  "commands",
  "runtime",
  "artifacts",
  "coverage",
  "limits",
]

[report.coverage]
fields = [
  "identities",
  "groups",
  "fact_filter",
  "source_functions",
  "selected_runtime_cells",
  "normal_consumer_cells",
  "normal_consumer_pairs",
]

[report.fact_filter]
fields = [
  "full_occurrence_count",
  "unnamed_occurrence_count",
  "named_identity_filter",
  "reference_startup_rows",
  "candidate_rows",
]

[report.limits]
family_completion = false
promotion_ready = false
public_support = false
runtime_qualification = false

# This is a development anchor, not a receipt that a future collection may
