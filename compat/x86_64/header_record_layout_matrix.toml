# Compiler-derived x86-64 record byte-layout facts for the foundation-verified
# libc.headers-layouts family. This is a checked partial matrix: mismatches and
# records/fields for which byte offsets are not addressable remain explicit.
schema = "crabc.x86_64-header-record-layout-matrix/v1"
target = "x86_64-unknown-linux-musl"
platform = "Linux/x86-64 little-endian"
oracle = "Pinned musl 1.2.6"
public_headers = "compat/x86_64/public_headers.txt"
callable_inventory = "compat/x86_64/header_callable_inventory.json"
generated_report = "compat/x86_64/generated/header_record_layout_matrix/report.json"

[policy]
compiler_ast_json = true
compiler_record_layout_dump = true
header_text_parsing = false
source_layout_truth = true
archive_linkage = false
runtime = false
family_promotion = false
public_support = false

[work_package]
target_family = "libc.headers-layouts"
target_obligations = ["record-byte-layouts"]
focused_evidence_command = "./scripts/dev-x86_64.sh header-record-layout-matrix"
negative_scope = "This matrix records compiler-derived x86 size, alignment, and named field offsets from direct public includes. It does not infer provider/runtime semantics, archive linkage, C++ ABI beyond the C-compatible record facts, family promotion, or public x86 support."
expected_transition = "record-byte-layouts is a completed header-foundation dimension; final provider/archive closure and public support remain downstream."
not_applicable_categories = ["incomplete", "anonymous-only", "bit-field", "flexible-tail", "non-addressable-field"]

[[oracle_not_applicable]]
header = "aio.h"
profile = "c11-strict"
reason = "Pinned musl leaves struct sigevent incomplete without a POSIX or GNU feature request."
