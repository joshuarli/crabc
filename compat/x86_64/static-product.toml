[[suite.case]]
id = "wide-stdio"
probe = "compat/x86_64/owned_wide_stdio_probe.c"
paths = ["stdio-et-exec/wide", "stdio-pie/wide"]

[[suite.case]]
id = "stdio-extensions"
probe = "compat/x86_64/owned_stdio_extensions_probe.c"
