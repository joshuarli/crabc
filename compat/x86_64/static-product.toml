# Campaign-level owned-static product contract. The installed-product runner
# implements the declared suite; only a live source-bound receipt validated and
# published by `static_product_contract.py` qualifies the product. Product
# qualification never completes a family or promotes x86 support by itself.
schema = "crabc.x86_64-owned-static-product/v1"
owner_family = "sysroot.static-tls"
status = "implemented-unqualified"
static_family_ids = ["crt.static-pie", "sysroot.static-tls"]
prerequisite_families = [
  "oracle.musl-toolchain",
  "libc.headers-layouts",
  "libc.posix-runtime",
  "libc.pthread-tls",
  "libc.text-math-locale-stdio",
  "libc.resolver",
  "libc.c-abi-compat",
  "crt.static-pie",
]

[product]
target = "x86_64-unknown-linux-musl"
source = "materialized installed crabc x86-64 sysroot"
link_interface = "deterministic owned static link interface"

required_target_inputs = [
  "installed crabc headers",
  "crt1.o",
  "rcrt1.o",
  "crti.o",
  "crtn.o",
  "libc.a",
  "libcrabc-builtins.a",
  "accepted allocator backend",
  "explicitly admitted application objects",
]
rejected_ambient_target_inputs = [
  "headers",
  "CRT",
  "libc",
  "libgcc",
  "compiler-rt",
  "loader",
]

[[mode]]
id = "static-et-exec"
elf_type = "ET_EXEC"
crt_object = "crt1.o"
interpreter = "absent"

[[mode]]
id = "static-pie"
elf_type = "ET_DYN"
crt_object = "rcrt1.o"
interpreter = "absent"

[inspections]
required = [
  "link trace",
  "link map",
  "ELF headers",
  "dynamic section",
  "relocations",
  "symbol ownership",
  "TLS segments",
  "stack flags",
  "interpreter absence",
]
before_execution = "reject undeclared target inputs before executing the fixture"

[reproducibility]
clean_installed_builds = 2
artifact_set = "declared regular-file artifact set"
comparison = "byte-for-byte identical"
suite = "same declared static smoke suite"

[extracted_smoke]
source = "one extracted packaged installed sysroot"
suite = "same declared static smoke suite"

[coverage]
required = [
  "argument environment auxiliary-vector and program-name publication",
  "Initial TLS errno and high-alignment initialized and zero-filled TLS",
  "allocator allocation alignment reallocation failure and remote-thread ownership",
  "pthread/C11 creation join/detach synchronization once TSD cancellation atfork/fork and exit behavior",
  "stdio creation buffering byte/block/formatted operations positions errors and exit flushing",
  "pathname descriptor directory metadata process signal and time paths",
  "local socket transport and bounded resolver behavior",
  "constructors destructors atexit-class behavior and ordinary/immediate termination",
  "owned compiler helper whose link fails without libcrabc-builtins.a",
]

# The finite suite executed by the runner in both static modes against the
# primary installed tree and the tree extracted from its package. Each path
# is one sealed-driver link with its own receipt, map, trace, and ELF proof.
[suite]
runner = "compat/x86_64/run_owned_static_sysroot.sh"
command = "./scripts/dev-x86_64.sh owned-static-sysroot"
products = ["primary", "extracted"]
mode_paths = ["static-et-exec", "static-pie"]
compiler_helper_rejection = ["static-et-exec", "static-pie"]

[[suite.case]]
id = "tls-lifecycle"
probe = "compat/x86_64/libc_crt_static_tls_probe.c"
paths = ["static-et-exec", "static-pie"]

[[suite.case]]
id = "pthread-composition"
probe = "compat/x86_64/libc_pthread_tls_aggregate_probe.c"
paths = ["static-et-exec/pthread", "static-pie/pthread"]

[[suite.case]]
id = "pthread-signal"
probe = "compat/x86_64/owned_pthread_signal_probe.c"
paths = ["static-et-exec/pthread-signal", "static-pie/pthread-signal"]

[[suite.case]]
id = "pthread-lifecycle"
probe = "compat/x86_64/owned_pthread_lifecycle_consumer.c"
paths = ["static-et-exec/lifecycle", "static-pie/lifecycle"]

[[suite.case]]
id = "io-cancellation"
probe = "compat/x86_64/owned_io_cancellation_probe.c"
paths = ["static-et-exec/cancellation", "static-pie/cancellation"]

[[suite.case]]
id = "descriptor-cancellation"
probe = "compat/x86_64/owned_descriptor_cancellation_probe.c"
