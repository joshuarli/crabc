# Every coverage obligation names the suite cases whose physical evidence
# the receipt collector and reader require for both modes and products.
[[coverage.evidence]]
requirement = "argument environment auxiliary-vector and program-name publication"
cases = ["startup-publication"]

[[coverage.evidence]]
requirement = "Initial TLS errno and high-alignment initialized and zero-filled TLS"
cases = ["tls-lifecycle", "pthread-composition"]

[[coverage.evidence]]
requirement = "allocator allocation alignment reallocation failure and remote-thread ownership"
cases = ["allocator-basic", "allocator-remote"]

[[coverage.evidence]]
requirement = "pthread/C11 creation join/detach synchronization once TSD cancellation atfork/fork and exit behavior"
cases = ["pthread-composition", "pthread-signal", "pthread-lifecycle", "io-cancellation", "descriptor-cancellation", "socket-cancellation", "sleep-wait-cancellation", "open-lock-cancellation", "sysv-message-cancellation", "entropy-cancellation", "signal-wait-cancellation", "semaphore-wait-cancellation", "semaphore-cancellation"]

[[coverage.evidence]]
requirement = "stdio creation buffering byte/block/formatted operations positions errors and exit flushing"
cases = ["stdio-streams", "stdio-backends", "stdio-process", "wide-stdio", "stdio-extensions", "printf", "printf-float", "scanf", "wide-format"]

[[coverage.evidence]]
requirement = "pathname descriptor directory metadata process signal and time paths"
cases = ["posix-composition", "temporary-objects", "spawn", "filesystem-clients", "calendar", "timezone-tzif", "system-composition"]

[[coverage.evidence]]
requirement = "local socket transport and bounded resolver behavior"
cases = ["ipc-readiness", "system-composition", "resolver"]

[[coverage.evidence]]
requirement = "constructors destructors atexit-class behavior and ordinary/immediate termination"
cases = ["tls-lifecycle", "termination"]

[[coverage.evidence]]
requirement = "owned compiler helper whose link fails without libcrabc-builtins.a"
cases = ["tls-lifecycle"]

[qualification]
validator = "compat/x86_64/static_product_contract.py"
receipt = "source-bound receipt under .work/x86_64/reports/owned-static-product"
publication = ".work/x86_64/owned-static-qualification.json"
source = "live nonignored source content and modes; clean revision at publication"
family_completion = false
promotion_ready = false
public_support = false
