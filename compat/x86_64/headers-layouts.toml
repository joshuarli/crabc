# Selected native x86-64 header/layout evidence, not an installed-header
# completion claim. Each `headers` list records only headers explicitly
# included by that probe's source; it intentionally does not assert the
# transitive include closure, archive linkage, or public x86 support. The
# separate `public_headers.txt`/`public-header-surface` artifact inventories
# every pinned public pathname for C consumability only; it does not promote
# this selected declaration/layout manifest to aggregate completion.
schema = "crabc.x86_64-headers-layouts/v1"
family = "libc.headers-layouts"
target = "x86_64-unknown-linux-musl"
platform = "Linux/x86-64 little-endian"
kernel_msrv = "5.10"
status = "planned"
oracle = "Pinned musl 1.2.6"

[policy]
native_execution_only = true
project_headers_first = true
direct_header_inventory = true
transitive_include_closure = false
aggregate_family_completion = false
public_support = false

[[probe]]
id = "project"
command = "./scripts/dev-x86_64.sh header-abi-project"
state = "required"
kind = "compile-only"
sources = [
  "compat/x86_64/project_header_abi_probe.c",
  "compat/x86_64/run_project_header_abi.sh",
]
headers = ["include/bits/alltypes.h", "include/fenv.h", "include/float.h"]

