# These are the finite compiler profiles retained by the declaration inventory.
# cxx17-strict deliberately remains a C++ profile even though the pinned Clang
# environment exposes the GNU feature surface there; visibility follows the
# retained profile result, not the profile's informal label.
[profile_languages]
c11-gnu = "c"
cxx17-gnu = "cxx"
c11-strict = "c"
c11-posix-2008 = "c"
c11-xopen-700 = "c"
c11-bsd = "c"
cxx17-strict = "cxx"

[profile_sets]
all = ["c11-gnu", "cxx17-gnu", "c11-strict", "c11-posix-2008", "c11-xopen-700", "c11-bsd", "cxx17-strict"]
xopen_gnu_bsd = ["c11-gnu", "cxx17-gnu", "c11-xopen-700", "c11-bsd", "cxx17-strict"]
posix_xopen_gnu_bsd = ["c11-gnu", "cxx17-gnu", "c11-posix-2008", "c11-xopen-700", "c11-bsd", "cxx17-strict"]
gnu_effective = ["c11-gnu", "cxx17-gnu", "cxx17-strict"]
gnu_bsd_effective = ["c11-gnu", "cxx17-gnu", "c11-bsd", "cxx17-strict"]

