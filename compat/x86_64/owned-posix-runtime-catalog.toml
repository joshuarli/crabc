[[required_workload]]
id = "legacy-filesystem"
purpose = "One installed-driver same-object differential for lchmod, all four stat compatibility aliases, all seven directory names, and all five extension names. The header-absent stat aliases use only the source-verified local extern declarations already used by libc_stat_compat_probe.c."
product_matrix = "all"

[[required_workload]]
id = "control-residual"
purpose = "Close the process-control names outside the existing process-trio and spawn cases, including exec aliases in child processes, sessions/groups, nice, wait variants, and complete spawn-attribute getter/setter round trips and errors."
product_matrix = "all"

[[required_workload]]
id = "credentials-profile"
purpose = "Use disposable user namespaces to prove the selected four-alias EOPNOTSUPP/no-mutation profile and caller-coordinated direct setresuid/setresgid/setuid/setgid/setgroups behavior, without claiming a new all-thread rendezvous."
product_matrix = "all"

[[required_workload]]
id = "environment-lifecycle"
purpose = "Exercise allocation-backed setenv/unsetenv/clearenv replacement/removal and failure behavior, direct environ ownership boundaries, and child/parent visibility through fork/exec/spawn."
product_matrix = "all"

[[required_workload]]
id = "signal-full"
purpose = "Run the full frozen 34-name signal catalog through mask, action, queue, wait, altstack, realtime, reporting, and signalfd scenarios, including failure ordering and errno."
product_matrix = "all"

[[required_workload]]
id = "kernel-residual"
purpose = "Cover the selected kernel-admin names not bound by linux-control, syslog, or system-cancellation with source-compatible success or contained negative-path differentials."
product_matrix = "all"

[[required_workload]]
id = "global-state-composition"
purpose = "Make environment, signal disposition/masks, stdio FILE state, syslog state, and fork/exec/spawn coexist in a multi-threaded parent/child differential."
product_matrix = "all"
