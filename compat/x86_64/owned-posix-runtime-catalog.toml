# Proposed closure catalog for parity.toml family `libc.posix-runtime`.
#
# This is an accounting and test-design input.  It records the nine frozen
# AArch64 capability spellings selected for this family and the current x86
# evidence boundary.  `private-*` means a leaf can be built or tested outside
# an installed product.  `installed-*` means that a public-header application
# has linked against an owned sysroot product.  Neither state changes the
# parity ledger or asserts that this family is complete.
schema = "crabc.x86_64-owned-posix-runtime-catalog/v1"
status = "proposal"
family = "libc.posix-runtime"
frozen_ledger = "compat/crabc-rs/coverage.toml"
frozen_platform = "Linux/AArch64 little-endian"
target = "x86_64-unknown-linux-musl"
pinned_c_oracle = "musl 1.2.6"
capability_count = 9
symbol_count = 149

[composition]
private_static = "A selected x86 C-ABI leaf or opt-in archive may compile and have focused evidence, without demonstrating an installed libc.a, its CRT/startup, or any other runtime state owner."
installed_static = "An application object built with installed crabc headers and linked through the owned static driver as ordinary static ET_EXEC or static PIE."
extracted_static = "The same installed-static workload linked and run from a packaged, extracted copy of the sysroot; it is a separate product result."
installed_dynamic = "An application object linked through the installed dynamic driver as PIE and non-PIE, run through kernel PT_INTERP resolution and direct installed-interpreter entry."
dynamic_products = ["installed", "second", "extracted"]
dynamic_qualification = "The three products registered by owned_dynamic_qualification.py. A current dynamic-leaf case proves only the named workload, never this catalog's full capability group."

[required_product_matrix]
static = ["primary:et-exec", "primary:pie", "reproduction:et-exec", "reproduction:pie", "extracted:et-exec", "extracted:pie"]
dynamic = ["installed:pie:kernel", "installed:pie:direct", "installed:non-pie:kernel", "installed:non-pie:direct", "second:pie:kernel", "second:pie:direct", "second:non-pie:kernel", "second:non-pie:direct", "extracted:pie:kernel", "extracted:pie:direct", "extracted:non-pie:kernel", "extracted:non-pie:direct"]

[signal_case_audit]
scope = "All registered owned_dynamic_qualification.py CASES runners were inspected. Listed calls are classified as dedicated positive behavior evidence or supporting use; no call alone closes a catalog symbol."
dedicated = ["signal-helpers: __sysv_signal, bsd_signal, psiginfo, psignal, sighold, sigignore, sigrelse, sigset; checked action/mask/reporting substrate and signal alias binding", "io-cancellation: sigtimedwait, sigwaitinfo, sigwait under pending, interrupted, and cancellation states; sigqueue, sigaction, sigemptyset, sigaddset, sigismember setup/recovery", "pthread-signal: worker delivery through sigtimedwait, sigaction, sigemptyset, sigaddset, sigismember", "posix-timers: timer delivery through sigtimedwait, sigemptyset, sigaddset"]
supporting = ["spawn: sigaction, signal, sigemptyset, sigaddset, sigismember, sigprocmask", "system-cancellation: kill, sigaction, sigemptyset, sigaddset, sigismember, sigprocmask", "legacy-time: sigaction, sigemptyset, sigaddset, sigprocmask, sigsuspend", "pthread-scheduling: sigemptyset, sigaddset, sigismember", "fcntl: sigaction, sigemptyset, sigaddset", "linux-control: raise", "process-trio: sigemptyset, sigaddset, sigismember", "pty: sigemptyset, sigaddset, sigismember"]

[[capability]]
id = "filesystem.lchmod-unsupported"
symbols = ["lchmod"]
source_bindings = ["libc/src/c_abi/x86_64/lchmod_unsupported.rs", "libc/src/c_abi/x86_64/owned_filesystem_mechanisms.rs"]
current_installed_evidence = ["compat/x86_64/run_owned_filesystem_mechanisms.sh: static ET_EXEC, static PIE, dynamic PIE, dynamic non-PIE, and direct dynamic interpreter", "compat/x86_64/owned_dynamic_qualification.py case filesystem-mechanisms: installed, second, extracted dynamic products"]
private_or_static_only_evidence = ["The frozen static archive's lchmod_unsupported leaf is a different fixed-result boundary."]
unproven = ["No extracted static or static-PIE run of this lchmod workload.", "No family-level shared-state composition with signal, fork/spawn, FILE, logger, or environment state."]
closure_workloads = ["legacy-filesystem", "global-state-composition"]

