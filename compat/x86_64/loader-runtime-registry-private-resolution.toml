scenario = "runtime-tls-41-modules"
[[operation]]
name = "__crabc_x86_64_runtime_information"
resolver = "runtime_information"
consumer = "general_dlfcn"
scenario = "runtime-tls-41-modules"
[[operation]]
name = "__crabc_x86_64_runtime_iterate"
resolver = "runtime_iterate"
consumer = "general_dlfcn"
