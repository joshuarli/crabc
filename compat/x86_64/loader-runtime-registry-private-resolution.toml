schema = "crabc.x86_64-loader-runtime-registry-private-resolution-contract/v1"
id = "x86-loader-runtime-registry-private-resolution"
status = "implemented-unqualified"
target = "x86_64-unknown-linux-musl"

# These are private, unresolved shared-libc protocol imports.  They are
# resolved only by the selected interpreter's closed runtime-function table;
# no name here is an installed libc export or an ABI declaration.
[[operation]]
name = "__crabc_x86_64_runtime_open"
resolver = "runtime_open"
consumer = "general_dlfcn"
scenario = "runtime-tls-41-modules"
[[operation]]
name = "__crabc_x86_64_runtime_symbol"
resolver = "runtime_symbol"
consumer = "general_dlfcn"
scenario = "runtime-tls-41-modules"
[[operation]]
