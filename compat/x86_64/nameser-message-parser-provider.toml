# Linux/x86-64 static C nameserver message-parser provider work package.
#
# This is one finite musl source-closed parser block, not an incremental
# resolver rollout. Its three public C entries share ns_parse.c and compose
# only already-selected caller-owned wire helpers plus the x86 errno slot.
schema = "crabc.x86_64-nameser-message-parser-provider/v1"
target = "x86_64-unknown-linux-musl"
platform = "Linux/x86-64 little-endian"
oracle = "Pinned musl 1.2.6 release commit 9fa28ece75d8a2191de7c5bb53bed224c5947417"

[work_package]
target_family = "libc.resolver"
target_verified_slice = "static-c-nameser-message-parser"
blocker = "Resolved by this selected artifact: the unconditional pinned-musl `<arpa/nameser.h>`/`<resolv.h>` declarations `ns_initparse`, `ns_parserr`, and `ns_name_uncompress` appeared in all seven frozen profiles with no x86 default-static provider, despite one finite source-closed caller-owned parser block whose helper dependencies are already selected."
prerequisites = ["oracle.musl-toolchain", "libc.errno-tls", "static-c-dn-expand", "static-c-ns-get16", "static-c-ns-get32", "static-c-ns-skiprr"]
dependent_work = ["libc.headers-layouts callable-provider complement closure", "libc.resolver bounded C resolver/netdb integration", "compat.resolver-network", "x86 static product qualification"]
musl_source_mapping = ["src/network/ns_parse.c::ns_initparse", "src/network/ns_parse.c::ns_parserr", "src/network/ns_parse.c::ns_name_uncompress"]
baseline_contract = "Pinned musl 1.2.6 ns_parse.lo initializes an ns_msg with caller-owned packet sections, parses one caller-selected question/resource record into caller-owned ns_rr storage, and expands a bounded name through dn_expand. It preserves ns_msg cursor/record transitions, uses ns_skiprr for section/forward record spans, ns_get16/ns_get32 for fixed wire fields, ENODEV for invalid section/index, and EMSGSIZE for malformed message, record, or expansion input through the selected initial-TLS errno slot. It has no resolver configuration, I/O, allocation, netdb database, or persistent parser state."
source_owners = ["compat/x86_64/nameser-message-parser-provider.toml", "compat/upstreams.toml", "compat/abi/musl-1.2.6/aarch64/libc.a.static.tsv", "libc/Cargo.toml", "libc/src/lib.rs", "libc/src/c_abi/x86_64/static_c_abi.rs", "libc/src/c_abi/x86_64/nameser_message_parser.rs", "libc/src/c_abi/x86_64/dn_expand.rs", "libc/src/c_abi/x86_64/ns_get16.rs", "libc/src/c_abi/x86_64/ns_get32.rs", "libc/src/c_abi/x86_64/ns_skiprr.rs", "libc/src/c_abi/x86_64/errno.rs", "libc/src/c_abi/x86_64/static_tls.rs", "include/errno.h", "include/resolv.h", "include/arpa/nameser.h", "include/arpa/nameser_compat.h", "include/netinet/in.h", "include/stddef.h", "include/stdint.h", "include/sys/socket.h", "include/bits/alltypes.h", "compat/x86_64/nameser_header_abi_probe.c", "compat/x86_64/nameser_header_abi_probe.cpp", "compat/x86_64/run_nameser_header_abi.sh", "compat/x86_64/static_c_abi_exports.txt", "compat/x86_64/libc_nameser_message_parser_probe.c", "compat/x86_64/libc_nameser_message_parser_start.S", "compat/x86_64/run_libc_nameser_message_parser.sh", "compat/x86_64/parity.toml", "scripts/dev-x86_64.sh"]
focused_evidence_command = "./scripts/dev-x86_64.sh libc-nameser-message-parser"
family_aggregate_command = "./scripts/dev-x86_64.sh campaign-family libc.resolver"
product_command = "./scripts/dev-x86_64.sh campaign-static"
negative_scope = "This package owns only three musl caller-owned nameserver message/record parser entry points. It excludes resolver state and __res_state/_res, /etc/hosts, /etc/resolv.conf, DNS packet I/O or transport, sockets, getaddrinfo/getnameinfo, general netdb or conventional database behavior, h_errno, DNS cache/retry/search policy, allocation, stdio, NSS/plugins, libc.so, CRT, loader, sysroot, resolver-family completion, promotion, and public x86 support."
expected_transition = "One private verified parser slice is added inside still-planned libc.resolver, and the default-static callable-provider complement accounts for these three existing unconditional header declarations. No capability, required-family status, product gate, promotion state, or public-support boundary changes."
evidence = ["seven-profile pinned-musl/project C and C++ declaration/layout/linkage matrix", "pinned-musl versus true-static ns_msg/ns_rr parser state-machine and errno differential", "single-object archive selection with exact helper/TLS closure and final ELF inspection"]
