# Checked x86 header-callable ownership routing.
#
# This contract consumes the compiler-derived callable inventory but does not
# claim archive extraction or runtime behavior.  It makes every currently
# selected external callable either a current selected provider assignment or
# one exact deferred owner, while keeping any missing pinned-musl declarations
# as a separate headers blocker.
schema = "crabc.x86_64-header-callable-disposition/v1"
target = "x86_64-unknown-linux-musl"
platform = "Linux/x86-64 little-endian"
oracle = "Pinned musl 1.2.6"
callable_inventory = "compat/x86_64/header_callable_inventory.json"
static_c_abi_exports = "compat/x86_64/static_c_abi_exports.txt"
parity_ledger = "compat/x86_64/parity.toml"
generated_report = "compat/x86_64/header_callable_disposition.json"

# An empty array is intentional: the checked inventory presently has no
# pinned-musl callable declaration absent from the project headers. Keeping
# this explicit lets the contract distinguish zero missing declarations from
# an omitted routing dimension.
missing_reference_declaration_group = []

[policy]
compiler_derived_candidate_externals = true
exclusive_exhaustive_primary_disposition = true
header_ownership_routing = true
archive_extraction = false
runtime_semantics = false
family_promotion = false
public_support = false

[work_package]
target_family = "libc.headers-layouts"
target_obligation = "header-callable-disposition"
blocker = "The frozen selected external callable surface had a single no-provider bucket, which could not distinguish planned semantic owners, compiler builtins, consumer callbacks, oracle-declared no-provider declarations, or the now-selected project-only addressable atomic provider policy."
prerequisites = ["oracle.musl-toolchain", "compiler-derived selected header callable inventory", "selected static C ABI export ratchet", "checked feature-archive provider partition"]
dependent_work = ["maintain zero missing selected header declarations", "libc.c-abi-compat final callable-provider archive closure", "ordinary archive extraction for future providers", "header-family aggregate closure"]
baseline_source = "Pinned musl 1.2.6 selected x86 public headers and the checked compiler-derived candidate callable inventory."
source_owners = ["compat/x86_64/header_callable_disposition.toml", "compat/x86_64/header_callable_disposition.py", "compat/x86_64/header_callable_linkage_audit.py", "compat/x86_64/header_callable_inventory.json", "compat/x86_64/static_c_abi_exports.txt", "compat/x86_64/parity.toml", "compat/x86_64/feature_archive_roster.py", "compat/x86_64/headers-layouts-foundation.toml", "compat/x86_64/tests/test_feature_archive_roster.py", "compat/x86_64/tests/test_header_callable_disposition.py", "compat/x86_64/tests/test_header_callable_inventory.py", "compat/x86_64/tests/test_parity_ledger.py", "compat/x86_64/tests/test_runner.py", "compat/x86_64/validate_parity_ledger.py", "scripts/dev-x86_64.sh"]
focused_evidence_command = "./scripts/dev-x86_64.sh header-callable-disposition"
family_aggregate_command = "./scripts/dev-x86_64.sh campaign-family libc.headers-layouts"
negative_scope = "This accounting slice neither supplies a callable implementation nor performs archive extraction. It does not infer runtime semantics from ownership, promote libc.headers-layouts, complete libc.c-abi-compat, or claim public x86 support."
expected_transition = "Completed as a non-promoting checked disposition: all 1,525 current candidate external callable names receive exact accounting records, including statx as a planned libc.posix-runtime provider, six project-only addressable atomic names with selected default-static providers, seven verified opt-in interval-timer, file-handle, spawn-file-actions, process-exec, temporary-name, pthread-spin, and permanent-stream-formatted-I/O feature archives owning thirty-one names, and the planned owned-static runtime profile owning twenty-three direct aggregate additions. The 296 planned-provider names remain provider/archive work. Declaration parity remains red despite the zero missing reference declaration names until the independent declaration/macro matrix and remaining header obligations close."
evidence = ["compiler-derived inventory digest binding", "exact disjoint primary callable partition", "exact deferred-owner roster", "exact missing-reference declaration roster", "native x86 inventory regeneration plus checked report"]

