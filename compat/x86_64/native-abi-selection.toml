# Exact native owner policy; complete observations and unresolved evidence stay separate.
schema = "crabc.x86_64-native-abi-selection/v1"
target = "x86_64-unknown-linux-musl"

[inputs]
frozen_baseline = "compat/x86_64/aarch64_frozen_baseline.json"
coverage = "compat/crabc-rs/coverage.toml"
frozen_dynamic = "compat/abi/musl-1.2.6/aarch64/libc.so.dynamic.tsv"
frozen_static = "compat/abi/musl-1.2.6/aarch64/libc.a.static.tsv"
callable_inventory = "compat/x86_64/header_callable_inventory.json"
callable_disposition = "compat/x86_64/header_callable_disposition.json"
parity = "compat/x86_64/parity.toml"

[[profiles]]
id = "reference"
artifacts = ["reference-static", "reference-shared"]
feature_root = "pinned-musl-1.2.6"

[[profiles]]
id = "owned-static"
artifacts = ["candidate-static", "static-crt1.o", "static-Scrt1.o", "static-rcrt1.o", "static-crti.o", "static-crtn.o", "static-builtins"]
feature_root = "libc/x86-owned-static-runtime"

[[profiles]]
id = "owned-dynamic"
artifacts = ["candidate-shared", "candidate-loader", "dynamic-crt1.o", "dynamic-Scrt1.o", "dynamic-crti.o", "dynamic-crtn.o", "dynamic-crabc-dynamic-attach.o", "dynamic-builtins"]
feature_root = "libc/x86-owned-dynamic-runtime"

[[owner_groups]]
id = "declared-callable-providers"
selector = "header-providers"
disposition = "public-provider"
owner = "checked-header-provider-routing"
family = "libc.c-abi-compat"
