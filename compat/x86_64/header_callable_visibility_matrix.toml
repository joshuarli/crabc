# Finite, compiler-derived x86 callable feature-visibility evidence.
#
# This freezes the direct-public-include comparison boundary without claiming
# general header ABI parity. `header_callable_inventory.json` owns compiler
# collection; this contract only defines how its already-observed callable
# surfaces are compared and how the eight project-only paths stay explicit.
schema = "crabc.x86_64-header-callable-feature-visibility-matrix/v1"
target = "x86_64-unknown-linux-musl"
platform = "Linux/x86-64 little-endian"
oracle = "Pinned musl 1.2.6"
inventory = "compat/x86_64/header_callable_inventory.json"
public_headers = "compat/x86_64/public_headers.txt"
generated_report = "compat/x86_64/generated/header_callable_visibility_matrix/report.json"
pinned_public_header_count = 183
candidate_public_header_count = 191
profiles = ["c11-gnu", "cxx17-gnu", "c11-strict", "c11-posix-2008", "c11-xopen-700", "c11-bsd", "cxx17-strict"]

[policy]
compiler_derived_inventory = true
direct_public_include_visibility = true
callable_names_and_classes_only = true
header_text_parsing = false
prototype_or_macro_replacement_equality = false
noncallable_abi = false
linkage_or_runtime = false
family_promotion = false
public_support = false

# This callable inventory observes one exceptional pinned-musl source outcome,
# not a candidate waiver. The empty-TU closure separately records its broader
# applicability diagnostic; do not copy that diagnostic's C++ exception here.
[[oracle_not_applicable]]
header = "aio.h"
profile = "c11-strict"
reason = "Pinned musl leaves struct sigevent incomplete without a POSIX or GNU feature request."

# A retained row records current source-tree behavior only. It neither makes a
# standalone path part of the musl oracle nor supplies an x86 runtime/linkage
# promise. Removing or repairing any one path changes the public header ABI
# and requires a separately reviewed decision.
[[project_only_header]]
path = "daemon.h"
disposition = "retained-pending-c-abi-policy"
origin = "standalone-alias"
observed_profiles = ["c11-gnu", "cxx17-gnu", "c11-strict", "c11-posix-2008", "c11-xopen-700", "c11-bsd", "cxx17-strict"]
retained_profiles = ["c11-gnu", "cxx17-gnu", "c11-strict", "c11-posix-2008", "c11-xopen-700", "c11-bsd", "cxx17-strict"]
c_surface = "callable-declarations"
cxx_surface = "callable-declarations"
cxx_linkage = "cxx-default"
canonical_headers = ["unistd.h"]
canonical_visibility = "unistd.h gates daemon to X/Open, GNU, and BSD forms; this standalone path is currently unconditional."
declared_symbols = ["daemon"]
capability_owner = "process.control"
x86_family = "libc.posix-runtime"
provider_state = "unprovided"
evidence = ["include/daemon.h", "include/unistd.h", "compat/crabc-rs/coverage.toml#process.control"]
removal_requires_abi_decision = true

