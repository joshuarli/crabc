# Finite x86 declaration/macro feature-visibility evidence derived from the
# checked compiler-generated declaration-form matrix. The source report owns
# AST and preprocessor collection; this contract derives only visible identity
# `(kind, name)` pairs so source-form differences cannot masquerade as missing
# feature visibility or ABI equality.
schema = "crabc.x86_64-header-declaration-macro-feature-visibility-matrix/v1"
target = "x86_64-unknown-linux-musl"
platform = "Linux/x86-64 little-endian"
oracle = "Pinned musl 1.2.6"
source_abi_contract = "compat/x86_64/header_abi_matrix.toml"
source_abi_report = "compat/x86_64/generated/header_abi_matrix/report.json"
callable_visibility_contract = "compat/x86_64/header_callable_visibility_matrix.toml"
public_headers = "compat/x86_64/public_headers.txt"
generated_report = "compat/x86_64/generated/header_declaration_macro_visibility_matrix/report.json"
pinned_public_header_count = 183
candidate_public_header_count = 191
profiles = ["c11-gnu", "cxx17-gnu", "c11-strict", "c11-posix-2008", "c11-xopen-700", "c11-bsd", "cxx17-strict"]

[policy]
derived_from_checked_declaration_form_matrix = true
compiler_derived_source = true
header_text_parsing = false
direct_public_include_visibility = true
named_declaration_and_macro_identity = true
declaration_form_equality = false
record_byte_layouts = false
archive_linkage = false
runtime = false
family_promotion = false
public_support = false

[work_package]
target_family = "libc.headers-layouts"
target_obligations = ["feature-visibility"]
blocker = "The callable-only matrix excludes named noncallable declaration and macro visibility, while the source-form matrix conflates missing identities with differing source spellings."
prerequisites = ["oracle.musl-toolchain", "libc.errno-tls"]
dependent_work = ["libc.posix-runtime", "libc.pthread-tls", "libc.text-math-locale-stdio", "libc.c-abi-compat", "sysroot.static-tls", "ldso.dynamic-runtime"]
baseline_contract = "Pinned musl 1.2.6 public headers, Linux 5.10 UAPI input, the frozen AArch64 capability ledger, and System V AMD64 LP64/x87 ABI."
source_owners = ["compat/x86_64/header_declaration_macro_visibility_matrix.toml", "compat/x86_64/header_declaration_macro_visibility_matrix.py", "compat/x86_64/generated/header_declaration_macro_visibility_matrix/report.json", "compat/x86_64/run_header_declaration_macro_visibility_matrix.sh", "compat/x86_64/tests/test_header_declaration_macro_visibility_matrix.py", "compat/x86_64/header_abi_matrix.toml", "compat/x86_64/header_abi_matrix.py", "compat/x86_64/generated/header_abi_matrix/report.json", "compat/x86_64/header_callable_visibility_matrix.toml", "compat/x86_64/header_callable_visibility_matrix.py", "compat/x86_64/header_callable_inventory.toml", "compat/x86_64/header_callable_inventory.py", "compat/x86_64/header_callable_inventory.json", "compat/x86_64/public_headers.txt", "compat/x86_64/headers-layouts-foundation.toml", "compat/x86_64/parity.toml", "compat/x86_64/validate_parity_ledger.py", "scripts/dev-x86_64.sh"]
focused_evidence_command = "./scripts/dev-x86_64.sh header-declaration-macro-visibility-matrix"
family_aggregate_command = "./scripts/dev-x86_64.sh campaign-family libc.headers-layouts"
product_command = "./scripts/dev-x86_64.sh campaign-static"
negative_scope = "This matrix derives compiler-visible named declaration and macro identity only. It does not compare declaration forms, macro replacements, record byte layouts, archive extraction, selected callable implementation, runtime behavior, installed sysroot closure, family promotion, or public x86 support."
expected_transition = "feature-visibility moves from planned to partial-verified while libc.headers-layouts remains planned."
evidence = ["all-header-declaration-macro-feature-visibility-matrix"]

[[oracle_not_applicable]]
header = "aio.h"
profile = "c11-strict"
reason = "Pinned musl leaves struct sigevent incomplete without a POSIX or GNU feature request."
