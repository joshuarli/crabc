  "x86 Linux bounded inotify ABI: inotify_init1=294 uses rdi, inotify_add_watch=254 uses rdi/rsi/rdx, inotify_rm_watch=255 uses rdi/rsi, and read=0, close=3, fcntl=72 establish caller-buffered descriptor lifetime and flags; struct inotify_event is a 16-byte align-4 header with wd i32 at 0, mask u32 at 4, cookie u32 at 8, len u32 at 12, name at 16, and each variable record is 4-byte aligned; IN_NONBLOCK=0x00000800 and IN_CLOEXEC=0x00080000",
  "x86 Linux civil wall-clock ABI: gettimeofday=96 receives an initialized private 16-byte align-8 timeval output through rdi, with signed i64 tv_sec/tv_usec at offsets 0/8, while rsi is the null obsolete timezone pointer; the Rust seam normalizes that observation into UnixTime without a C timeval/time_t/tm ABI",
