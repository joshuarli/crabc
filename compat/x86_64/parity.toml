description = "Bounded direct crabc-rs operations plus scalar eventfd, typed poll/ppoll/pause, select/pselect, and packed epoll readiness including temporary signal masks, read-only process identity/session plus supplementary-group query/fill and pidfd_open, typed calling-process resource-limit query/mutation plus read-only targeted resource-limit query and the process-global umask exchange, unsafe calling-task filesystem-credential query/current-effective-ID requests, typed read-only resource usage copied from Linux's initialized kernel prefix without musl's reserved tail, typed read-only process accounting in opaque clock ticks, getpriority plus typed scheduling-priority mutation and scheduler-priority bounds, fcntl(F_GETLK) lock observation plus typed F_GETFL/F_SETFL status-flag observation/mutation, typed fs::flock advisory whole-file locking, typed fs::sendfile descriptor transfer, typed fs::copy_file_range descriptor-range copying, typed fs::posix_fallocate mode-zero range allocation, typed fs::fallocate closed-mode range allocation, and the bounded descriptor, directory-relative, current-directory, symlink, and whole-second timestamp-mutation family, gettid/getcpu/sched_yield plus read-only round-robin interval and direct bounded CPU-affinity observation/mutation, direct calling-thread setresuid/setresgid, and borrowed-atomic futex wait/wake, uname/sysinfo/load observations, random-source, a descriptor fstat ABI slice plus direct anonymous memory-file creation and bounded seal observation/mutation, direct typed access/accessat real/effective-credential observations whose separate filesystem.path-core capability is admitted only through the record-owning aggregate evidence, caller-buffer plus alloc-gated physical current-working-directory observations and validated logical-current-directory names from explicit `&CStr` snapshots, typed fadvise64/readahead, the complete typed seek/tell/ftruncate/fsync/fdatasync file-position family plus typed fs::sync system-wide filesystem synchronization, typed fs::syncfs descriptor-associated filesystem synchronization, and typed sync_file_range range-writeback requests, closed mmap/mremap/mprotect/munmap plus per-range mlock/mlock2/munlock, mapping synchronization, Linux/POSIX advice, and page residency, clock_gettime/clock_getres plus a bounded whole-second `time` observation, typed nanosleep and clock_nanosleep with mode-specific EINTR results, complete typed process interval-timer control plus bounded aliases, complete typed timer descriptors, the allocation-free native `pattern::fnmatch` matcher, alloc-gated explicit-root `pattern::{GlobPath, glob, glob_at}` traversal, and the proved signal-action boundary. Both pattern slices remain Rust-only native evidence, not public C pattern APIs or public x86 support."
