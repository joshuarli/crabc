  "compat/x86_64/x86_child_ownership_reference_probe.c",
  "scripts/dev-x86_64.sh",
]
x86_abi_prerequisites = [
  "x86 Linux child lifecycle uses clone=56 with SIGCHLD only, execve=59 with owned terminal-null pathname/argv/envp pointers, and wait4=61 with an exact positive pid, writable i32 wait-status, WaitOptions bits (WNOHANG=1, WUNTRACED=2, WCONTINUED=8), and null rusage",
  "PreparedExec uses pipe2=293 plus fcntl=72 F_DUPFD_CLOEXEC to reserve an error writer outside every FdAction::Dup2 target; child setup admits only close=3, dup2=33, setpgid=109, setsid=112, and rt_sigprocmask=14 before execve or error-pipe publication and exit_group=231",
  "The raw/musl oracle pins int and pid_t as four bytes, clone=56/wait4=61/waitid=247, and the 128-byte align-8 siginfo_t child-report layout through si_status at offset 24; its contained lifecycle proves unchanged WNOHANG status, WNOWAIT observation, exit 42, one exact reap, then ECHILD",
  "Child is a unique non-Clone/non-Copy wait owner: wait consumes it even when NOHANG reports no state, so WaitStatus is only the returned i32 Linux status decoder and never grants another wait authority",
