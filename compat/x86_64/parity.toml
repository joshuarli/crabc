[[family.verified_artifact]]
id = "dynamic-pie-scrt1-startup"
description = "Private native x86 Rust-produced `Scrt1.o` dynamic-PIE startup artifact within still-planned `crt.dynamic-startup`, not a selected CRT family. It preserves the original SysV entry stack, aligns the call frame, reaches one bounded Rust startup handoff without GOT/TLS access, and follows pinned musl 1.2.6 x86-64's null `rtld_fini` convention rather than inventing a `%rdx` loader-finalizer ABI. A freestanding candidate-only six-argument `__libc_start_main` probe proves candidate preinit/init/main/fini callback order and the null finalizer; a separate pinned-musl dynamic-PIE launch compares observable `IMF` main-image behavior but does not infer candidate callback consumption. The launch checks candidate `ET_DYN` PIE, one pinned `PT_INTERP`, one `DT_NEEDED=libc.so`, and retained private revision-one `CRABC` owned-CRT marker; the builder rejects a forged marker. GNU-property/CET/ISA metadata parity is deliberately excluded. It does not select crabc-libc, crabc-ldso, RuntimeV1, a loader-to-CRT handoff, loader TLS, static-link helper closure, dlfcn, installed CRT/sysroot, family completion, or public x86 support."
source_owners = ["crt/build_x86_64.py", "crt/src/x86_64_Scrt1.rs", "crt/src/x86_64_dynamic_startup.rs", "crt/src/x86_64_array_boundaries.rs", "crt/src/x86_64_crti.rs", "crt/src/x86_64_crtn.rs", "crt/fixtures/dynamic_startup_fixture_x86_64.c", "crt/fixtures/dynamic_startup_lifecycle_fixture_x86_64.c", "crt/tests/test_x86_64_dynamic_startup.py", "crt/x86_64-dynamic-startup.md", "crt/x86_64-static-pie.md", "compat/x86_64/run_musl_oracle.sh", "docker/Dockerfile.x86_64", "scripts/dev-x86_64.sh"]
x86_abi_prerequisites = ["The Linux x86-64 dynamic-PIE entry receives the original argc/argv/envp/auxv stack in `%rsp`; the entry preserves it in r15, clears rbp, realigns rsp to 16 bytes, and has one direct R_X86_64_PLT32 handoff to the defined `__crabc_x86_64_dynamic_start` symbol before normal Rust code.", "The early entry has no GOT or TLS relocation and does not capture entry `%rdx`; pinned musl 1.2.6 x86-64 Scrt1's private `_start_c` passes a null sixth `rtld_fini` argument to `__libc_start_main`.", "The candidate object carries one exact allocated SHT_NOTE `.note.crabc.owned-crt` `CRABC` type 0x43525401 revision one marker, retained inside a final PIE PT_NOTE range. It is a future-admission marker only; no current crabc loader consumes it.", "A no-interpreter ET_EXEC fixture resolves the real candidate Scrt1.o's six-argument boundary, requires null rtld_fini, and proves forward preinit/init plus reverse fini callback order `PQIJKMYXF`. Separately, the evidence links candidate Scrt1.o/crti.o/crtn.o against only the pinned musl interpreter and libc.so, checks EM_X86_64 ET_DYN, pinned PT_INTERP, and exactly DT_NEEDED libc.so, then compares its musl-owned constructor/main/destructor output with pinned-musl Scrt1.o. GNU-property/CET/ISA metadata parity is excluded."]
x86_header_prerequisites = ["The fixture compiles only against the pinned musl 1.2.6 headers and does not establish installed crabc headers, an owned compiler driver, or a public CRT link specification."]
native_evidence = [{ state = "verified", command = "./scripts/dev-x86_64.sh crt-dynamic-startup", scope = "Native x86 private dynamic-PIE CRT evidence first verifies the pinned-musl oracle, then compares pinned-musl and Rust-produced Scrt1.o/crti.o/crtn.o links with the pinned interpreter/libc. It proves the musl x86 null-finalizer convention, bounded entry shape, musl-owned `IMF` launch behavior, ET_DYN/PT_INTERP/DT_NEEDED identity, retained SHT_NOTE/PT_NOTE marker, and forged-marker rejection. A separate no-interpreter candidate-only ET_EXEC fixture invokes the supplied callbacks and proves `PQIJKMYXF` forward/reverse lifecycle order; `IMF` does not claim pinned musl consumed candidate callbacks. It does not select candidate libc, candidate ldso, loader handoff/TLS, RuntimeV1, sysroot, family completion, GNU-property/CET/ISA metadata parity, or public x86 support." }]
oracle = [{ kind = "c-posix", source = "Pinned musl 1.2.6 x86-64 Scrt1.o, crti.o, crtn.o, loader, and libc.so", role = "Dynamic application launch, __libc_start_main signature, null finalizer, and musl-owned constructor/main/destructor behavior oracle; it is not an oracle that candidate callback arguments were consumed." }, { kind = "elf-abi", source = "System V AMD64 psABI and Linux ELF ABI", role = "x86-64 entry frame, C-call register framing, ET_DYN, PT_INTERP, PT_NOTE, and dynamic-linkage contract." }]

