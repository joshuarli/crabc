  "x86 Linux selected direct mapping ABI: mmap=9 uses rdi/rsi/rdx/r10/r8/r9 for address, length, protection, flags, descriptor, and offset; mprotect=10 uses rdi/rsi/rdx; munmap=11 uses rdi/rsi. The closed Rust boundary admits only ordinary shared/private mappings and no fixed-address or wider mapping policy",
