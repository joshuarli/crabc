  { state = "required", command = "./scripts/dev-x86_64.sh timeval-transitive-header-abi", scope = "This isolated raw-GCC project-header-first/pinned-musl-reference 35-row five-header C11/C++17 compile matrix checks sys/time.h's required sys/select.h timeval provider for its direct and sys/timex roots, plus complete timeval visibility and selected x86 LP64 records through all five headers. It does not require an identical private include graph or dependent feature surface. It does not select direct sys/time.h callable declaration/linkage, other sys/time.h feature visibility or macro parity, dependent-header callable linkage, runtime behavior, all-header closure, runtime, family completion, or public support." },
  { state = "required", command = "./scripts/dev-x86_64.sh sys-time-direct-header-abi", scope = "This isolated raw-GCC project-header-first/pinned-musl-reference seven-row direct sys/time.h C11/C++17 compile matrix checks selected unconditional and GNU/BSD/GNU-only declarations, x86 LP64 timeval/itimerval/timezone layouts, interval-timer values, timer/conversion macros, and C++ declaration C-linkage spelling. It checks header-requested external symbol spelling only, not actual callable artifact linkage. It does not select runtime behavior, all-header closure, runtime completion, family completion, or public support." },
