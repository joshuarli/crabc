  { state = "required", command = "./scripts/dev-x86_64.sh ioctl-header-abi", scope = "This isolated raw-GCC project-header-first/pinned-musl-reference seven-row direct sys/ioctl.h C11/C++17 compile matrix checks only the signed int variadic ioctl declaration, C++ C-linkage spelling, selected Linux _IOC composition, direct 8-byte align-2 winsize layout, and selected request values. It checks header-requested external symbol spelling only, not ioctl artifact linkage. It does not select generic device/request behavior, all-header closure, runtime completion, family completion, or public support." },
