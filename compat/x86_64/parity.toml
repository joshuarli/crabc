# This ledger is deliberately capability and gate based.  It does not count
# symbols and it does not make the bounded foundation lane a supported target.
schema = "crabc.x86_64-runtime-parity/v3"
target = "x86_64-unknown-linux-musl"
platform = "Linux/x86-64 little-endian"
kernel_msrv = "5.10"
baseline_platform = "Linux/AArch64 little-endian"
baseline_capability_ledger = "compat/crabc-rs/coverage.toml"
baseline_gate_dispatch = "scripts/dev.sh"

[policy]
native_execution_only = true
public_support = false
no_emulation = true
no_portability_framework = true
no_symbol_count_claim = true

[status_meaning]
foundation_verified = "A bounded native source or artifact slice has the named evidence. It does not select the full artifact or discharge later family obligations."
planned = "The AArch64-equivalent family remains a promotion obligation; complete native evidence is required. A `verified_slice` records a completed private vertical slice without making the family selectable."
verified_artifact = "A `verified_artifact` records a completed selected native binary boundary with no baseline semantic-capability owner, such as header/layout bootstrap evidence. It cannot imply capability ownership, family completion, selectability, or public support."

# This list is the closed promotion surface.  The validator rejects an omitted,
# duplicated, or extra family and verifies dependency order.  Adding an AArch64
# family therefore requires a deliberate x86 ledger decision rather than an
# accidental change in a broad test command.
[promotion]
required_families = [
  "oracle.musl-toolchain",
  "core.architecture",
  "facade.direct",
  "facade.record-owning",
  "libc.raw-syscall",
  "libc.errno-tls",
  "libc.headers-layouts",
  "libc.posix-runtime",
  "libc.pthread-tls",
  "libc.text-math-locale-stdio",
  "libc.resolver",
  "libc.c-abi-compat",
  "ldso.relative-relocation",
  "ldso.dynamic-runtime",
  "crt.static-pie",
  "crt.dynamic-startup",
  "sysroot.static-tls",
  "sysroot.owned-artifact",
  "compat.abi-differential",
  "compat.posix-process",
  "compat.resolver-network",
  "compat.loader-corpus",
  "consumer.rust-std-lto",
  "consumer.source-build",
  "capability.accounting",
  "performance.release",
]

# Native mimalloc remains private, fixed-allocator evidence.  Keeping this
# explicit prevents it from being mistaken for an x86 runtime-parity family.
[[excluded_surface]]
id = "allocator.mimalloc-private"
reason = "Private fixed-allocator evidence is neither crabc-libc integration nor x86 runtime/platform support."
evidence = ["compat/allocator/README.md", "native-mimalloc.md"]

# This is a native oracle-toolchain gate, not a crabc runtime artifact.  It
# must remain first: every C/POSIX family below that uses musl as its oracle
# explicitly depends on this source-and-runtime identity proof.
[[family]]
id = "oracle.musl-toolchain"
order = 5
depends_on = []
category = "architecture-foundation"
description = "Pinned musl 1.2.6 x86-64 compiler, headers, loader, and libc identity proof for all native C/POSIX oracle lanes."
aarch64_gates = ["symbols"]
source_owners = ["compat/upstreams.toml", "compat/x86_64/musl_oracle_probe.c", "compat/x86_64/run_musl_oracle.sh", "docker/Dockerfile.x86_64", "docker/x86_64-musl-oracle-gcc"]
x86_abi_prerequisites = ["Native Linux/x86-64 execution", "pinned musl x86-64 interpreter and libc", "compiler specs that select only the pinned musl sysroot"]
x86_header_prerequisites = ["Pinned musl 1.2.6 headers selected through the oracle compiler, never Alpine bootstrap or ambient host headers."]
native_evidence = [{ state = "verified", command = "./scripts/dev-x86_64.sh musl-oracle", scope = "Native x86-only source, compiler-specs, ELF-interpreter, and mapped-libc identity proof; it does not select crabc-libc or claim public support." }]
oracle = [{ kind = "c-posix", source = "Pinned musl 1.2.6 source build", role = "Native C/POSIX oracle-toolchain identity contract." }]
capabilities = []
status = "foundation-verified"

[[family]]
id = "core.architecture"
order = 10
depends_on = []
category = "architecture-foundation"
description = "Typed kernel, vDSO, TLS-thread-pointer, fenv, atomic/futex, and signal-restorer primitives."
aarch64_gates = ["crabc-rs"]
source_owners = ["crabc-core", "crabc-core/src/syscall_x86_64.rs", "crabc-core/src/signal_x86_64.rs", "crabc-core/src/fenv_x86_64.rs"]
x86_abi_prerequisites = ["x86-64 Linux syscall register convention", "%fs thread-pointer model", "x87/MXCSR floating-point state", "rt_sigaction/SA_RESTORER signal frame"]
x86_header_prerequisites = ["Not a public C-header surface; target records stay behind typed crabc-core APIs."]
native_evidence = [{ state = "verified", command = "./scripts/dev-x86_64.sh core", scope = "Closed native crabc-core suite plus no-fxrstor emitted-code gate." }]
oracle = [{ kind = "kernel-abi", source = "Linux 5.10 x86-64 ABI", role = "Direct architecture boundary contract." }]
capabilities = ["runtime.compiler-abi"]
status = "foundation-verified"

