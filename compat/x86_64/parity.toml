description = "Private native x86 selected-static-archive simple signal-control block. One dependency-free `crabc-libc` archive resolves only `sigaction`/`signal`, application signal-set helpers, the calling-thread `sigprocmask`/`sigpending` boundary, and `SIGRTMAX` into a freestanding C fixture after an equivalent pinned-musl execution. The fixture proves musl's partial output writes and `sigpending(NULL)` EFAULT behavior; its archive relocation gate and raw `tgkill(getpid,gettid,SIGUSR*)` delivery together prove `sigaction` installs and returns through the exact hidden syscall-15 restorer, without selecting a public delivery wrapper. This artifact is deliberately narrower than the baseline signal capability. It does not select process.signal, generic process/thread delivery, waits or cancellation points, queues, alternate stacks, pthread signal policy, legacy helpers, libc.so, CRT, dynamic TLS, loader, sysroot, allocator, or public x86 support."
