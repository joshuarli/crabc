id = "process.child-ownership"
description = "Private native x86 prepared-exec child ownership: alloc-backed PreparedExec owns copied program, argv, and envp storage before spawning; FdAction and SpawnOptions describe bounded async-signal-safe child setup; a successful Child uniquely owns one wait transition, while WaitOptions and WaitStatus retain the selected Linux wait encoding. Parent-visible child setup or exec errors travel over a CLOEXEC error pipe and are reaped before spawn returns an error. This admits neither a generic process-control API nor a child supervision runtime."
source_owners = [
  "crabc-core/src/io.rs",
  "crabc-core/src/pipe.rs",
  "crabc-core/src/process.rs",
