description = "Private native x86 static pthread-key/C11-TSS lifecycle artifact inside still-planned `libc.pthread-tls`. One dependency-free `crabc-libc` archive exposes exactly `pthread_key_create`/`pthread_key_delete`/`pthread_getspecific`/`pthread_setspecific` and `tss_create`/`tss_delete`/`tss_get`/`tss_set`. It selects a private 128-key table, a permanent process-main value table, and one value table in each selected worker control: a null destructor still reserves a key, active selected main/worker values are isolated, deletion clears only those selected tables without a callback, and C11 creation collapses failure to `thrd_error`. On selected normal return, `pthread_exit`, C11 return, and `thrd_exit`, a non-null key value is cleared before its destructor, the private metadata lock is released for the callback, and a rearmed value may run in at most four ascending-key passes; this phase completes before join-result publication or `SYS_exit`. The pinned-musl comparison covers main and selected-worker values, 128-key exhaustion/reuse, deletion without the old destructor, ordinary pthread/C11 return and explicit-exit routes, clear-before-callback, fourth-pass rearming, and caller-`errno` preservation. Invalid/deleted keys and non-selected callers deliberately fail closed instead of relying on musl's unchecked internal fast paths; selected-main admission requires the bootstrapped `%fs:0` plus Linux TID pair, so an inherited FS base alone is insufficient. It does not establish musl's weak/same-address TSD aliases or exact ELF parity. It excludes main-thread process-exit destructors, foreign threads beyond that admission boundary, cancellation and cleanup handlers, concurrent key-deletion/destructor interaction, fork/atfork, detached-thread lifecycle beyond the existing selected-worker exit seam, dynamic or loader TLS/DTV, allocator ordering, a general TCB or all-thread list, general pthread/C11 behavior, full pthread/TLS or x86-64 parity, promotion, and public x86 