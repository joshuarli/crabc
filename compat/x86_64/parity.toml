header_manifest = "compat/x86_64/headers-layouts.toml"
x86_abi_prerequisites = ["LP64 scalar widths", "SysV x86-64 aggregate alignment", "ELF/TLS data layout", "architecture-specific syscall numbers and flags", "x86 fcntl flags and flock/file-handle record layouts", "x86 144-byte struct stat, LP64 time, and pollfd record layouts", "x86 sys/select ABI: FD_SETSIZE=1024, 128-byte align-8 fd_set, 16-byte align-8 timeval/timespec, 128-byte align-8 sigset_t, and C-linkage select/pselect declarations", "x86 SysV direction-flag-clear entry/return convention and musl memcpy/memmove/memset string-instruction kernels", "x86 32-byte x87/MXCSR fenv_t, the six FE exception bits, four rounding encodings, and FE_DFL_ENV", "setjmp's six callee-saved GPRs, post-return stack, instruction pointer, and kernel-sized signal mask", "musl x86 public 152-byte sigaction to Linux 32-byte kernel-action packing, one-word signal mask, SA_RESTORER, and private syscall-15 restorer", "musl x86 public termios is a 60-byte align-4 NCCS=32 C record whose first 36 bytes are Linux TCGETS/TCSETS*'s four-u32/line/19-control-byte prefix; winsize is four u16 values at 8-byte align-2", "musl x86 public resource records: unsigned-long-long rlim_t, 16-byte rlimit, and 272-byte rusage whose kernel-initialized 144-byte prefix precedes a caller-resident 128-byte tail", "x86 child-reaping records: signed four-byte pid_t, unsigned four-byte id_t, P_ALL/P_PID/P_PGID values 0/1/2, WNOHANG=1/WEXITED=4/WNOWAIT=0x01000000, and a 128-byte align-8 siginfo_t with signo/errno/code at 0/4/8 and child pid/uid/status at 16/20/24", "x86 C11 immediate termination uses an LP64 SysV int status in rdi for exit_group=231, with exit=60 only as musl's defensive nonreturn fallback; it has no errno return or hook-state ABI", "x86 callback algorithms use LP64 pointer and size_t words: bsearch(key, base, nel, width, cmp) arrives in rdi/rsi/rdx/rcx/r8; qsort(base, nel, width, cmp) in rdi/rsi/rdx/rcx; and __qsort_r/qsort_r(base, nel, width, cmp, arg) in rdi/rsi/rdx/rcx/r8. qsort comparators receive a/b in rdi/rsi, qsort_r comparators receive a/b/arg in rdi/rsi/rdx, signed four-byte int returns in eax, and qsort_r is a same-address weak ELF alias of global __qsort_r with no errno/TLS, allocator, or runtime-state ABI"]
x86_header_prerequisites = [
  "`compat/x86_64/headers-layouts.toml` is the authoritative inventory of the thirty required native header gates. Each entry records only direct C/C++ includes and its runner; it intentionally does not assert a transitive include closure, all installed headers, archive linkage, runtime completion, or public x86 support.",
  "The verified `public-header-c-consumability` artifact derives its 183-entry public-header inventory from the pinned musl 1.2.6 x86 installation and rejects any candidate-side missing or differently consumable public header. It compiles each reference and project-header-first translation unit in C11+GNU mode, records eight candidate-only headers, and records the native image's shared missing-Linux-UAPI inputs for sys/kd.h, sys/soundcard.h, and sys/vt.h. This is header-consumability accounting only, without declaration, layout, linkage, runtime, or public-support parity.",
  "The staged fenv/float/fundamental-type declarations compile in both SSE and x87 evaluation modes; C/C++ alltypes/sys/types, sys/stat, time, poll, sys/select, fcntl, unistd, sys/utsname, sys/sysinfo, syscall, signal, termios, sys/mman, sys/resource, and setjmp layouts/declarations match musl in their named compile-only probes. The C/C++ poll probe and strict/GNU C/C++ select probe cover the readiness records, declarations, and C linkage; the select probe additionally covers fd_set and FD_* macros. The resource probe covers strict plus GNU/LFS declarations, LP64 rlimit/rusage layouts, selectors, priorities, and prlimit64/LFS aliases. The selected static bootstrap artifact additionally compiles project errno, string/strings, fenv, setjmp/bits/setjmp, signal, sys/mman, and syscall headers into one freestanding C consumer and executes their exact small memory/fenv/continuation surface. The selected static termios artifact separately compiles the project errno, fcntl, termios, alltypes, and syscall headers into a freestanding C consumer and proves the direct 36-byte termios-prefix contract. The selected static process-context artifact separately compiles project errno, sys/stat, sys/types, unistd, and syscall headers into a freestanding C consumer and proves the named identity/group/session/mask declarations. The selected static child-reaping artifact separately compiles project errno, signal, sys/types, sys/wait, and syscall headers into a freestanding C consumer and proves only wait-status declarations, siginfo_t facts, and x86 syscall constants. The selected static immediate-termination artifact separately compiles project stdlib, signal, sys/types, sys/wait, and syscall headers into a freestanding C consumer and proves one child _Exit status through fixture-local raw clone/wait control, not a lifecycle API. The selected static descriptor-I/O artifact separately compiles project errno, fcntl/bits-fcntl, sys/mman, sys/types, unistd, and syscall headers into a freestanding C consumer and proves the selected descriptor declarations, MFD_CLOEXEC fixture flag, and x86 constants. The selected static process-resources artifact separately compiles project errno, limits, sys/resource, sys/time, sys/types, unistd, and syscall headers into a freestanding C consumer and proves the selected LP64 resource records, aliases, errno, and x86 constants. The selected static readiness/signal-waits artifact separately compiles project errno, poll, signal, sys/select, sys/types, time, unistd, and syscall headers into a freestanding C consumer and proves the named readiness, timeout-copy, and temporary-mask declarations. The selected static C-string-copy artifact separately compiles project string.h declarations and proves unconditional strcpy/strncpy/strcat/strncat, POSIX/XOPEN/GNU/BSD-gated stpcpy/stpncpy, and GNU/BSD-gated strlcpy/strlcat selections against pinned musl. The selected static C ctype artifact separately compiles project ctype.h declarations and proves its fourteen unconditional classification/case-conversion declarations plus POSIX/XOPEN/GNU/BSD-gated isascii/toascii selections against pinned musl. The selected static integer-arithmetic artifact separately compiles project stddef.h and stdlib.h declarations and proves all six unconditional abs/labs/llabs/div/ldiv/lldiv entries plus the LP64 div_t/ldiv_t/lldiv_t record layouts against pinned musl. The selected static find-first-set artifact separately compiles project strings.h declarations and proves the XOPEN/GNU/BSD-gated ffs/ffsl/ffsll signatures, strict/POSIX hiding, and unmangled C++ linkage against pinned musl. The selected static random-entropy artifact separately compiles project errno, stddef, sys/random, sys/types, unistd, and syscall headers into a freestanding C consumer and proves the named getrandom/getentropy declarations, feature gates, constants, errno, and x86 syscall number. Every remaining selected installed header still needs a native compile-time and layout probe against the x86 artifact.",
  "The selected static intmax-arithmetic artifact separately compiles project stddef.h, stdint.h, and inttypes.h declarations and proves unconditional imaxabs/imaxdiv signatures, the LP64 imaxdiv_t layout, and unmangled C++ linkage against pinned musl.",
  "The selected static integer-parsing artifact separately compiles project errno.h, inttypes.h, stdint.h, limits.h, stddef.h, and stdlib.h declarations and proves all nine unconditional forms, LP64 intmax aliases, end-pointer/range/errno behavior, and unmangled C++ linkage against pinned musl.",
  "The selected static credential-observation artifact separately compiles project errno.h, stdint.h, sys/types.h, unistd.h, sys/syscall.h, and features.h declarations and proves unconditional getgroups plus GNU-only getresuid/getresgid signatures, strict/POSIX/BSD hiding, and unmangled C++ linkage against pinned musl.",
  "The selected static child-reaping header gate proves strict C/C++ wait/waitpid declarations and POSIX-selected waitid/siginfo_t declarations with unmangled C++ linkage against pinned musl. The project header's existing broader waitid visibility is recorded as a deliberate current divergence, not general x86 header completion.",
  "The selected static immediate-termination header gate proves unconditional C11/C++ _Exit(int) declaration and unmangled C++ linkage against pinned musl; it selects no ordinary exit/quick-exit hook or lifecycle completion.",
  "The selected static callback-algorithms header gate proves unconditional C/C++ bsearch and qsort declarations plus GNU/BSD-only qsort_r with its final-context comparator ABI, strict/POSIX/XOPEN hiding, private __qsort_r rejection, and unmangled C++ linkage against pinned musl; it selects no callback ownership, C longjmp, C++ exception, or general stdlib lifecycle contract.",
  "The selected static descriptor-entry artifact runs the project/pinned-musl C/C++ fcntl declaration gate, then separately compiles project errno, fcntl/bits-fcntl, sys/stat, sys/types, unistd, and syscall headers into a freestanding C consumer. It proves variadic open/openat and mode_t creat declarations, selected descriptor flags, and x86 syscall facts without selecting a general filesystem header or runtime surface.",
  "The socket-header gate compile-checks project-first and pinned-musl GNU C/C++ base socket transport declarations and address layouts, then executes the installed netinet/in.h IPv6 address-classification macros through both header sets. It proves only generic/IPv4/IPv6 socket-address records, selected transport declarations/constants, and the named classification macros; socket options, vectored/ancillary messages, address-conversion behavior, and C networking runtime behavior remain outside this partial header-evidence slice.",
  "The math-complex header gate runs C11 and C++ project-header-first and pinned-musl consumers in default SSE and `-mfpmath=387` modes. It proves the named x87 long-double/complex layouts and constants, float_t/double_t evaluation-mode selection, math_errhandling and fast-FMA macro policy, GNU `HUGE`, C complex accessor macros, tgmath dispatch and single evaluation, relational-predicate single evaluation, classification/sign declarations, and unmangled C++ linkage for the selected accessor/classifier symbols. It deliberately links pinned musl for C execution and therefore does not establish scalar/complex math runtime completion or public x86 support.",
]
