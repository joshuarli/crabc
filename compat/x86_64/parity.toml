description = "Private native x86 Variant-II initial-TLS interpreter artifact within still-planned `ldso.dynamic-runtime`, not the `crabc-ldso` target. A fixed main PIE (without PT_TLS) -> mid.so -> leaf.so graph maps exactly two GNU-Dynamic TLS DSO images. The candidate assigns one-based module IDs only to the TLS-bearing images, lays their PT_TLS images below TP with the musl 1.2.6 initial-layout alignment phase, copies initialized data, zeroes TBSS, installs a private immutable DTV plus module-size table at `%fs`, and sets ARCH_SET_FS only after all graph relocations and before dependency constructors. It accepts only R_X86_64_DTPMOD64/R_X86_64_DTPOFF64 and the fixed graph's __tls_get_addr JUMP_SLOT route; the private resolver rejects absent modules and offsets outside a module's recorded PT_TLS.p_memsz. The TLS-free candidate interpreter has no external runtime dependency; its exact two-DSO DT_NEEDED graph runs under `env -i`, while the pinned musl 1.2.6 static __tls_get_addr object supplies the naked reference main's resolver without a libc DT_NEEDED edge. The runner proves initialized values, 4096-byte alignment, TBSS zeroing and mutation, module-ID/DTV ownership, and that only the candidate resolves the direct main import from its interpreter. It fails closed for p_filesz > p_memsz, non-power-of-two alignment, p_offset/p_vaddr phase mismatch, duplicate PT_TLS, initialized TLS outside a readable file-backed PT_LOAD, nonzero DTPMOD addend, DTPOFF outside PT_TLS.p_memsz, R_X86_64_TPOFF64, and DF_STATIC_TLS. It excludes initial-exec/TPOFF admission beyond that rejection, TLSDESC, DTV growth, dlopen, dynamic thread allocation, pthread/TCB parity, loader/libc RuntimeV1 bridging, a general loader, dynamic CRT/sysroot, full x86-64 parity, and public x86 support."
source_owners = ["ldso/src/x86_64_initial_graph.rs", "compat/x86_64/ldso_initial_graph_start.S", "compat/x86_64/ldso_initial_tls_leaf.c", "compat/x86_64/ldso_initial_tls_mid.c", "compat/x86_64/ldso_initial_tls_main.c", "compat/x86_64/run_ldso_initial_tls.sh", "scripts/dev-x86_64.sh"]
x86_abi_prerequisites = ["Linux x86-64 PT_INTERP starts the private self-relocating interpreter with the original argc/argv/envp/auxv stack. This fixed graph requires a TLS-free main PIE and exactly main -> mid -> leaf dependency order; only mid and leaf may carry one PT_TLS record.", "Each TLS PT_TLS record has p_filesz <= p_memsz, power-of-two alignment, matching p_offset/p_vaddr phase, memory containment in one PT_LOAD, and initialized-prefix containment in one readable file-backed PT_LOAD. The fixture includes initialized, TBSS, and 4096-byte-aligned storage.", "x86 Variant-II places the two TLS images below TP. The private prefix exposes self at %fs:0, immutable DTV pointer at %fs:8, and a private module-size table; only TLS-bearing modules receive DTV IDs 1 and 2. The resolver validates its readable TlsIndex pointer, materialized module ID, and p_memsz-bounded offset before returning an address.", "Only ELF64 RELA R_X86_64_DTPMOD64=16, R_X86_64_DTPOFF64=17, and __tls_get_addr JUMP_SLOT resolution are selected. R_X86_64_TPOFF64, GOTTPOFF/TPOFF32, all TLSDESC forms, and DF_STATIC_TLS are rejected. The candidate resolver is an interpreter symbol; the pinned-musl reference links its own static resolver object only for the naked oracle main."]
x86_header_prerequisites = ["No installed x86 loader/TLS/dlfcn or pthread C ABI is selected. The fixture uses only private freestanding C/assembly and does not establish an x86 sysroot surface."]
native_evidence = [{ state = "verified", command = "./scripts/dev-x86_64.sh ldso-initial-tls", scope = "Native x86 private initial-TLS proof: verifies the pinned musl toolchain, builds a no-TLS interpreter plus one TLS-free main and two GNU-Dynamic TLS DSOs, enforces the exact local DT_NEEDED graph and no ambient environment, then runs pinned-musl static-__tls_get_addr reference and candidate routes. It proves DTPMOD/DTPOFF relocation, resolver ownership, Variant-II TP/DTV state, initialized/TBSS/high-alignment values, and rejects malformed PT_TLS records, bad DTPMOD/DTPOFF values, TPOFF, and DF_STATIC_TLS. It neither selects full loader/pthread/DTV behavior nor any installed runtime, CRT/sysroot, or public x86 support." }]
oracle = [{ kind = "c-posix", source = "Pinned musl 1.2.6 loader and libc.a", role = "Fixed-graph GNU-Dynamic TLS values, initialization, alignment, and static __tls_get_addr reference resolver oracle." }, { kind = "elf-abi", source = "System V AMD64 psABI", role = "ELF64 PT_TLS, GNU TLS index, and x86-64 DTPMOD/DTPOFF relocation contract." }, { kind = "kernel-abi", source = "Linux 5.10 x86-64 ABI", role = "arch_prctl(ARCH_SET_FS), mmap/mprotect, and initial PT_INTERP execution contract." }]

