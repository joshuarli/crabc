  { state = "required", command = "./scripts/dev-x86_64.sh candidate-header-closure", scope = "This live 1,337-record raw-GCC candidate/pinned-musl reference seven-profile empty-TU include diagnostic requires project/builtin/Linux-5.10-only candidate traces and a complete pass. It records exactly aio.h:c11-strict and aio.h:cxx17-strict as pinned-musl reference-not-applicable after candidate compilation succeeds. It does not select feature visibility, declaration/layout parity, callable linkage, runtime, installed-header completion, or public support." },
