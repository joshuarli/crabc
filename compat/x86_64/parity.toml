  { state = "required", command = "./scripts/dev-x86_64.sh dirent-header-abi", scope = "This isolated raw-GCC project-header-first/pinned-musl-reference 11-row `dirent.h` C/C++ compile matrix checks selected x86 LP64 `struct dirent` and `struct posix_dent` layouts, base declarations and values, seven base plus four GNU/strict `_LARGEFILE64_SOURCE` profiles, GNU-or-BSD IFTODT/DTTOIF/getdents visibility, GNU-only versionsort visibility, seekdir/telldir visibility, and all nine large-file aliases. Its C++ objects are inspected by nm only for header-requested unmangled C spellings. It checks header declarations only, not actual callable artifact linkage, directory-stream/getdents runtime behavior, archive linkage, all-header closure, runtime completion, family completion, or public support." },
