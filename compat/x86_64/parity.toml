x86_abi_prerequisites = ["x86 syscall numbers and error conventions", "stat, sigset, timespec, mmap, and process record layouts", "x86 signal frame behavior", "Selected credential setters use x86 setuid=105, setgid=106, setgroups=116, setresuid=117, and setresgid=119 with unsigned 32-bit uid_t/gid_t words and LP64 size_t", "Selected static credential observation uses getgroups=115 plus getresuid=118 and getresgid=120. getgroups takes signed int plus a writable unsigned 32-bit gid_t array and retains the Linux count-to-fill EINVAL race; getres* each write three unsigned 32-bit identity words and expose direct EFAULT through the selected initial-TLS errno boundary", "Selected static process context uses scalar getpid=39, getppid=110, getuid=102, getgid=104, geteuid=107, getegid=108, umask=95, setpgid=109, setsid=112, getpgid=121, and getsid=124; signed pid_t is four bytes and mode_t/uid_t/gid_t are unsigned four-byte words", "Selected static child reaping uses wait4=61 as wait(-1,status,0,NULL) and waitpid(pid,status,options,NULL), plus waitid=247 as (idtype,id,siginfo,options,NULL) through rdi/rsi/rdx/r10/r8. wait status is an optional writable int; waitid writes the 128-byte align-8 siginfo_t child report, WNOHANG returns zero without a status write, and WNOWAIT leaves a later exact reap. Direct raw errors alone publish initial-TLS errno; musl cancellation-point behavior remains unselected", "Selected static C11 immediate termination uses exit_group=231 with a signed four-byte status in rdi, then musl's defensive exit=60 loop only if the whole-process syscall returns; it has no errno, atexit, quick-exit, callback, stdio, fork, or pthread-state contract", "Selected static callback algorithms use LP64 pointer and size_t words: bsearch(key, base, nel, width, cmp) arrives in rdi/rsi/rdx/rcx/r8; qsort(base, nel, width, cmp) in rdi/rsi/rdx/rcx; and __qsort_r/qsort_r(base, nel, width, cmp, arg) in rdi/rsi/rdx/rcx/r8. qsort comparators receive a/b in rdi/rsi, qsort_r comparators receive a/b/arg in rdi/rsi/rdx, signed four-byte int returns in eax, and qsort_r is a same-address weak ELF alias of global __qsort_r. The stateless allocation-free leaf has no syscall, errno, initial-TLS, allocator, callback registry, C longjmp, C++ exception transport, or mutable runtime state", "Selected static descriptor entry uses open=2 and openat=257 with C pathname/flags/mode words in rdi/rsi/rdx and rdi/rsi/rdx/rcx routed to Linux rdi/rsi/rdx/r10. Its variadic mode is zero unless O_CREAT or the complete O_TMPFILE mask needs it, O_LARGEFILE is forced, and successful open(O_CLOEXEC) retains musl's private ignored-result fcntl(F_SETFD,FD_CLOEXEC) path; it does not expand the separately selected bounded fcntl status-control surface or select cancellation", "Selected static filesystem access uses access=21 with pathname/mode in rdi/rsi and real-ID permission semantics. faccessat=269 carries dirfd/pathname/mode in rdi/rsi/rdx only when flags are zero; nonzero flags use Linux-5.10 faccessat2=439 through rdi/rsi/rdx/r10, without musl's pre-5.10 ENOSYS credential-emulation fallback. euidaccess is faccessat(AT_FDCWD,path,mode,AT_EACCESS), and eaccess is a same-address weak ELF alias of euidaccess; raw failures alone publish initial-TLS errno", "Selected static C fcntl status control uses fcntl=72 with C fd/command/first vararg in rdi/rsi/rdx. The public assembly dispatcher supplies rdx=0 only for legal two-word F_GETFD=1/F_GETFL=3 calls, routes F_SETFD=2/F_SETFL=4 scalar calls through an int-word helper, ORs O_LARGEFILE=0x8000 into F_SETFL, and routes separately selected F_GETLK=5/F_SETLK=6 pointer forms to their bounded nonblocking record-lock helper; every remaining command returns -1/EINVAL without observing an absent vararg or issuing a syscall", "Selected static C flock uses flock=73 through rdi/rsi with public LOCK_SH/LOCK_EX/LOCK_NB/LOCK_UN=1/2/4/8 operation bits; its direct wrapper preserves raw duplicate open-file-description release state, separately opened nonblocking contention/reacquisition, and raw errno translation without selecting fcntl record-lock interaction, lockf, cancellation, pathname policy, or network-filesystem semantics", "Selected static generic ioctl uses ioctl=16 with signed int fd/request words in rdi/rsi and an explicit third pointer-or-integer word in rdx. Its public assembly dispatch supplies rdx=0 only for the two legal no-vararg forms FIOCLEX=0x5451/FIONCLEX=0x5450, while every other admitted call must supply an explicit third word for the three-word path; other two-word forms remain outside this artifact; raw failures alone publish the selected initial-TLS errno", "Selected static descriptor I/O uses read=0, write=1, close=3, lseek=8, pread64=17, pwrite64=18, pipe=22, dup=32, dup2=33, fsync=74, fdatasync=75, ftruncate=77, dup3=292, pipe2=293, and pwritev2=328; signed LP64 off_t and pointer/count words use the x86 rdi/rsi/rdx/r10/r8/r9 syscall order", "Selected static process resources uses prlimit64=302 through rdi/rsi/rdx/r10 for getrlimit/setrlimit/prlimit, getrusage=98 with a 144-byte initialized prefix of a 272-byte public rusage, getpriority=140 with Linux's 1..40 success encoding, and setpriority=141; id_t is an unsigned four-byte word and successful C priority -1 leaves errno unchanged", "Selected static readiness/signal waits use poll=7, select=23, pause=34, rt_sigsuspend=130, pselect6=270, and ppoll=271. poll uses rdi/rsi/rdx; ppoll carries its timeout/mask/8-byte kernel mask size in rdx/r10/r8; select uses rdi/rsi/rdx/r10/r8; and pselect6 carries a private mask-pointer/size pair in r9. Public pollfd, fd_set, timeval/timespec, and sigset_t have the x86 layouts recorded by the poll/select header gates; Linux consumes only the public signal-set's first eight-byte word", "Selected static socket transport uses socket=41, connect=42, accept=43, sendto=44, recvfrom=45, shutdown=48, bind=49, listen=50, getsockname=51, getpeername=52, socketpair=53, and accept4=288. Its public x86 LP64 ABI carries socket addresses by pointer plus socklen_t pointer/unsigned 32-bit length, and size_t/ssize_t as 64-bit words; `send`/`recv` are the fixed sendto/recvfrom null-address forms. The leaf deliberately has no musl cancellation-point machinery", "Linux x86 ioctl=16 consumes named TCGETS/TCSETS/TCSETSW/TCSETSF/TCFLSH/TCXONC/TCSBRK/TIOCGWINSZ/TIOCSWINSZ requests; the public termios record's caller-resident tail must not be normalized", "Selected static UTS identity calls uname=63 with its complete 390-byte align-1 six-field public utsname record in rdi, and calls sethostname=170 and setdomainname=171 with name and size_t length in rdi/rsi. gethostname copies at most the 65-byte nodename field and forces a final NUL on exhaustion; getdomainname requires the complete NUL-terminated domain field and returns EINVAL without output when it does not fit. Setter success needs CAP_SYS_ADMIN in the calling UTS namespace; the evidence uses a fresh fixture-local namespace and does not select namespace control", "Selected static SysV semaphore calls use semget=64, semop=65, semctl=66, and semtimedop=220. semget/semop use rdi/rsi/rdx while semtimedop and the Linux semctl union word use rdi/rsi/rdx/r10. On pinned musl x86-64, `arch/x86_64/syscall_arch.h` sets `IPC_64=0` and `src/ipc/ipc.h` derives `IPC_TIME64=0`, so `IPC_CMD(cmd)=((cmd & ~IPC_TIME64) | IPC_64)=cmd` carries no `0x100` marker. SysV AMD64 receives the public variadic `semctl` union semun by value in rcx; the assembly boundary preserves that one INTEGER-class word only for all nine union-consuming commands: `SETVAL`, `GETALL`, `SETALL`, `IPC_SET`, `IPC_INFO`, `SEM_INFO`, `IPC_STAT`, `SEM_STAT`, and `SEM_STAT_ANY`. It supplies an explicit zero (`rcx=0`) for every other command, including no-vararg IPC_RMID, GETPID, GETVAL, GETNCNT, GETZCNT and unknown command values, never reading an absent C vararg register. The installed `_SEM_SEMUN_UNDEFINED` contract leaves the union application-defined; selected pointer and scalar words remain caller-owned. The static leaf forwards operation/timeout records directly and omits musl cancellation points and any SEM_UNDO lifecycle policy", "Selected static SysV message/shared-memory calls use ftok through the existing x86 stat-layout owner; msgget=68, msgsnd=69, msgrcv=70, msgctl=71, shmget=29, shmat=30, shmdt=67, and shmctl=31 with Linux rdi/rsi/rdx/r10/r8 placement. Pinned musl x86 has IPC_64=0 and IPC_TIME64=0, so msgctl/shmctl carry IPC_CMD(cmd)=cmd without a 0x100 marker; shmget rewrites sizes above PTRDIFF_MAX to SIZE_MAX and shmat returns MAP_FAILED (void *)-1 on Linux errors. The direct static leaf deliberately omits msgsnd/msgrcv cancellation integration", "Selected static pathname lifecycle uses chdir=80, getcwd=79, rename=82, mkdir=83, rmdir=84, link=86, unlink=87, symlink=88, readlink=89, chmod=90, fchmod=91, truncate=76, and fcntl=72 through x86 rdi/rsi/rdx. Its caller-buffer getcwd retains musl's absolute-result validation but rejects the allocator-requiring null-buffer extension with EINVAL; readlink retains musl's dummy-byte zero-capacity behavior; remove retries rmdir only after raw EISDIR; and fchmod retries a live O_PATH descriptor through musl's stack-only /proc/self/fd spelling. This bounded leaf does not select allocation, general filesystem policy, cancellation, or public x86 support"]
x86_header_prerequisites = ["Selected fcntl, poll, sys/select, sys/stat, signal, sys/wait, termios, sys/resource, time, unistd, sys/utsname, sys/mman, grp, sys/types, and process header contracts. The focused C/C++ unistd gate makes getgroups unconditional while getresuid/getresgid remain GNU-only, hidden under strict/POSIX/BSD selection, and unmangled for C++ callers. The focused child-reaping gate proves strict wait/waitpid plus POSIX waitid/siginfo_t declarations and C++ linkage; its project-header-only wider waitid visibility remains deliberately recorded rather than treated as header closure. The focused immediate-termination gate proves unconditional C/C++ _Exit declaration and unmangled C++ linkage, but no ordinary-exit lifecycle or hook state. The focused callback-algorithms gate proves unconditional C/C++ bsearch and qsort declarations, GNU/BSD-only qsort_r with its final-context comparator ABI, strict/POSIX/XOPEN hiding, private __qsort_r rejection, and unmangled C++ linkage; no callback ownership, C longjmp, C++ exception, or general stdlib lifecycle is selected. The paired descriptor-entry and fcntl status-control artifacts use the existing C/C++ fcntl gate only for the selected variadic declarations and named descriptor/status constants; they do not close the fcntl header or C ABI.", "The focused SysV semaphore C/C++ matrix compares pinned-musl and raw-GCC project-first `sys/ipc.h`/`sys/sem.h` declarations, LP64 layouts, command values, `semctl` variadic C linkage, and GNU-only `semtimedop` visibility across eight profiles. It recognizes `_SEM_SEMUN_UNDEFINED` as the installed-header contract: applications define their `union semun`, while the selected archive preserves its machine-word ABI without exposing a project union declaration.", "The focused eight-profile SysV message/shared-memory C/C++ matrix compares pinned musl and raw-GCC project-first sys/ipc.h, sys/msg.h, and sys/shm.h declarations, LP64 record layouts, strict/GNU/BSD field visibility, GNU-only msgbuf and shm_info aliases, and unmangled C++ linkage. It remains a bounded selected artifact rather than general SysV IPC or installed-header completion", "The focused eight-profile eventfd/inotify C/C++ matrix compares pinned musl and raw-GCC project-first sys/eventfd.h and sys/inotify.h declarations, eventfd_t and inotify_event layouts, selected flags, and unmangled C++ linkage. Together with the retained packed sys/epoll.h matrix it is artifact-local evidence only, not general descriptor-header or installed-header completion", "The focused eight-profile pathname-lifecycle C/C++ matrix compares pinned musl and raw-GCC project-first fcntl.h, stdio.h, sys/stat.h, sys/types.h, and unistd.h declarations, LP64 size/off/mode types, selected mode and O_PATH constants, and unmangled C++ linkage. It is artifact-local evidence for the caller-buffer static path leaf, not general filesystem or installed-header completion", "The focused project-first/pinned-musl C/C++ filesystem-capacity matrix at `compat/x86_64/run_filesystem_capacity_header_abi.sh` compares seven base profiles plus two `_LARGEFILE64_SOURCE` profiles for `sys/statfs.h` and `sys/statvfs.h`: the four base declarations, x86 LP64 `fsid_t`/`statfs`/`statvfs` records and mount flags, unmangled C++ references, and LF64-only macro aliases. It is a bounded declaration/layout/linkage facet, not installed-header closure, callable archive linkage, runtime completion, family completion, or public support."]
