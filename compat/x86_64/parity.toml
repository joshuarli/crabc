x86_abi_prerequisites = ["x86 syscall register proof", "x86 pollfd layout plus poll/ppoll syscall numbers and eight-byte kernel signal-set ABI", "x86 direct io readiness: packed 12-byte align-1 epoll_event with events/data offsets 0/4, epoll_create1=291, epoll_ctl=233, epoll_pwait=281, close-on-exec and legacy positive-size creation, Linux create/event flags including future-bit forwarding for kernel validation, add/modify/delete, initialized-prefix readiness output, null and borrowed eight-byte signal masks with temporary installation/restoration observed through raw and pinned-musl waits, and representative EINVAL/EBADF/ENOENT; select/pselect use a 1024-bit/128-byte eight-byte-word fd_set, pselect6=270 through rdi/rsi/rdx/r10/r8/r9 with the private mask-pointer/size argument-six pair, checked input lengths, copied timeouts, and raw/pinned-musl temporary-mask restoration; C facades and errno TLS remain excluded", "x86 getpid/getppid/get*id/getpgid/getsid/pidfd_open syscall numbers and typed identity records", "x86 umask=95, unsigned 32-bit mode_t, exact prior-mask return, and child-contained process-global exchange", "x86 calling-process getrlimit: prlimit64=302, PID zero, null new-limit in rdx, initialized 16-byte align-8 rlimit64 output in r10, RLIM_INFINITY=UINT64_MAX, and closed selectors 0 through 15", "x86 direct targeted getrlimit: prlimit64=302, typed optional PID selection, null new-limit in rdx, initialized 16-byte align-8 rlimit64 output in r10, RLIM_INFINITY=UINT64_MAX, and closed selectors 0 through 15; a forked live child retains a distinct RLIMIT_NOFILE soft limit while pinned-musl prlimit and raw prlimit64 agree with the reported child record, and missing PID is ESRCH; target mutation, C facades, and errno TLS remain excluded", "x86 calling-process setrlimit: prlimit64=302, 16-byte align-8 rlimit64, PID zero, new-limit rdx/old-limit-null r10 placement, RLIM_INFINITY=UINT64_MAX, closed selectors 0 through 15, pre-syscall current <= maximum validation