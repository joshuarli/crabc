description = "The remaining AArch64 crabc-rs filesystem, wider polling, resolver, process, thread, time, wider mapping-policy, and runtime-owning families. The closed native aggregate executes the twenty-four separately evidenced x86 interface/device, private resolver-transport, alloc-backed resolver, owned netdb, selected filesystem.path-core, direct filesystem.xattr, allocation-free filesystem.directory, named/anonymous temporary-file plus temporary-directory, direct filesystem.extended-metadata, physical canonicalization plus process-global CWD-mutation, child-contained process-root change, direct POSIX named-message-queue, direct POSIX named-shared-memory, bounded inotify, civil wall-clock/calendar/timezone/local-calendar, advanced clock/owned-POSIX-timer, prepared child-ownership, exact same-process thread-directed signal-delivery, direct anonymous/file mapping, bounded process-break/whole-process locking/legacy-remap VM control, safe owned PTY-pair/name lifecycle, immutable conventional account snapshots, and checked mount/unmount direct-error vertical slices. Their exact union owns all forty-four closed family capabilities. This remains a private Rust-facade foundation only: wider IPC and system facilities, C ABI/runtime ownership, and public x86 support remain separately planned."
