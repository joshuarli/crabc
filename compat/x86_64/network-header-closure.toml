# Linux/x86-64 network/resolver public-header closure work package.
schema = "crabc.x86_64-network-header-closure/v1"
target = "x86_64-unknown-linux-musl"
platform = "Linux/x86-64 little-endian"
oracle = "Pinned musl 1.2.6 release commit 9fa28ece75d8a2191de7c5bb53bed224c5947417"

[work_package]
target_family = "libc.headers-layouts"
target_obligations = ["network-resolver-header-closure", "selected-header-declaration-forms"]
blocker = "The x86 public network/resolver headers reverse musl's arpa/netinet include ownership, retain non-musl socket and integer declaration forms, and leave 98 direct network/resolver profile rows mismatched. The shared stdint/socket/IPv4-IPv6 closure also propagates a real int_fast16_t/int_fast32_t width error."
prerequisites = ["oracle.musl-toolchain", "libc.errno-tls", "libc.headers-layouts callable declaration inventory"]
dependent_work = ["libc.headers-layouts family aggregate", "libc.resolver public C ABI integration", "libc.posix-runtime socket consumers", "owned static and dynamic sysroot header closure"]
baseline_contract = "Pinned musl 1.2.6 x86-64 public header source, Linux 5.10 UAPI inputs, System V AMD64 LP64 ABI, and the frozen AArch64 header baseline."
source_owners = [
  "compat/x86_64/network-header-closure.toml",
  "compat/x86_64/tests/test_header_abi_matrix.py",
  "compat/x86_64/header_abi_matrix.py",
  "compat/x86_64/header_declaration_macro_visibility_matrix.py",
  "compat/x86_64/header_callable_visibility_matrix.py",
  "include/bits/stdint.h",
  "include/stdint.h",
  "include/inttypes.h",
  "include/sys/socket.h",
  "include/arpa/inet.h",
  "include/arpa/nameser.h",
  "include/arpa/nameser_compat.h",
  "include/netdb.h",
  "include/resolv.h",
  "include/netinet/in.h",
  "include/netinet/ip.h",
  "include/netinet/ip6.h",
  "include/netinet/ip_icmp.h",
  "include/netinet/igmp.h",
  "include/netinet/icmp6.h",
]
focused_evidence_command = "./scripts/dev-x86_64.sh header-abi-matrix"
family_aggregate_command = "./scripts/dev-x86_64.sh campaign-family libc.headers-layouts"
product_command = "./scripts/dev-x86_64.sh campaign-static"
negative_scope = "This x86-only package restores selected public header declarations, layouts, macros, include ownership, and C/C++ linkage. It does not select archive providers, resolver configuration or DNS I/O, socket runtime behavior, libc.so, CRT, loader, sysroot completion, family promotion, or public x86 support."
expected_transition = "The 98 listed direct header/profile records retain no network/resolver-owned declaration-form difference. The generated matrix reports 71 currently exact rows; the remaining 27 rows are limited to declared external stddef.h or string.h/strings.h source-form debt, with no network-owned fact hidden by that attribution. libc.headers-layouts remains planned until its complete declaration/layout/provider aggregate is satisfied; no capability, product, promotion, or public-support state changes here."
evidence = [
  "pinned-musl/project direct C11/C++17 all-profile declaration-form matrix",
  "int_fast16_t/int_fast32_t LP64 width and limits regression",
  "arpa/netdb/resolv transitive netinet closure regression",
  "socket/inet restrict signature and network record/macro regression",
  "98-row direct network/resolver difference-origin regression",
  "header declaration/macro and callable-visibility matrix regeneration",
]
