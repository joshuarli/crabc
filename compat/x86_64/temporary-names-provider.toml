# Linux/x86-64 private C filesystem-extensions capability work package.
#
# This composes three already bounded C ABI leaves into the one frozen
# filesystem.extensions roster. It does not turn historical pathname selection
# into a Rust temporary-object API or a general filesystem policy.
schema = "crabc.x86_64-temporary-names-provider/v1"
target = "x86_64-unknown-linux-musl"
platform = "Linux/x86-64 little-endian"
oracle = "Pinned musl 1.2.6 release commit 9fa28ece75d8a2191de7c5bb53bed224c5947417"

[work_package]
target_family = "libc.posix-runtime"
target_obligations = ["header-callable-disposition", "x86-temporary-names"]
target_verified_slice = "static-c-filesystem-extensions-selection"
blocker = "Resolved by this private aggregate: the frozen five-spelling filesystem.extensions roster had separately evidenced mktemp and GNU file-handle leaves but no provider contract or aggregate for tmpnam/tempnam and the complete selected capability."
musl_source_mapping = [
  "src/temp/mktemp.c::mktemp",
  "src/temp/__randname.c::__randname",
  "src/stdio/tmpnam.c::tmpnam",
  "src/stdio/tempnam.c::tempnam",
  "src/linux/name_to_handle_at.c::name_to_handle_at",
  "src/linux/open_by_handle_at.c::open_by_handle_at",
]
baseline_contract = "The aggregate owns exactly mktemp, name_to_handle_at, open_by_handle_at, tempnam, and tmpnam. The default archive retains only the already selected mktemp leaf. The opt-in x86-file-handles feature supplies the two caller-owned Linux 5.10 handle syscalls, while x86-temporary-names composes over x86-allocator-string-duplication and supplies the racy tmpnam/tempnam pathname generators. tmpnam preserves musl's caller-buffer or process-global 20-byte result storage; tempnam returns a strdup-owned result. All three historical pathname generators only observe current absence and never create, reserve, open, unlink, or confer authority for a pathname."
prerequisites = [
  "oracle.musl-toolchain",
  "static-c-mktemp",
  "static-c-file-handles",
  "x86-allocator-string-duplication",
]
dependent_work = [
  "libc.posix-runtime complete filesystem/process runtime closure",
  "libc.headers-layouts callable-provider complement closure",
  "x86 static product qualification",
]
source_owners = [
  "compat/x86_64/temporary-names-provider.toml",
  "compat/upstreams.toml",
  "compat/crabc-rs/coverage.toml",
  "compat/abi/musl-1.2.6/aarch64/libc.a.static.tsv",
  "libc/Cargo.toml",
  "libc/src/c_abi/x86_64/static_c_abi.rs",
  "libc/src/c_abi/x86_64/mktemp.rs",
  "libc/src/c_abi/x86_64/temp_name_random.rs",
  "libc/src/c_abi/x86_64/temporary_names.rs",
  "libc/src/c_abi/x86_64/file_handles.rs",
  "include/stdio.h",
  "include/fcntl.h",
  "compat/x86_64/mktemp_header_abi_probe.c",
  "compat/x86_64/mktemp_header_abi_probe.cpp",
  "compat/x86_64/run_mktemp_header_abi.sh",
  "compat/x86_64/libc_mktemp_probe.c",
  "compat/x86_64/libc_mktemp_start.S",
  "compat/x86_64/run_libc_mktemp.sh",
  "compat/x86_64/file_handles_header_abi_probe.c",
  "compat/x86_64/file_handles_header_abi_probe.cpp",
  "compat/x86_64/run_file_handles_header_abi.sh",
  "compat/x86_64/libc_file_handles_probe.c",
  "compat/x86_64/libc_file_handles_start.S",
  "compat/x86_64/run_libc_file_handles.sh",
  "compat/x86_64/temporary_names_header_abi_probe.c",
  "compat/x86_64/temporary_names_header_abi_probe.cpp",
  "compat/x86_64/run_temporary_names_header_abi.sh",
  "compat/x86_64/libc_temporary_names_probe.c",
  "compat/x86_64/run_libc_temporary_names.sh",
  "compat/x86_64/run_libc_filesystem_extensions.sh",
  "compat/x86_64/tests/test_libc_temporary_names.py",
  "compat/x86_64/parity.toml",
  "compat/x86_64/validate_parity_ledger.py",
  "compat/x86_64/aarch64_parity_inventory.py",
  "compat/x86_64/aarch64_parity_inventory.json",
  "compat/x86_64/README.md",
  "STATUS.md",
  "x86-64.md",
  "scripts/dev-x86_64.sh",
]
focused_evidence_command = "./scripts/dev-x86_64.sh libc-temporary-names"
capability_aggregate_command = "./scripts/dev-x86_64.sh libc-filesystem-extensions"
family_aggregate_command = "./scripts/dev-x86_64.sh campaign-family libc.posix-runtime"
product_command = "./scripts/dev-x86_64.sh campaign-static"
negative_scope = "This package owns only the frozen mktemp, name_to_handle_at, open_by_handle_at, tempnam, and tmpnam C spellings. It excludes mkstemp/mkstemps/mkostemp/mkostemps, mkdtemp, tmpfile, a secure or authority-bearing temporary-object contract, generic temporary-directory, pathname, mount, filesystem-confinement, permission, entropy, cryptographic, allocator-lifecycle, cancellation, libc.so, CRT, loader, sysroot, family-completion, promotion, and public-x86-support claims. crabc-rs retains its separately selected NamedTempFile/TempFile/temporary-directory contracts and gains no wrapper for these legacy C pathname or file-handle APIs."
expected_transition = "The aggregate changes only frozen filesystem.extensions from missing to selected-private. It composes the exact five-symbol feature/default archive selection without widening the frozen default archive, leaves libc.posix-runtime planned and nonpublic, and makes no crabc-rs, product, promotion, or public-support transition."
evidence = [
  "pinned-musl/project stdio.h and fcntl.h C/C++ feature-visibility, declaration, and linkage matrices",
  "pinned-musl versus selected feature/default C temporary-name and Linux file-handle differentials",
  "exact default and x86-file-handles,x86-temporary-names archive feature-closure, owner, and ELF-link evidence",
  "five-symbol filesystem.extensions aggregate roster and parity-ledger validation",
]
