# Canonical source contract for the native x86 public-header callable inventory.
#
# The generator never parses a header with ad-hoc text matching.  It asks the
# declared compiler for JSON ASTs and preprocessor records while both pinned
# header roots are isolated with `-nostdinc`; this manifest only names the
# finite roots and feature profiles that those compiler invocations consume.
schema = "crabc.x86_64-header-callable-inventory/v2"
target = "x86_64-unknown-linux-musl"
platform = "Linux/x86-64 little-endian"
oracle = "Pinned musl 1.2.6"
public_headers = "compat/x86_64/public_headers.txt"
static_c_abi_exports = "compat/x86_64/static_c_abi_exports.txt"
parity_ledger = "compat/x86_64/parity.toml"
generated_inventory = "compat/x86_64/header_callable_inventory.json"
pinned_public_header_count = 183
candidate_public_header_count = 191

[inputs]
musl_version = "1.2.6"
musl_source_sha256 = "d585fd3b613c66151fc3249e8ed44f77020cb5e6c1e635a616d3f9f82460512a"
linux_uapi_version = "5.10"
linux_uapi_source_sha256 = "dcdf99e43e98330d925016985bfbc7b83c66d367b714b2de0cbbfcbf83d8ca43"
linux_uapi_header_manifest_sha256 = "00cdc98ceb35926f68dc57dc0d84a989a6df4f60f84b1ae5981b54bb1088eb0e"

[policy]
compiler_ast_json = true
compiler_preprocessor_records = true
header_text_parsing = false
candidate_headers_first = true
native_execution_only = true
archive_extraction_required_for_external = true
feature_archive_provider_accounting = true
family_promotion = false
public_support = false

# These are the already-established all-header closure profiles.  The sole
# pinned-musl non-applicability pair remains structural rather than becoming a
# skipped profile, so a future closure can distinguish a genuine absence from
# the deliberate compiler-oracle limitation.
[[profile]]
id = "c11-gnu"
language = "c"
standard = "c11"
defines = ["_GNU_SOURCE=1"]

[[profile]]
id = "cxx17-gnu"
language = "cxx"
standard = "c++17"
defines = ["_GNU_SOURCE=1"]

[[profile]]
id = "c11-strict"
language = "c"
standard = "c11"
defines = []

[[profile]]
id = "c11-posix-2008"
language = "c"
standard = "c11"
defines = ["_POSIX_C_SOURCE=200809L"]

[[profile]]
id = "c11-xopen-700"
language = "c"
standard = "c11"
defines = ["_XOPEN_SOURCE=700"]

[[profile]]
id = "c11-bsd"
language = "c"
standard = "c11"
defines = ["_BSD_SOURCE=1"]

[[profile]]
id = "cxx17-strict"
language = "cxx"
standard = "c++17"
defines = []

[[oracle_not_applicable]]
header = "aio.h"
profile = "c11-strict"
reason = "Pinned musl leaves struct sigevent incomplete without a POSIX or GNU feature request."

[[oracle_not_applicable]]
header = "aio.h"
profile = "cxx17-strict"
reason = "Pinned musl leaves struct sigevent incomplete without a POSIX or GNU feature request."
