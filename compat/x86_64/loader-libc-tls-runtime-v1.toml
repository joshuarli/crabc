# Current private x86-64 loader/libc TLS ownership contract. The owned_runtime
# table names the implemented product path; qualification requires a live
# three-product receipt. Earlier cfg-isolated foundation tables remain private
# regression evidence and cannot stand in for growth, workers, CRT or lifecycle.

schema = "crabc.x86_64-loader-libc-tls-runtime/v1"
id = "x86-loader-libc-tls-runtime-v1"
status = "implemented-unqualified"
non_promoting = true
oracle = "musl-1.2.6 ldso/dynlink.c initial TLS and DTV lifecycle; Linux 5.10 x86-64 ARCH_SET_FS and CLONE_SETTLS"

[target]
system = "Linux"
machine = "x86_64"
endianness = "little"
abi = "LP64"
kernel_msrv = "5.10"

# Startup selects a mode from PT_INTERP, never from ELF type. A static PIE can
# be ET_DYN without an interpreter, so ET_DYN is not a dynamic-runtime signal.
[process_modes.static]
selector = "no-pt-interp"
tcb_owner = "crabc-libc/static-initial-tls-v1"
dtv_owner = "none"
runtime_tls_modules = "forbidden"
thread_creation = "libc-static-owner"

[process_modes.dynamic]
selector = "pt-interp-installed-crabc-ldso"
tcb_owner = "crabc-ldso/runtime-v1"
dtv_owner = "crabc-ldso/runtime-v1"
runtime_tls_modules = "loader-owned-all-thread-dtv-growth"
thread_creation = "libc-consumes-ldso-runtime-v1"

# RuntimeV1 is private Rust/ELF-adjacent state, not an installed C declaration.
# The dynamic loader creates it before libc direct-TLS access; libc validates it
# at the CRT handoff and is only a consumer of loader-owned TLS geometry/DTV.
[runtime_v1]
descriptor_owner = "crabc-ldso"
descriptor_visibility = "private-loader-libc-handoff"
descriptor_validation = "magic-version-abi-size-mode-owner-before-tls-access"
mode_exclusivity = "exactly-one-process-mode-owner-before-any-tls-access"
main_thread_inputs = "validated-main-and-initial-dso-pt-tls-descriptors-in-loader-link-map-order"
main_thread_outputs = "installed-fs-thread-pointer-initialized-tcb-dtv-generation-and-libc-attachment-slot"
new_thread_inputs = "current-loader-generation-and-libc-thread-initializer"
new_thread_outputs = "fresh-thread-pointer-ready-for-clone_settls-or-explicit-failure"
pthread_rule = "libc-never-allocates-or-resizes-dynamic-dtv-or-installs-dynamic-fs-base-directly"
tls_get_addr_rule = "dynamic-__tls_get_addr-resolves-only-through-current-loader-runtime-v1"
fork_child_order = "loader-repair-before-libc-thread-registry-repair"

# The first implemented seam is intentionally less than the RuntimeV1 product
# described above. It runs only in the existing fixed initial-TLS graph and
# exposes no installed C declaration. Its loader descriptor is populated once
# after ARCH_SET_FS and rejected by its freestanding libc consumer before the
# consumer reads the loader-installed TCB/DTV. The descriptor has no growth or
# worker operation, so this table must stay explicit rather than relabelling
# either the fixed fixture or the general runtime as complete.
[initial_tls_foundation]
state = "implemented-private-evidence-only"
producer = "ldso/src/x86_64_initial_graph.rs:crabc_initial_tls_graph+crabc_loader_libc_tls_runtime_v1"
consumer = "libc/src/c_abi/x86_64/loader_tls_runtime_v1_source_root.rs"
record = "__crabc_x86_64_loader_tls_runtime_v1"
selector = "fixed-graph-pt-interp-only"
validation = "ready-magic-version-abi-size-mode-owner-generation-before-tcb-dtv-read"
static_mode = "no-pt-interp-static-consumer-stub-rejects-without-loader-import-or-fs-access"
dynamic_tls_growth = "not-implemented-and-not-implied"
pthread_or_clone_settls = "not-implemented-and-not-implied"
general_dynamic_product = false
capability_or_family_promotion = false
native_evidence = "compat/x86_64/run_loader_libc_tls_runtime_v1.sh"

# The next foundation moves initial module-ID and generation ownership out of
# the fixed planner's ad-hoc counters without treating that ordinary fixture
# as a RuntimeV1 producer. The state is loader-private, represents only
# generation one, and rejects runtime TLS/DTV growth without touching IDs,
# DTV storage, or a thread pointer. The ordinary general-initial-TLS
# materialization seam and its separate RuntimeV1 wire consume this same
# sealed registry, but neither has a worker operation or growth protocol.
[initial_tls_registry_foundation]
state = "implemented-private-evidence-only"
owner = "ldso/src/x86_64_initial_tls_registry.rs"
integration = "crabc_initial_tls_graph+crabc_loader_libc_tls_runtime_v1-fixed-planner-install-publish-only"
initial_module_ids = "typed-one-based-loader-order-object-index-to-module-id"
generation = "typed-initial-generation-one-planning-to-sealed-only"
runtime_tls_dtv_growth = "explicit-dtv-growth-protocol-unavailable-rejection-without-registry-or-dtv-mutation"
general_initial_graph = "integrated-ordinary-general-initial-tls-materialization-and-separate-general-runtimev1-private-publication-only-no-runtime-growth"
general_dynamic_product = false
capability_or_family_promotion = false
native_evidence = "compat/x86_64/run_loader_libc_tls_runtime_v1_registry.sh"

# This is a distinct source root over the arbitrary bounded initial graph. It
# is a real one-shot RuntimeV1 producer, but only inside private native
# evidence: it publishes neither a dynamic product nor a CRT carrier and has
# no worker, runtime-map, DTV-growth, or unload operation.
[general_initial_tls_runtime_v1_foundation]
state = "implemented-private-evidence-only"
producer = "ldso/src/x86_64_general_initial_tls_runtime_v1_source_root.rs:crabc_general_initial_graph+crabc_general_initial_tls_materialization_v1+crabc_general_loader_libc_tls_runtime_v1"
consumer = "libc/src/c_abi/x86_64/loader_tls_runtime_v1_source_root.rs"
record = "__crabc_x86_64_loader_tls_runtime_v1"
selector = "bounded-general-initial-pt-interp-only"
publication = "paired-general-initial-state-and-descriptor-reservations-before-arch-set-fs-then-ready-last"
validation = "ready-magic-version-abi-size-mode-owner-generation-before-arch-get-fs-or-tcb-dtv-read"
record_visibility = "private-local-hidden-static-symbol-no-dynsym-outside-page-rounded-relro"
import_rule = "only-main-image-undefined-weak-got-record-import-strong-main-and-weak-dso-reject-before-arch-set-fs"
dynamic_tls_growth = "not-implemented-and-not-implied"
pthread_or_clone_settls = "not-implemented-and-not-implied"
dynamic_crt_handoff = "not-implemented-and-not-implied"
general_dynamic_product = false
capability_or_family_promotion = false
native_evidence = "compat/x86_64/run_loader_libc_general_tls_runtime_v1.sh+compat/x86_64/run_loader_libc_general_tls_runtime_v1_target_root.sh"

# This bridge is deliberately narrower than the owned-CRT carrier.
# A special private Scrt1.o makes the same main-resident RuntimeV1 observation
# immediately before __libc_start_main, while the loader admits only Scrt1's
# exact null weak-owned-handoff relocation. Scrt1, not the loader, retains its
# main lifecycle callbacks; the private dynamic libc owns only the minimal
# six-argument call, dynamic errno/TLS observation, and final raw exit.
[dynamic_main_thread_runtime_v1_bridge]
state = "implemented-private-evidence-only"
producer = "ldso/src/x86_64_dynamic_main_thread_runtime_v1_source_root.rs:crabc_general_initial_graph+crabc_general_initial_tls_materialization_v1+crabc_general_loader_libc_tls_runtime_v1+crabc_dynamic_main_thread_runtime_v1"
scrt1 = "crt/build_x86_64.py:--dynamic-main-thread-runtime-v1->crt/src/x86_64_dynamic_startup.rs:__crabc_x86_loader_tls_runtime_v1_attach-before-__libc_start_main"
consumer = "libc/src/c_abi/x86_64/dynamic_main_thread_runtime_v1_source_root.rs"
record = "__crabc_x86_64_loader_tls_runtime_v1"
selector = "bounded-general-initial-pt-interp-only-real-scrt1"
attachment = "main-resident-runtimev1-consumer-before-private-dynamic-libc-startup"
owned_crt_import_rule = "only-real-scrt1-main-undefined-default-visible-weak-object-glob-dat-zero-addend-is-forced-null-before-lookup-strong-main-and-weak-dso-reject-before-arch-set-fs-dso-definition-cannot-interpose"
main_lifecycle = "loader-validates-real-scrt1-main-tags-without-dispatch-scrt1-dispatches-preinit-init-and-fini-callbacks"
descriptor_failure = "magic-version-abi-size-mode-owner-generation-and-poisoned-dtv-reject-before-preinit-init-main-or-private-dynamic-libc"
dynamic_tls_errno = "main-and-private-dynamic-libc-pt-tls-and-dynamic-errno-observe-one-loader-installed-generation"
dynamic_tls_growth = "not-implemented-and-not-implied"
pthread_or_clone_settls = "not-implemented-and-not-implied"
loader_finalizer_or_dependency_lifecycle = "not-implemented-and-not-implied"
general_dynamic_product = false
capability_or_family_promotion = false
native_evidence = "compat/x86_64/run_dynamic_main_thread_runtime_v1.sh+compat/x86_64/run_dynamic_main_thread_runtime_v1_target_root.sh"

# Linux/x86-64 Variant II: TLS images occupy addresses below TP and the TCB
# starts at TP. The DTV pointer at %fs:8 is a private RuntimeV1 invariant;
# consumers may not infer further TCB offsets.
[variant_ii]
thread_pointer_register = "%fs"
tcb_self_word = "%fs:0"
dtv_pointer_word = "%fs:8"
tls_direction = "below-thread-pointer"
template_validation = "pt-tls-filesz-lte-memsz-power-of-two-align-and-vaddr-offset-phase"
materialization = "copy-filesz-zero-tbss-preserve-max-alignment-and-source-phase"
static_tls_access = "local-exec-only-under-static-initial-tls-v1"

# The fixed initial-TLS graph has a bounded DTV only as fixture evidence. It
# cannot become a general dynamic implementation by raising a constant.
[dtv]
module_ids = "nonzero-stable-loader-owned-while-module-is-addressable"
generation = "monotonic-loader-owned-registry-generation"
initial_population = "all-initial-pt-tls-modules-before-dynamic-tls-relocations-or-libc-handoff"
runtime_tls_load = "prepare-all-live-thread-views-before-atomic-registry-and-view-publication"
growth_completion = "registry-growth-current-thread-refresh-new-thread-current-generation-and-safe-old-dtv-reclamation"
old_dtv_reclamation = "retain-until-no-thread-or-loader-reader-can-observe-old-dtv"
tls_module_unload = "retain-successful-load-mappings-and-module-ids-through-exit; rollback-failed-transactions-before-publication"

