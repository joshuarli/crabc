# The three classes form an exact partition of the pinned public inventory
# plus project-only public headers. The first class is resolved against the
# checked-in pinned inventory, rather than duplicating 180 paths here.
[[header_class]]
id = "pinned-non-uapi"
origin = "pinned-inventory-excluding"
excluded_paths = ["sys/kd.h", "sys/soundcard.h", "sys/vt.h"]
expected_count = 180
language_profiles = ["c11-gnu", "cxx17-gnu"]
future_feature_profiles = ["c11-strict", "c11-posix-2008", "c11-xopen-700", "c11-bsd", "cxx17-strict"]
abi_facets = ["public-path-inventory", "candidate-tree-presence", "c11-gnu-consumability", "candidate-transitive-closure", "cxx17-consumability", "feature-visibility", "callable-prototype-layout", "callable-linkage-ownership", "legacy-direct-layout-inputs", "static-c-cxx-composition"]
linkage_owners = ["current-static-c-exports", "unlisted-public-callables", "noncallable-header-abi"]

[[header_class]]
id = "pinned-uapi-inputs"
origin = "explicit-pinned"
paths = ["sys/kd.h", "sys/soundcard.h", "sys/vt.h"]
expected_count = 3
language_profiles = ["c11-gnu", "cxx17-gnu"]
future_feature_profiles = ["c11-strict", "c11-posix-2008", "c11-xopen-700", "c11-bsd", "cxx17-strict"]
abi_facets = ["public-path-inventory", "candidate-tree-presence", "uapi-input-provenance", "candidate-transitive-closure", "cxx17-consumability", "feature-visibility", "callable-prototype-layout", "callable-linkage-ownership"]
linkage_owners = ["current-static-c-exports", "unlisted-public-callables", "noncallable-header-abi"]

[[header_class]]
id = "project-only-extensions"
origin = "explicit-project-only"
paths = ["daemon.h", "dn_expand.h", "linux/capability.h", "lrand48.h", "pthread_atfork.h", "stdatomic.h", "strverscmp.h", "sys/module.h"]
expected_count = 8
language_profiles = ["c11-gnu", "cxx17-gnu"]
future_feature_profiles = ["c11-strict", "c11-posix-2008", "c11-xopen-700", "c11-bsd", "cxx17-strict"]
abi_facets = ["project-only-extension-policy", "candidate-tree-presence", "candidate-transitive-closure", "cxx17-consumability", "feature-visibility", "callable-prototype-layout", "callable-linkage-ownership"]
linkage_owners = ["current-static-c-exports", "unlisted-public-callables", "noncallable-header-abi"]

# These paths are currently blocked in both candidate and pinned-musl C11
# inventory passes because the native evidence image deliberately has no
# Linux-UAPI provider. The later closure gate must use a pinned Linux 5.10 UAPI
# tree; an ambient host include directory is not an acceptable substitute.
[[uapi_path]]
header = "sys/kd.h"
dependency = "linux/kd.h"
state = "blocked-missing-pinned-linux-uapi"

[[uapi_path]]
header = "sys/soundcard.h"
dependency = "linux/soundcard.h"
state = "blocked-missing-pinned-linux-uapi"

[[uapi_path]]
header = "sys/vt.h"
dependency = "linux/vt.h"
state = "blocked-missing-pinned-linux-uapi"

# ABI facets are deliberate proof obligations. A `partial-verified` facet
# retains its documented narrow evidence and cannot promote this family. The
# planned facets close the gap between current direct probes and a real header
# foundation: isolated candidate transitive headers, all language modes,
# ABI-bearing declarations/layouts, and linkage ownership.
[[abi_facet]]
id = "public-path-inventory"
state = "partial-verified"
scope = "all-pinned-public-headers"
owner = "libc.headers-layouts"
evidence = ["public-header-c-consumability"]
description = "The pinned pathname inventory is complete, but a pathname is not a declaration or ABI claim."

[[abi_facet]]
id = "candidate-tree-presence"
state = "partial-verified"
scope = "all-pinned-and-project-only-public-headers"
owner = "libc.headers-layouts"
evidence = ["public-header-c-consumability"]
description = "Every pinned pathname currently has a project counterpart; project-only paths remain explicit extensions."

[[abi_facet]]
id = "c11-gnu-consumability"
state = "partial-verified"
scope = "pinned-non-uapi"
owner = "libc.headers-layouts"
evidence = ["public-header-c-consumability"]
description = "The current empty C11 GNU consumer succeeds for the 180 non-UAPI pinned paths only."

[[abi_facet]]
id = "uapi-input-provenance"
state = "planned"
scope = "pinned-uapi-inputs"
owner = "libc.headers-layouts"
evidence = ["pinned-linux-5.10-uapi-tree"]
description = "The three Linux-UAPI wrapper paths require an owned hash-pinned Linux 5.10 UAPI input before closure."

[[abi_facet]]
id = "project-only-extension-policy"
state = "planned"
scope = "project-only-extensions"
owner = "libc.c-abi-compat"
evidence = ["project-only-header-classification"]
description = "Each project-only public header needs an explicit retained-profile or removal decision before final C ABI compatibility."

[[abi_facet]]
id = "candidate-transitive-closure"
state = "planned"
scope = "all-pinned-and-project-only-public-headers"
owner = "libc.headers-layouts"
evidence = ["isolated-candidate-header-tree"]
description = "Candidate-header-first probes may not borrow pinned musl private bits headers during the future closure pass."

[[abi_facet]]
id = "cxx17-consumability"
state = "planned"
scope = "all-pinned-and-project-only-public-headers"
owner = "libc.headers-layouts"
evidence = ["oracle-derived-cxx17-matrix"]
description = "C++17 applicability must be measured against pinned musl per header; C-only oracle outcomes must remain explicit."

[[abi_facet]]
id = "feature-visibility"
state = "planned"
scope = "all-pinned-and-project-only-public-headers"
owner = "libc.headers-layouts"
evidence = ["strict-posix-xopen-gnu-bsd-matrix"]
description = "Feature-test visibility requires an oracle-derived C and C++ matrix, not a single GNU include pass."

[[abi_facet]]
id = "callable-prototype-layout"
state = "planned"
scope = "all-pinned-and-project-only-public-headers"
owner = "libc.headers-layouts"
evidence = ["generated-x86-prototype-layout-matrix"]
description = "Every retained callable declaration, ABI-bearing record, constant, and feature selector needs an x86 pinned-musl comparison."

[[abi_facet]]
id = "callable-linkage-ownership"
state = "planned"
scope = "all-pinned-and-project-only-public-headers"
owner = "libc.c-abi-compat"
evidence = ["declared-callable-linkage-audit"]
description = "Header compilation never admits a callable as linkable; the final C ABI gate owns the complete declaration-to-artifact audit."

[[abi_facet]]
id = "legacy-direct-layout-inputs"
state = "partial-verified"
scope = "v1-direct-probe-union"
owner = "libc.headers-layouts"
evidence = ["headers-layouts.toml"]
legacy_probes = ["project", "math-complex", "sys-reg", "types", "stat", "ctype", "integer-arithmetic", "integer-parse", "intmax-arithmetic", "credential-observation", "child-reaping", "immediate-termination", "callback-algorithms", "ffs", "byte-strings", "memory-search", "string-copy", "random-entropy", "time", "poll", "select", "fcntl", "unistd", "system", "syscall", "signal", "termios", "mman", "resource", "socket"]
description = "The existing thirty direct gates remain required inputs and retain their bounded declaration/layout scopes."

[[abi_facet]]
id = "static-c-cxx-composition"
state = "partial-verified"
scope = "selected-existing-static-archive-leaves"
owner = "libc.headers-layouts"
evidence = ["static-c-header-layouts-baseline"]
description = "The existing static C/C++ aggregate proves only its named selected archive leaves and cannot stand in for header closure."

# Linkage ownership is intentionally a two-stage accounting rule. Named
# current archive exports are only partially evidenced; every other callable
# declaration is explicitly reserved for the later final C ABI audit. This
# prevents an include-only success from silently becoming a linkage promise.
[[linkage_owner]]
id = "current-static-c-exports"
state = "partial-verified"
scope = "all symbols listed by static_c_abi_exports"
family = "libc.c-abi-compat"
evidence = ["compat/x86_64/static_c_abi_exports.txt", "selected-static-artifacts"]
description = "The current crate-owned static export ratchet is an input to, not completion of, final callable linkage compatibility."

[[linkage_owner]]
id = "unlisted-public-callables"
state = "planned"
scope = "every public callable declaration not selected by the current static export ratchet"
family = "libc.c-abi-compat"
evidence = ["declared-callable-linkage-audit"]
description = "The final C ABI compatibility family owns every declared callable that current archive evidence does not name."

[[linkage_owner]]
id = "noncallable-header-abi"
state = "planned"
scope = "public typedefs constants macros records and inline-only header contracts"
family = "libc.headers-layouts"
evidence = ["generated-x86-prototype-layout-matrix"]
description = "Noncallable header ABI still needs independent type, layout, constant, and feature-visibility evidence."
