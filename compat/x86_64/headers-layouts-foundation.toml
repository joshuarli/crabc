# Forward-looking native x86-64 header/layout foundation contract.
#
# This is deliberately a planning and accounting manifest, not a promotion.
# `headers-layouts.toml` remains the v1 inventory of thirty direct probes. This
# v2 manifest accounts for every pinned public header and every project-only
# extension, records the missing Linux-UAPI inputs, and makes the remaining
# language, ABI, and linkage work explicit. It must not be read as a claim that
# a header's declarations link to, or execute through, a complete crabc libc.
schema = "crabc.x86_64-headers-layouts-foundation/v2"
family = "libc.headers-layouts"
target = "x86_64-unknown-linux-musl"
platform = "Linux/x86-64 little-endian"
kernel_msrv = "5.10"
status = "planned"
oracle = "Pinned musl 1.2.6"
legacy_direct_manifest = "compat/x86_64/headers-layouts.toml"
pinned_public_inventory = "compat/x86_64/public_headers.txt"
static_c_abi_exports = "compat/x86_64/static_c_abi_exports.txt"

[policy]
native_execution_only = true
project_headers_first = true
inventory_accounting = true
candidate_transitive_include_closure = false
full_c11_consumer_matrix = false
full_cxx17_consumer_matrix = false
feature_visibility_matrix = false
abi_facet_matrix = false
callable_linkage_audit = false
aggregate_family_completion = false
runtime_completion = false
public_support = false

[completion]
# These `*_accounted` facts mean that the missing work is named and owned by
# this manifest. They do not mean the corresponding native evidence exists.
inventory_accounted = true
project_only_paths_accounted = true
uapi_paths_accounted = true
language_profiles_accounted = true
feature_modes_accounted = true
abi_facets_accounted = true
callable_linkage_owners_accounted = true
legacy_direct_inputs_accounted = true
candidate_transitive_include_closure = false
c11_consumer_matrix = false
cxx17_consumer_matrix = false
feature_visibility_matrix = false
abi_facet_matrix = false
callable_linkage_audit = false
runtime_completion = false
family_promotion = false
public_support = false

[profile_matrix]
# A row is one resolved header pathname in one language/feature profile. The
# class-level obligations below expand to every such row without copying the
# 191 pathnames into this planning contract. `oracle-required` deliberately
# records an unknown applicability result: the eventual per-header matrix must
# classify it as applicable, not-applicable, or blocked by a named input.
row_key = "resolved-header-path plus language-profile"
final_applicability_states = ["applicable", "not-applicable", "blocked-missing-input"]
all_rows_resolved = false

[[uapi_input]]
id = "linux-5.10-uapi"
state = "required-unpinned"
source = "Linux 5.10 UAPI export tree"
role = "explicit input for pinned-musl public wrappers that include Linux UAPI paths"
paths = ["linux/kd.h", "linux/soundcard.h", "linux/vt.h"]
closure_rule = "future candidate and oracle probes must use the same hash-pinned tree; ambient host headers are forbidden"

[[language_profile]]
id = "c11-gnu"
language = "c"
standard = "c11"
macros = ["_GNU_SOURCE"]
state = "partial-verified"

[[language_profile]]
id = "cxx17-gnu"
language = "c++"
standard = "c++17"
macros = ["_GNU_SOURCE"]
state = "planned"

[[language_profile]]
id = "c11-strict"
language = "c"
standard = "c11"
macros = []
state = "planned"

[[language_profile]]
id = "c11-posix-2008"
language = "c"
standard = "c11"
macros = ["_POSIX_C_SOURCE=200809L"]
state = "planned"

[[language_profile]]
id = "c11-xopen-700"
language = "c"
standard = "c11"
macros = ["_XOPEN_SOURCE=700"]
state = "planned"

[[language_profile]]
id = "c11-bsd"
language = "c"
standard = "c11"
macros = ["_BSD_SOURCE"]
state = "planned"

[[language_profile]]
id = "cxx17-strict"
language = "c++"
standard = "c++17"
macros = []
state = "planned"

# Each obligation expands across every header in its class. The only current
