# This is the first fully resolved profile cross-product in the otherwise
# planned header matrix. The fixed wrappers are unconditional direct includes,
# so every row compiles a selected constant/layout/ioctl assertion set through
# both the pinned-musl reference and raw-GCC project-header-first candidate.
# It intentionally leaves all callable declarations (including soundcard's
# consumer-provided sequencer callback), device behavior, and general UAPI
# runtime/linkage work to their named later families.
[uapi_wrapper_matrix]
id = "linux-5.10-uapi-wrapper-profile-matrix"
state = "partial-verified"
command = "./scripts/dev-x86_64.sh uapi-wrapper-matrix"
required_result = "pass"
header_class = "pinned-uapi-inputs"
headers = ["sys/kd.h", "sys/soundcard.h", "sys/vt.h"]
profiles = ["c11-gnu", "cxx17-gnu", "c11-strict", "c11-posix-2008", "c11-xopen-700", "c11-bsd", "cxx17-strict"]
row_count = 21
scope = "Three fixed Linux 5.10 UAPI wrappers across seven isolated C11/C++17 profiles, compiled through pinned musl and raw-GCC project-header-first roots with selected constants, ioctl encodings, and x86 LP64 layouts. This excludes general declarations, callable linkage, device/ioctl behavior, all-header closure, runtime completion, family promotion, and public support."

