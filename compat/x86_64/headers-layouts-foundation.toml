# header consumer matrix after any header change. The two explicitly named
# pinned-musl non-applicable rows are source behavior, not a candidate waiver:
# the candidate arm must still compile them. The surrounding family remains
# planned because include closure is neither ABI comparison, callable linkage,
# runtime completion, nor public support.
[[closure_diagnostic]]
id = "isolated-candidate-header-closure"
state = "partial-verified"
command = "./scripts/dev-x86_64.sh candidate-header-closure"
required_result = "pass"
profiles = ["c11-gnu", "cxx17-gnu", "c11-strict", "c11-posix-2008", "c11-xopen-700", "c11-bsd", "cxx17-strict"]
pinned_public_header_count = 183
candidate_public_header_count = 191
candidate_only_header_count = 8
record_count = 1337
oracle_not_applicable_rows = ["aio.h:c11-strict", "aio.h:cxx17-strict"]
scope = "Raw-GCC project-header-first and pinned-musl reference empty-TU C11/C++17 seven-profile include closure with only raw-GCC builtin and pinned Linux 5.10 UAPI roots. Exactly aio.h:c11-strict and aio.h:cxx17-strict are pinned-musl oracle-not-applicable because its aio.h embeds incomplete struct sigevent without a POSIX/GNU feature request; the candidate still compiles them. This is not feature-visibility, declaration/layout/linkage/runtime/installed-header/public-support evidence."

