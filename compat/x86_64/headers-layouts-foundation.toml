[profile_matrix]
# A row is one resolved header pathname in one language/feature profile. The
# class-level obligations below expand to every such row without copying the
# 191 pathnames into this planning contract. `oracle-required` records an
# unmeasured applicability result; `mixed-applicability` records a class with
# exactly enumerated oracle-not-applicable rows and all remaining rows
# applicable. The final per-header matrix still classifies every row as
# applicable, not-applicable, or blocked by a named input.
row_key = "resolved-header-path plus language-profile"
final_applicability_states = ["applicable", "not-applicable", "blocked-missing-input"]
all_rows_resolved = true

