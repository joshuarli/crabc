# Forward-looking native x86-64 header/layout foundation contract.
#
# This is deliberately a planning and accounting manifest, not a promotion.
# `headers-layouts.toml` remains the v1 inventory of fifty-three direct probes.
# This v15 manifest accounts for every pinned public header and every project-
# only extension, pins the one Linux-UAPI input needed by its wrapper paths,
# and records selected UAPI-wrapper, ioctl, x86 sys/io inline-port-I/O, epoll,
# event-descriptor, timeval-transitive, direct sys/time, and access-header profile ABI slices
# while making the remaining language, ABI, and linkage work explicit. It
# must not be read as a claim
# that a header's declarations link to, or execute through, a complete crabc
# libc.
# `compat/upstreams.toml#linux_5_10_uapi` owns the source/archive and derived
# x86 `headers_install` identity; it is repeated here and in the Docker build
# because those independent consumers cannot load TOML from one another.
schema = "crabc.x86_64-headers-layouts-foundation/v15"
family = "libc.headers-layouts"
target = "x86_64-unknown-linux-musl"
platform = "Linux/x86-64 little-endian"
kernel_msrv = "5.10"
status = "planned"
oracle = "Pinned musl 1.2.6"
legacy_direct_manifest = "compat/x86_64/headers-layouts.toml"
pinned_public_inventory = "compat/x86_64/public_headers.txt"
static_c_abi_exports = "compat/x86_64/static_c_abi_exports.txt"

[policy]
native_execution_only = true
project_headers_first = true
inventory_accounting = true
candidate_transitive_include_closure = true
selected_header_install_projection = true
full_c11_consumer_matrix = true
full_cxx17_consumer_matrix = true
feature_visibility_matrix = true
callable_feature_visibility_matrix = true
prototype_layout_matrix = true
abi_facet_matrix = false
callable_disposition = true
# The selected-provider audit proves ordinary extraction for the present
# default and verified feature providers only. The separate full audit remains
# false until every candidate callable, including the explicit unprovided set,
# has a complete archive-linkage contract.
selected_callable_provider_linkage_audit = true
callable_linkage_audit = false
aggregate_family_completion = false
runtime_completion = false
public_support = false

[completion]
# These `*_accounted` facts mean that the missing work is named and owned by
# this manifest. They do not mean the corresponding native evidence exists.
inventory_accounted = true
project_only_paths_accounted = true
uapi_paths_accounted = true
language_profiles_accounted = true
feature_modes_accounted = true
abi_facets_accounted = true
callable_linkage_owners_accounted = true
legacy_direct_inputs_accounted = true
uapi_wrapper_profile_matrix_slice = true
ioctl_header_profile_matrix_slice = true
sys_io_header_profile_matrix_slice = true
epoll_header_profile_matrix_slice = true
event_descriptors_header_profile_matrix_slice = true
dirent_header_profile_matrix_slice = true
stdlib_header_profile_matrix_slice = true
timeval_transitive_header_profile_matrix_slice = true
sys_time_direct_header_profile_matrix_slice = true
access_header_profile_matrix_slice = true
xattr_header_profile_matrix_slice = true
candidate_transitive_include_closure = true
selected_header_install_projection = true
c11_consumer_matrix = true
cxx17_consumer_matrix = true
feature_visibility_matrix = true
callable_feature_visibility_matrix = true
prototype_layout_matrix = true
abi_facet_matrix = false
callable_disposition = true
selected_callable_provider_linkage_audit = true
callable_linkage_audit = false
runtime_completion = false
family_promotion = false
public_support = false

