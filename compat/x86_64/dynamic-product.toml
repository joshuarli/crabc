# Current owned dynamic product contract. Building produces an unqualified
# installed artifact; only a live reviewed three-product receipt supplies
# qualification. Product evidence never completes prerequisite families or
# all-26/public-support promotion by itself.
schema = "crabc.x86_64-owned-dynamic-product/v1"
owner_family = "sysroot.owned-artifact"
status = "implemented-unqualified"
dynamic_family_ids = ["ldso.dynamic-runtime", "crt.dynamic-startup", "sysroot.owned-artifact"]
prerequisite_families = ["ldso.dynamic-runtime", "crt.dynamic-startup", "sysroot.static-tls"]

[product]
target = "x86_64-unknown-linux-musl"
source = "materialized installed crabc x86-64 sysroot"
link_interface = "deterministic owned dynamic link interface"
required_target_inputs = [
  "installed crabc headers",
  "crt1.o",
  "Scrt1.o",
  "crti.o",
  "crtn.o",
  "libc.so",
  "installed crabc interpreter",
  "compatibility interpreter alias",
  "libcrabc-builtins.a",
  "accepted allocator backend",
  "explicitly admitted application and DSO objects",
]
rejected_ambient_target_inputs = [
  "headers",
  "CRT",
  "libc",
  "libgcc",
  "compiler-rt",
  "loader",
  "undeclared DSO search paths",
]

[layout]
driver = "bin/crabc-cc-dynamic"
installed_manifest = "share/crabc/manifest.json"
dynamic_product_state = "share/crabc/dynamic-product-state.json"
canonical_interpreter = "/lib/ld-crabc-x86_64.so.1"
canonical_interpreter_file = "lib/ld-crabc-x86_64.so.1"
compatibility_interpreter_alias = "lib/ld-musl-x86_64.so.1"
compatibility_alias_target = "ld-crabc-x86_64.so.1"
shared_libc = "usr/lib/libc.so"

[[mode]]
id = "dynamic-pie"
link_kind = "executable"
elf_type = "ET_DYN"
crt_object = "Scrt1.o"
compiler_flag = "-fPIE"
interpreter = "/lib/ld-crabc-x86_64.so.1"

[[mode]]
id = "dynamic-non-pie"
link_kind = "executable"
elf_type = "ET_EXEC"
crt_object = "crt1.o"
compiler_flag = "-fno-pie"
interpreter = "/lib/ld-crabc-x86_64.so.1"

[[mode]]
id = "dynamic-shared-object"
link_kind = "shared-object"
elf_type = "ET_DYN"
crt_object = "none"
compiler_flag = "-fPIC"
interpreter = "absent"

[link_plan]
linker = "ld.lld"
executable_required = [
  "canonical PT_INTERP",
  "selected installed executable CRT",
  "installed crti.o and crtn.o",
  "exact installed libc.so",
  "exact installed libcrabc-builtins.a",
  "explicitly declared application DSOs only",
  "relro default-now and non-executable stack; declared lazy DSO imports only",
  "no ambient target search path or linker override",
]
shared_object_required = [
  "installed crti.o and crtn.o",
  "exact installed libc.so when the DSO declares it",
  "exact installed libcrabc-builtins.a when required",
  "no PT_INTERP",
  "relro default-now and non-executable stack; declared lazy DSO imports only",
  "no ambient target search path or linker override",
]

[purity]
source_translator = "pinned development environment only"
target_headers_crt_libraries_loader_and_link_decisions = "installed crabc artifact only"
ambient_target_runtime_fallback = "forbidden"
oracle_execution = "separate pinned-musl process only"

[inspections]
required = [
  "link trace",
  "link map",
  "ELF headers",
  "program headers",
  "dynamic section",
  "relocations",
  "symbol ownership",
  "TLS segments",
  "stack flags",
  "RELRO",
  "interpreter and compatibility alias",
  "DT_NEEDED and declared DSO search paths",
]
before_execution = "reject ambient libc loader CRT libgcc compiler-rt target headers and undeclared DSO search paths before executing the fixture"

[reproducibility]
clean_installed_builds = 2
artifact_set = "declared regular-file installed dynamic artifact set"
comparison = "byte-for-byte identical"
suite = "same declared dynamic smoke suite"

[extracted_smoke]
source = "one extracted packaged installed sysroot"
suite = "same declared dynamic smoke suite"

[oracle]
reference = "pinned musl 1.2.6"
execution = "separate process"
candidate_fallback = "forbidden"

[coverage]
required = [
  "installed main program initially loaded dependency graph and runtime-loaded plugin",
  "installed interpreter path and compatibility alias",
  "shared-libc loading and loader-to-libc RuntimeV1 handoff",
  "dependency search repeated dependencies symbol scope weak global protected behavior and selected relocations",
  "main dependency and plugin constructors reverse exit finalization retained dlclose mappings and failed-load rollback",
  "dlopen dlsym dlclose dlerror dladdr dlinfo and dl_iterate_phdr behavior",
  "initial IE and GD TLS runtime GD growth initial IE reopen and clean rejection of new runtime IE",
  "DTV growth before and after worker creation",
  "allocator errno stdio pthread/TSD signal and exit interaction across DSO boundaries",
  "concurrent open lookup close callback execution and admitted loader reentrancy",
  "fork child repair where selected",
  "clean failure for malformed unsupported missing and stale inputs plus once-only cyclic dependency lifecycle",
]

[non_promotion]
status = "implemented-owned-dynamic-product-requires-live-qualification-not-family-or-public-promotion"
driver_execution = "installed-translation-and-linking"
family_completion = false
promotion_ready = false
public_support = false
requires_separate_evidence = [
  "same-source receipt for declared dynamic smoke suite",
  "two-clean-build and extracted-install dynamic reproducibility",
  "sysroot.owned-artifact family completion",
  "x86-64 promotion or public support",
]

# A build is materialization only. Qualification is an ignored live-source
# receipt; its publication is reviewed separately from all family/platform gates.
[qualification]
validator = "compat/x86_64/owned_dynamic_qualification.py"
products = ["installed", "second", "extracted"]
source = "live nonignored source content and modes; clean revision at publication"
materialization = "manifest payload hashes plus source and both contract digests; never runtime publication"
receipt = "exact successful case matrix, immutable logs, base driver purity receipts, oracle identities and identical packages"
publication = "explicit reviewed receipt publication; no family or public promotion"
required_cases = ["cycle", "cli", "elf-scope-alias", "dlopen-pie", "dlopen-non-pie", "lazy-pie", "lazy-non-pie", "constructor-exit", "pthread-signal", "pthread-exit", "fork", "pthread-getattr", "pthread-join-cancel", "pthread-cond-cancel", "io-cancellation", "system-cancellation"]
