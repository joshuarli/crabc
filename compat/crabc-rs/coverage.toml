# Complete capability accounting for crabc's measured public ABI plus its
# selected timezone, resolver-transport, and basic-loader native seams.
#
# The dynamic symbol files are the measured AArch64 boundary. The embedded
# candidate list makes the ledger inspectable without a
# developer checkout; the validator cross-checks it and its SHA-256 digest
# against those source TSVs. A capability uses literal ``symbols`` for small
# irregular sets or ``symbol_patterns`` for a regular exported family. The
# validator expands patterns only against this frozen candidate set, rejects
# selectors which match nothing, and requires exactly one semantic owner for
# every resulting symbol. Thus patterns keep the ledger reviewable without
# weakening its exact 1,673-symbol accounting.
