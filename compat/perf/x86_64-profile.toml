# Closed native x86-64 supplemental performance workload contract.
#
# This profile adds representative normal-runtime rows. It is not a support,
# threshold, optimization, or release-qualification claim. The adapter owns
# sample collection and memory observation; this file pins only fixture inputs,
# outcomes, observation plateaus, and the split-artifact boundary.

legacy_memory_phase_count = 74

[profile]
schema = "crabc.perf.x86_64-profile/v1"
target = "x86_64-unknown-linux-musl"
observer_protocol = "crabc.perf.observer-r-c/v1"
observer_ready_env = "CRABC_PERF_OBSERVER_READY_FD"
observer_continue_env = "CRABC_PERF_OBSERVER_CONTINUE_FD"
observer_ready_fd = 97
observer_continue_fd = 98
timed_artifact_unchanged = true
observer_artifact_separate = true
observer_artifact_byte_identical = false
release_qualification = false

# Each sample is one measured client process. Its complete setup and teardown
# belong to the whole-process result; staged loopback peers are separate test
# infrastructure and never enter the client timing or cgroup measurement.
[execution_model]
measured_client_processes_per_row = 1
full_client_process_setup_included = true
staged_peer_endpoints_excluded_from_client_measurement = true

# `operations` names the selected repeated route unit. Setup needed to establish
# that route is pinned separately in each row's geometry and remains part of
# the process result.
[operation_counting]
operations_field = "selected-repeated-route-units"

[[fixture]]
binary = "x86_64_clock_allocator_workload"
source = "compat/perf/x86_64_clock_allocator_workload.c"
c_standard = "c11"
compile_defines = ["_GNU_SOURCE"]
link_flags = ["-pthread"]

[[fixture]]
binary = "x86_64_network_workload"
source = "compat/perf/x86_64_network_workload.c"
c_standard = "c11"
compile_defines = ["_GNU_SOURCE"]
link_flags = []

[[fixture]]
binary = "x86_64_primitive_boundary_workload"
source = "compat/perf/x86_64_primitive_boundary_workload.c"
c_standard = "c11"
compile_defines = ["_GNU_SOURCE"]
link_flags = []

# Every supplemental invocation is exactly:
#   BINARY MODE ITERATIONS [fixed arguments declared in argv]
# The observer descriptor pair is opt-in. When both environment variables are
# absent, timed execution does not open, write, or read an observer descriptor.
# When both are present, each must be canonical decimal >= 3; the fixture writes
# byte R at observer_phase and requires one C before cleanup and "ok\n".

[[supplemental_row]]
id = "clock_gettime_realtime"
binary = "x86_64_clock_allocator_workload"
mode = "clock_gettime"
iterations = 200000
argv = ["0"]
observer_phase = "clock-final-call"
requires_loopback_peer = false
requires_hermetic_resolver_files = false
operations = 200000
result_contract = "each clock_gettime succeeds and produces 0 <= tv_nsec < 1000000000"
geometry = { clock_id = 0, calls = 200000 }

