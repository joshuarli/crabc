# The resolver rows run only in a root that owns these exact conventional
# files. The DNS server and all peers live outside the measured client process
# and client cgroup. The hosts-only row still receives a staged resolver file:
# peer event evidence rejects any DNS request for its successful hosts lookup.
[resolver_setup]
dns_server = "compat/resolver-network/dns_server.py"
dns_protocol = "resolver-network-dns-v1"
dns_port = 53
loopback_nameservers = ["127.0.0.1", "127.0.0.2", "127.0.0.3"]
resolv_conf = """# crabc native performance resolver fixture
nameserver 127.0.0.1
nameserver 127.0.0.2
nameserver 127.0.0.3
search search.test
options ndots:1 timeout:1 attempts:1
"""
hosts_conf = """127.0.0.1 localhost
::1 localhost
127.0.0.77 perf-host.example.test
2001:db8::77 perf-host.example.test
"""

# The adapter emits one observer artifact per timed fixture artifact and keeps
# its memory samples separate. PSS is the maximum across the listed ordered
# checkpoints; cgroup memory.peak is read from a fresh client-only leaf after
# complete process exit. There are deliberately no per-checkpoint ratios or
# performance thresholds.
[memory_observation]
timing_and_memory_artifacts = "separate"
pss = "maximum-declared-checkpoints"
cgroup_peak = "fresh-client-leaf-after-exit"

[[legacy_memory_phase]]
rows = ["startup", "startup_constructor_destructor", "startup_dependency_graph"]
checkpoint = "before and after original main; dependencies and constructor/main state remain live"
peak_rule = "maximum-declared-checkpoints"

[[legacy_memory_phase]]
rows = ["clock_gettime", "gettimeofday", "getpid"]
checkpoint = "after final successful selected call with calling frame live"
peak_rule = "maximum-declared-checkpoints"

[[legacy_memory_phase]]
rows = ["open_close"]
checkpoint = "before final close with the real descriptor open"
peak_rule = "maximum-declared-checkpoints"

[[legacy_memory_phase]]
rows = ["fd_file_4k"]
checkpoint = "after final verified round trip and before descriptor close"
peak_rule = "maximum-declared-checkpoints"

