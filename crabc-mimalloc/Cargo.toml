[package]
name = "crabc-mimalloc"
version.workspace = true
edition.workspace = true
description = "Pinned Rust mimalloc port: Linux/AArch64 production plus private native x86 evidence"
# The allocator contains MIT-only semantic translations of pinned mimalloc.
license = "MIT"
repository.workspace = true
publish = false

[lib]
name = "crabc_mimalloc"

[[test]]
name = "native_post_exit_registry_high_water"
path = "tests/native_post_exit_registry_high_water.rs"
# The scalar registry audit is compiled only for this direct lifecycle test.
# It is not part of the production allocator or libc friend surface.
required-features = ["native-runtime-test-audit"]

[[test]]
name = "native_live_remote_owner_registry_reuse"
path = "tests/native_live_remote_owner_registry_reuse.rs"
# The scalar registry audit is compiled only for this direct lifecycle test.
# It is not part of the production allocator or libc friend surface.
required-features = ["native-runtime-test-audit"]

[[test]]
name = "native_post_exit_failed_os_release"
path = "tests/native_post_exit_failed_os_release.rs"
# This direct-only fault witness crosses the native B-side registry boundary.
# Neither the fault hook nor its scalar audit ships in the production surface.
required-features = ["native-runtime-test-audit", "native-runtime-test-fault"]

[features]
default = []
# Private, allocation-backed process context used only by the standalone
# prefixed C adapter's tests. Production builds retain the allocation-free engine.
test-adapter = []
# Enables the private Loom model for the bounded live and abandoned remote-head protocols.
# This is meaningful only for this crate's unit-test build, where `loom` is a
# dev-dependency; it never selects a production atomic backend.
loom = []
# Retains named, test-only witnesses for the allocator's private compiler-TLS
# roots so the pinned target-specific ELF harness can inspect their exact access model.
# Normal allocator builds expose neither these witnesses nor a TLS ABI.
tls-codegen-probe = []
# Enables read-only scalar lifecycle and fork-admission audits used by the
# isolated native post-exit and live-owner registry high-water regressions and
# the test-only ticket-zero C soak adapter. They expose no route, raw client
# address, PageMap root, allocator, or release capability and are absent from
# normal builds.
native-runtime-test-audit = []
# Enables one deliberately narrow direct-test injection: the next allocator
# `munmap` fails while the native post-exit registry owns its source route.
# It is absent from normal allocator and libc builds.
native-runtime-test-fault = []

[dependencies]
chacha20 = { version = "=0.10.1", default-features = false, features = ["legacy", "zeroize"] }
crabc-core = { path = "../crabc-core", features = ["allocator-x86-evidence"] }
zeroize = { version = "=1.9.0", default-features = false }

[dev-dependencies]
# Test-only finite scheduler for the exact live and abandoned remote-head transitions.
# See `src/remote_free_loom.rs`; this is deliberately absent from normal
# Linux/AArch64 and Linux/x86-64 allocator builds.
loom = { version = "=0.7.2", default-features = false }
