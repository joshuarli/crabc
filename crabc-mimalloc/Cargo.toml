[package]
name = "crabc-mimalloc"
version.workspace = true
edition.workspace = true
description = "Pinned Rust port of the Linux/AArch64 mimalloc allocator engine"
# The allocator contains MIT-only semantic translations of pinned mimalloc.
license = "MIT"
repository.workspace = true
publish = false

[lib]
name = "crabc_mimalloc"

[features]
default = []
# Private, allocation-backed process context used only by the standalone
# prefixed C adapter's tests. Production builds retain the allocation-free engine.
test-adapter = []
# Enables the private Loom model for the bounded live and abandoned remote-head protocols.
# This is meaningful only for this crate's unit-test build, where `loom` is a
# dev-dependency; it never selects a production atomic backend.
loom = []

[dependencies]
chacha20 = { version = "=0.10.1", default-features = false, features = ["legacy", "zeroize"] }
crabc-core = { path = "../crabc-core" }
zeroize = { version = "=1.9.0", default-features = false }

[dev-dependencies]
# Test-only finite scheduler for the exact live and abandoned remote-head transitions.
# See `src/remote_free_loom.rs`; this is deliberately absent from normal
# Linux/AArch64 allocator builds.
loom = { version = "=0.7.2", default-features = false }
