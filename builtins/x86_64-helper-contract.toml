# Exact producer contract for the bounded native x86-64 compiler-helper archive.
#
# These are unversioned C compiler-runtime entries from reviewed Rust C ABI
# definitions and the x86 binary80 global assembly included by `src/lib.rs`.
# The `source_definition` field records either a real Rust definition
# or the exact assembly export directives, without inventing a Rust fp80 type.
# They are
# installed as ordinary archive providers. The owned shared-libc link also
# consumes that exact one-member archive for its private compiler-generated
# calls: that physical copy is LOCAL in libc.so and absent from .dynsym. This
# does not alter either installed archive's GLOBAL DEFAULT provider contract.
schema = 1
target = "x86_64-unknown-linux-musl"
owner_group = "owned-compiler-helper-archive"
source = "builtins/src/lib.rs"
builder = "builtins/build_x86_64.py"
producer_scope = "bounded native compiler-helper archive plus private same-member shared-libc placement; no shared public exposure, family completion, promotion, or public support"

[archive]
name = "libcrabc-builtins.a"
member = "crabc-builtins.o"
placements = ["static-builtins", "dynamic-builtins"]

[shared_libc]
artifact = "candidate-shared"
linker_option = "--exclude-libs=libcrabc-builtins.a"
type = "FUNC"
binding = "LOCAL"
visibility = "DEFAULT"
dynsym = false

[[helpers]]
name = "__addoti4"
source_definition = 'pub unsafe extern "C" fn __addoti4(left: Uint128, right: Uint128, overflow: *mut i32) -> Uint128'
c_abi = "u128-overflow-slot"
caller_obligation = "one non-null writable int overflow slot"
metadata = { type = "FUNC", binding = "GLOBAL", visibility = "DEFAULT", version = "unversioned", version_default = false }

